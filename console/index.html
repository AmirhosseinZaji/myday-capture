<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>myday</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="myday">
<meta name="theme-color" content="#FBFAF9">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
/* ─────────────────────────────────────────────────────────────────────────
   myday — light and calm.

   The whole site is built around one idea: consistency, focus and goals only
   work together. Those three are the triangle, they own the three accent
   colours below, and every screen uses the same colour for the same corner so
   the meaning never has to be re-learned.
   ───────────────────────────────────────────────────────────────────────── */
:root{
  /* paper and ink */
  --bg:#FBFAF9; --surface:#FFFFFF; --surface-2:#F6F4F1;
  --line:#EAE6E1; --line-soft:#F2EFEB;
  --ink:#1C1917; --ink-2:#57534E; --ink-3:#8C8681;

  /* the three corners. same colour, same meaning, everywhere. */
  --consistency:#C2703D; --consistency-soft:#FBF0E8;
  --focus:#3F7D6E;       --focus-soft:#EAF3F0;
  --goals:#6B5CA5;       --goals-soft:#F0EDF7;

  --good:#3F7D6E; --warn:#C2703D; --bad:#B0413E;

  --r:16px; --r-sm:10px; --r-lg:16px;
  --shadow:0 1px 2px rgba(28,25,23,.04), 0 8px 24px -12px rgba(28,25,23,.10);
  --shadow-lg:0 2px 4px rgba(28,25,23,.05), 0 18px 48px -20px rgba(28,25,23,.18);
  --ease:cubic-bezier(.22,.61,.36,1);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overscroll-behavior-y:none;
}
h1,h2,h3{margin:0; font-weight:600; letter-spacing:-.015em}
p{margin:0}
button{font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer;
  -webkit-tap-highlight-color:transparent}
input,textarea{font:inherit; color:inherit}
.serif{font-family:"Instrument Serif",Georgia,"Times New Roman",serif; font-weight:400; letter-spacing:0}

/* ── layout ─────────────────────────────────────────────────────────────── */
#app{min-height:100dvh; display:flex; flex-direction:column}
.topbar{
  position:sticky; top:0; z-index:40; padding:calc(var(--safe-t) + 14px) 20px 12px;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:saturate(180%) blur(14px); -webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid transparent; transition:border-color .2s;
  display:flex; align-items:baseline; gap:12px;
}
.topbar.scrolled{border-bottom-color:var(--line)}
.topbar h1{font-size:19px}
.topbar .date{margin-left:auto; font-size:13px; color:var(--ink-3); white-space:nowrap}
main{flex:1; padding:4px 20px calc(160px + var(--safe-b)); max-width:760px; width:100%; margin:0 auto}
.page{display:none}
.page.on{display:block; animation:rise .36s var(--ease) both}
@keyframes rise{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}

/* ── cards ──────────────────────────────────────────────────────────────── */
.card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:18px; margin:14px 0; box-shadow:var(--shadow); min-width:0;
}
.card.flush{padding:0; overflow:hidden}
.card h2{font-size:12px; font-weight:600; letter-spacing:.09em; text-transform:uppercase;
  color:var(--ink-3); margin-bottom:14px}
.row{display:flex; align-items:center; gap:12px}
.spread{display:flex; align-items:center; justify-content:space-between; gap:12px}
.muted{color:var(--ink-3)}
.prose{max-width:66ch}
.dim{color:var(--ink-2)}
.tiny{font-size:12px}
.small{font-size:13px}
.stack{display:flex; flex-direction:column; gap:10px}
.grid2{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:12px}
.grid3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px}

/* ── the triangle ───────────────────────────────────────────────────────── */
.tri-wrap{display:flex; flex-direction:column; align-items:center; padding:6px 0 0}
.tri-svg{width:100%; max-width:330px; height:auto; overflow:visible}
.tri-guide{fill:none; stroke:var(--line); stroke-width:1}
.tri-ring{fill:none; stroke:var(--line-soft); stroke-width:1}
.tri-axis{stroke:var(--line); stroke-width:1}
.tri-shape-g{animation:triIn .75s var(--ease) both}
@keyframes triIn{from{transform:scale(.2); opacity:0} to{transform:scale(1); opacity:1}}
.tri-dot{stroke:#fff; stroke-width:2.5}
.tri-label{font-size:10.5px; font-weight:600; letter-spacing:.07em; text-transform:uppercase}
.tri-val{font-family:"Instrument Serif",Georgia,serif; font-size:19px}
.tri-unit{font-size:8.5px; letter-spacing:.05em; text-transform:uppercase}
.tri-score{text-align:center; margin-top:2px}
.tri-score .n{font-family:"Instrument Serif",Georgia,serif; font-size:56px; line-height:1;
  letter-spacing:-.02em}
.tri-score .n sup{font-size:22px; vertical-align:top; margin-left:2px; color:var(--ink-3)}
.tri-score .cap{font-size:12px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3);
  margin-top:6px}
.advice{
  margin-top:16px; padding:13px 15px; border-radius:var(--r-sm); font-size:13.5px;
  background:var(--surface-2); border:1px solid var(--line-soft); color:var(--ink-2);
  display:flex; gap:9px; align-items:flex-start;
}
.advice b{color:var(--ink); font-weight:600}
.advice .pip{width:8px; height:8px; border-radius:50%; margin-top:6px; flex:0 0 auto}

/* ── corner stats ───────────────────────────────────────────────────────── */
.corner{
  border:1px solid var(--line); border-radius:var(--r-sm); padding:12px 13px; background:var(--surface);
  display:flex; flex-direction:column; gap:7px; text-align:left;
  transition:transform .2s var(--ease), box-shadow .2s var(--ease);
}
.corner:active{transform:scale(.975)}
.corner .lab{font-size:10.5px; font-weight:600; letter-spacing:.07em; text-transform:uppercase}
.corner .val{font-family:"Instrument Serif",Georgia,serif; font-size:28px; line-height:1}
.corner .sub{font-size:11.5px; color:var(--ink-3)}
.bar{height:4px; border-radius:3px; background:var(--line); overflow:hidden}
.bar > i{display:block; height:100%; border-radius:3px; width:0;
  transform-origin:left center; animation:growBar .9s var(--ease) both}
@keyframes growBar{from{transform:scaleX(0)} to{transform:scaleX(1)}}

/* ── month strip ────────────────────────────────────────────────────────── */
.strip-wrap{position:relative}
.strip-wrap::after{
  content:""; position:absolute; right:0; top:0; bottom:8px; width:34px; pointer-events:none;
  background:linear-gradient(to right, transparent, var(--surface));
}
.strip{display:flex; gap:3px; overflow-x:auto; padding:4px 0 8px; scrollbar-width:none;
  scroll-snap-type:x proximity}
.strip::-webkit-scrollbar{display:none}
.strip .d{scroll-snap-align:end}
.strip .d{flex:0 0 auto; width:34px; text-align:center; cursor:pointer;
  border-radius:8px; padding:2px 0; transition:background .16s}
.strip .d:hover{background:var(--surface-2)}
.strip .d svg{display:block; width:34px; height:auto}
.strip .d .dl{font-size:9px; color:var(--ink-3); margin-top:2px}
.strip .d.sel .dl{color:var(--ink); font-weight:700}

/* ── session / list rows ────────────────────────────────────────────────── */
.item{display:flex; gap:12px; align-items:center; padding:13px 16px; border-bottom:1px solid var(--line-soft)}
.item:last-child{border-bottom:0}
.item .grow{flex:1; min-width:0}
.item .t{font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  unicode-bidi:plaintext}
.tk .t, .goal .txt{unicode-bidi:plaintext}
.item .s{font-size:12px; color:var(--ink-3); margin-top:2px}
.pill{font-size:11px; font-weight:600; padding:3px 8px; border-radius:99px; white-space:nowrap}
.fscore{
  width:34px; height:34px; flex:0 0 auto; border-radius:10px; display:grid; place-items:center;
  font-family:"Instrument Serif",Georgia,serif; font-size:17px; border:1px solid transparent;
}
.fscore.none{background:var(--consistency-soft); border:1px solid var(--consistency);
  color:var(--consistency); font-family:Inter,sans-serif; font-size:9.5px; font-weight:700;
  letter-spacing:.02em; line-height:1.05; text-align:center}
.fscore.live{background:var(--focus-soft); border:1px solid var(--focus); color:var(--focus);
  font-family:Inter,sans-serif; font-size:10px; font-weight:700}
.dur{font-variant-numeric:tabular-nums; font-size:13px; color:var(--ink-2); white-space:nowrap}

/* ── buttons ────────────────────────────────────────────────────────────── */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:13px 20px; border-radius:12px; font-weight:600; font-size:14.5px;
  border:1px solid var(--line); background:var(--surface); color:var(--ink);
  transition:transform .16s var(--ease), background .16s, box-shadow .16s;
}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--ink); color:#fff; border-color:var(--ink)}
.btn.stop{background:var(--bad); color:#fff; border-color:var(--bad)}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45; pointer-events:none}

/* ── the big start/stop ─────────────────────────────────────────────────── */
.runner{
  border-radius:var(--r); padding:18px; border:1px solid var(--line);
  background:var(--surface); box-shadow:var(--shadow); margin:14px 0;
}
.runner.live{border-color:color-mix(in srgb,var(--focus) 40%,var(--line)); background:var(--focus-soft)}
.runner .clock{font-family:"Instrument Serif",Georgia,serif; font-size:44px; line-height:1;
  font-variant-numeric:tabular-nums}
.livedot{width:8px;height:8px;border-radius:50%;background:var(--focus);
  animation:pulse 2s var(--ease) infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}

/* ── nav ────────────────────────────────────────────────────────────────── */
.nav{
  position:fixed; left:0; right:0; bottom:0; z-index:50;
  padding:8px 10px calc(8px + var(--safe-b)); display:flex; gap:2px;
  background:color-mix(in srgb, var(--bg) 90%, transparent);
  backdrop-filter:saturate(180%) blur(16px); -webkit-backdrop-filter:saturate(180%) blur(16px);
  border-top:1px solid var(--line);
}
.nav button{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:6px 1px; border-radius:11px; color:var(--ink-3); font-size:9.5px; font-weight:600;
  letter-spacing:.02em; transition:color .18s, background .18s;
}
.nav button .ic{font-size:17px; line-height:1}
.nav button.on{color:var(--ink); background:var(--surface-2)}

/* ── the microphone, on every page ──────────────────────────────────────── */
/* The microphone is a bar, not a floating blob. A floating button parks itself
   on top of whatever control happens to scroll under it, and it did exactly
   that to the Start button. As part of the fixed chrome it can never cover
   anything, and main's bottom padding accounts for its height. */
.micwrap{position:fixed; left:0; right:0; bottom:calc(62px + var(--safe-b)); z-index:60}
.mic{
  display:flex; align-items:center; justify-content:center; gap:10px; width:100%;
  padding:14px 20px; background:var(--ink); color:#fff; font-size:14.5px; font-weight:600;
  border-top:1px solid rgba(255,255,255,.08);
  transition:background .18s var(--ease), padding .18s var(--ease);
  touch-action:none; user-select:none; -webkit-user-select:none;
}
.mic .ring{width:11px; height:11px; border-radius:50%; background:#fff; opacity:.85}
.mic:active,.mic.rec{background:var(--bad); padding:18px 20px}
.mic.rec .ring{animation:ripple 1.1s var(--ease) infinite}
@keyframes ripple{0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(.55);opacity:.5}}
/* The hint used to be its own strip. Three stacked bars took about 145 CSS px
   of an iPhone screen on every page, so it lives inside the bar now. */
.mic-hint{display:block; font-size:11.5px; font-weight:400; opacity:.72; margin-top:2px}

/* ── sheet (focus prompt, editors) ──────────────────────────────────────── */
.scrim{position:fixed; inset:0; z-index:80; background:rgba(28,25,23,.34);
  opacity:0; pointer-events:none; transition:opacity .26s var(--ease)}
.scrim.on{opacity:1; pointer-events:auto}
.sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:90;
  background:var(--surface); border-radius:22px 22px 0 0; padding:22px 20px calc(24px + var(--safe-b));
  transform:translateY(102%); transition:transform .34s var(--ease);
  box-shadow:0 -12px 44px -16px rgba(28,25,23,.28); max-height:88dvh; overflow-y:auto;
}
.sheet.on{transform:none}
.sheet .grab{width:38px; height:4px; border-radius:3px; background:var(--line);
  margin:-8px auto 16px}
.sheet h3{font-size:19px; margin-bottom:6px}

/* ── the 1 to 10 focus picker ───────────────────────────────────────────── */
.scale{display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin:18px 0 4px}
.scale button{
  aspect-ratio:1; border-radius:13px; border:1px solid var(--line); background:var(--surface);
  font-family:"Instrument Serif",Georgia,serif; font-size:22px; color:var(--ink-2);
  transition:transform .14s var(--ease), background .14s, color .14s, border-color .14s;
}
.scale button:active{transform:scale(.92)}
.scale button.on{background:var(--focus); border-color:var(--focus); color:#fff}
.scale-ends{display:flex; justify-content:space-between; font-size:11.5px; color:var(--ink-3);
  margin-top:9px}

/* ── goals ──────────────────────────────────────────────────────────────── */
.goal{padding:15px 16px; border-bottom:1px solid var(--line-soft)}
.goal:last-child{border-bottom:0}
.goal .top{display:flex; gap:11px; align-items:flex-start}
.goal .tick{
  width:22px;height:22px;border-radius:7px;border:1.5px solid #C9C2BA;flex:0 0 auto;
  display:grid;place-items:center;font-size:12px;color:#fff;background:var(--surface);
  transition:.18s var(--ease); margin-top:1px;
}
.goal .tick.on{background:var(--goals); border-color:var(--goals)}
.goal .txt{flex:1; font-weight:500; line-height:1.4}
.goal.done .txt{color:var(--ink-3)}
.goal.done .txt .gt{text-decoration:line-through}
.goal .pct{font-variant-numeric:tabular-nums; font-size:13px; color:var(--ink-3); font-weight:600}
.slider{width:calc(100% - 33px); margin:12px 0 0 33px; accent-color:var(--goals)}
.goal .bar{margin-left:33px; width:calc(100% - 33px)}
.nag{
  background:var(--goals-soft); border:1px solid color-mix(in srgb,var(--goals) 26%,transparent);
  border-radius:var(--r); padding:17px; margin:14px 0;
}
.nag h3{color:var(--goals); font-size:15px; margin-bottom:6px}

/* ── calendar timeline ──────────────────────────────────────────────────── */
.timeline{position:relative; margin:6px 0 4px; padding-left:46px}
.timeline .hr{position:absolute; left:0; width:100%; border-top:1px solid var(--line-soft)}
.timeline .hrlab{position:absolute; left:0; font-size:10.5px; color:var(--ink-3);
  transform:translateY(-50%); font-variant-numeric:tabular-nums}
.blk{
  position:absolute; left:46px; right:2px; border-radius:9px; padding:5px 9px; overflow:hidden;
  font-size:12px; font-weight:500; border:1px solid transparent;
}
.blk .bt{font-size:10px; opacity:.75; font-weight:600}
.blk.tight{display:flex; align-items:center; gap:6px; padding-top:0; padding-bottom:0}
.blk.actual{right:calc(50% + 3px)}
.blk.planned{left:calc(46px + 50% + 3px)}
/* Two 150px columns on a phone truncate every label, so the narrow layout uses
   one full-width Actual column and lists the plan underneath it. */
.tl-one{display:block}
.tl-two{display:none}
.timeline.solo .blk.actual{right:2px}
.timeline.solo .blk.planned{display:none !important}
@media (min-width:640px){ .tl-one{display:none} .tl-two{display:block} }

/* ── task rows ──────────────────────────────────────────────────────────── */
.chips-wrap{position:relative}
.chips-wrap::after{content:""; position:absolute; right:0; top:0; bottom:12px; width:30px;
  pointer-events:none; background:linear-gradient(to right, transparent, var(--bg))}
.chips{display:flex; gap:7px; overflow-x:auto; padding:2px 0 12px; scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto; padding:7px 13px; border-radius:99px; border:1px solid var(--line);
  background:var(--surface); font-size:12.5px; font-weight:600; color:var(--ink-2);
}
.chip.on{background:var(--ink); color:#fff; border-color:var(--ink)}
.tk{display:flex; gap:12px; align-items:flex-start; padding:13px 16px;
  border-bottom:1px solid var(--line-soft)}
.tk:last-child{border-bottom:0}
.tk .box{width:21px;height:21px;border-radius:7px;border:1.5px solid #C9C2BA;flex:0 0 auto;
  display:grid;place-items:center;background:var(--surface);transition:.18s;margin-top:1px}
.tk .box.on{background:var(--ink);border-color:var(--ink);color:#fff;font-size:12px}
.tk.ticked .t{color:var(--ink-3); text-decoration:line-through}

/* ── misc ───────────────────────────────────────────────────────────────── */
.empty{text-align:center; padding:44px 20px; color:var(--ink-3)}
.empty .ico{font-size:30px; margin-bottom:10px; opacity:.5}
.toast{
  position:fixed; left:50%; bottom:calc(150px + var(--safe-b)); z-index:100;
  transform:translate(-50%,10px); background:var(--ink); color:#fff;
  padding:11px 17px; border-radius:12px; font-size:13.5px; font-weight:500;
  opacity:0; pointer-events:none; transition:.24s var(--ease); box-shadow:var(--shadow-lg);
  max-width:calc(100vw - 40px); text-align:center;
}
.toast.on{opacity:1; transform:translate(-50%,0)}
.skel{background:linear-gradient(90deg,var(--surface-2) 25%,var(--line-soft) 50%,var(--surface-2) 75%);
  background-size:200% 100%; animation:sk 1.4s linear infinite; border-radius:8px}
@keyframes sk{from{background-position:200% 0} to{background-position:-200% 0}}
.setup{max-width:420px; margin:60px auto; padding:0 22px; text-align:center}
.setup input{width:100%; padding:13px; border:1px solid var(--line); border-radius:11px;
  margin:10px 0; background:var(--surface)}

/* ── desktop ────────────────────────────────────────────────────────────── */
/* ── desktop ─────────────────────────────────────────────────────────────
   The header, the navigation and the content all sit inside one column of the
   same width, so the page has a single left and right margin instead of three
   different ones. The wide screen is used by putting the triangle beside the
   things that explain it rather than stacking them down a narrow strip. */
@media (min-width:900px){
  :root{ --col: 1040px; }
  .topbar{
    max-width:var(--col); margin:0 auto; width:100%; padding:22px 24px 14px;
    background:transparent; backdrop-filter:none; -webkit-backdrop-filter:none;
  }
  .topbar.scrolled{border-bottom-color:transparent}
  .topbar h1{font-size:24px}
  main{max-width:var(--col); padding:0 24px 128px}
  .nav{
    position:sticky; top:0; bottom:auto; border-top:0; border-bottom:1px solid var(--line);
    max-width:var(--col); margin:0 auto; width:100%; padding:10px 24px; gap:4px;
    background:color-mix(in srgb, var(--bg) 92%, transparent);
  }
  .nav button{flex:0 0 auto; flex-direction:row; gap:8px; font-size:13.5px; padding:9px 15px}
  .nav button .ic{font-size:15px}

  /* The talk bar is a control, not a slab across the whole screen. */
  .micwrap{bottom:26px; left:50%; transform:translateX(-50%); right:auto;
    width:min(var(--col) - 48px, calc(100vw - 48px)); box-shadow:var(--shadow-lg);
    border-radius:16px; overflow:hidden}
  .mic{padding:15px 20px}


  /* Two columns where the content genuinely pairs up. */
  .split{display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,0.95fr);
    gap:16px; align-items:start}
  .split > *{margin-top:0}
  .cols2{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:16px;
    align-items:start}
  .cols2 > *{margin-top:0}
  
  main > .btn.wide{max-width:340px}
  .sheet{left:50%; right:auto; transform:translate(-50%,102%); width:480px;
    border-radius:22px; bottom:110px}
  .sheet.on{transform:translate(-50%,0)}
  .toast{bottom:132px}
}
@media (min-width:1180px){
  .strip .d{width:38px}
  .strip .d svg{width:38px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001s !important; transition-duration:.001s !important}
}
</style>
</head>
<body>
<div id="app"></div>
<div class="scrim" id="scrim"></div>
<div class="toast" id="toast"></div>
<script>
/* ═════════════════════════════════════════════════════════════════════════
   myday console.

   The site never writes to the markdown files. It renders a blob the Mac
   publishes, and it records what Amir taps as events. Claude files those back
   into tasks/ and days/ by hand. That boundary is what makes the markdown
   trustworthy, and it is the same contract the voice notes have always had.
   ═════════════════════════════════════════════════════════════════════════ */
'use strict';

/* Bump on every deploy. The page compares this against the copy the server has
   and reloads itself when they differ, because a phone with the app already
   open would otherwise keep showing yesterday's build forever. Shipping correct
   code with a stale BUILD looks exactly like the deploy failing. */
var BUILD = 'c46-2026-09-01-weeks';

/* ── config ─────────────────────────────────────────────────────────────── */
/* The Supabase URL and the publishable key ride in the #fragment, exactly as the
   Apps Script token used to. A fragment is never sent to a server and never
   committed, so the public repo holds no key. It must stay in the address bar:
   iOS gives a Home Screen web app its own storage, so an icon saved without the
   fragment opens to "Not linked yet" no matter what Safari has. */
var TAB_KEYS = ['home','time','focus','goals','tasks','notes'];
var CFG = null;
function loadCfg(){
  var h = location.hash.replace(/^#/,'');
  if(h){
    var p = new URLSearchParams(h), u = p.get('u'), k = p.get('k');
    if(u && k){
      CFG = {url:u.replace(/\/+$/,''), key:k};
      try{ localStorage.setItem('myday_cfg2', JSON.stringify(CFG)); }catch(e){}
    }
    // An optional `tab` opens the link straight on one page. It is read but
    // never stored, so it is a deep link rather than a preference.
    var t = p.get('tab');
    if(t && TAB_KEYS.indexOf(t) >= 0) TAB = t;
    if(CFG) return CFG;
  }
  try{ CFG = JSON.parse(localStorage.getItem('myday_cfg2')||'null'); }catch(e){ CFG = null; }
  return CFG;
}

/* ── api ────────────────────────────────────────────────────────────────── */
function hdrs(extra){
  var h = {apikey:CFG.key, Authorization:'Bearer '+CFG.key, 'Content-Type':'application/json'};
  for(var k in (extra||{})) h[k] = extra[k];
  return h;
}
async function api(path, opts){
  opts = opts || {};
  var r = await fetch(CFG.url + path, {
    method: opts.method || 'GET',
    headers: hdrs(opts.headers),
    cache: 'no-store',
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  if(!r.ok){
    var body = await r.text();
    /* A 409 on an event means its qid is already in the table, so the row DID
       reach the server and only the reply was lost. Treating that as a failure
       left the event unsent forever, and flushPend then stopped on it and
       nothing the user tapped ever sent again. */
    if(r.status === 409 || /duplicate key|23505/.test(body)){
      var dup = new Error('duplicate'); dup.duplicate = true; throw dup;
    }
    throw new Error(path + ' → ' + r.status + ' ' + body.slice(0,160));
  }
  var txt = await r.text();
  return txt ? JSON.parse(txt) : null;
}
async function getState(){
  var rows = await api('/rest/v1/state?id=eq.1&select=blob,updated_at');
  return rows && rows[0] ? rows[0] : null;
}
async function postEvent(kind, payload, qid, ts){
  return api('/rest/v1/events', {
    method:'POST', headers:{Prefer:'return=minimal'},
    body:[{kind:kind, payload:payload||{}, qid:qid, client_ts:ts||nowISO()}]
  });
}
async function postEntry(text, page, ts){
  return api('/rest/v1/entries', {
    method:'POST', headers:{Prefer:'return=minimal'},
    body:[{text:text, page:page||null, client_ts:ts||nowISO()}]
  });
}

/* ── time ───────────────────────────────────────────────────────────────── */
function pad(n){ return (n<10?'0':'') + n; }
function nowISO(){
  var d = new Date(), off = -d.getTimezoneOffset(),
      sg = off>=0?'+':'-', a = Math.abs(off);
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+
         pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())+
         sg+pad(Math.floor(a/60))+':'+pad(a%60);
}
function hhmm(d){ d = d||new Date(); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function localStamp(iso){
  /* Postgres hands timestamps back in UTC. Printing one raw told Amir his day
     had updated at 07:12 when his clock said 00:12. */
  var d = new Date(iso);
  if(isNaN(d)) return String(iso).replace('T',' ').slice(0,16);
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+
         pad(d.getHours())+':'+pad(d.getMinutes());
}
function hm(m){
  if(m===null||m===undefined) return '·';
  m = Math.max(0, Math.round(m));
  return Math.floor(m/60)+'h'+pad(m%60)+'m';
}
function hmShort(m){
  if(!m) return '0h';
  var h = Math.floor(m/60), r = m%60;
  return h ? (r ? h+'h'+pad(r) : h+'h') : r+'m';
}
function minsSince(hhmmStr, sinceIso){
  if(!hhmmStr) return 0;
  /* With a real start timestamp this is exact. Without one it falls back to the
     clock, which wraps at 24 hours: a session opened at 09:00 yesterday and
     still open at 10:00 today used to read 1h00m instead of 25h. */
  if(sinceIso){
    var t = Date.parse(sinceIso);
    if(!isNaN(t)) return Math.max(0, Math.round((Date.now() - t) / 60000));
  }
  var p = hhmmStr.split(':'), n = new Date();
  var start = p[0]*60 + (+p[1]), now = n.getHours()*60 + n.getMinutes();
  if(now < start) now += 24*60;          // ran past midnight

function pct(x){ return Math.round((x||0)*100); }

/* ── pending events: the optimistic overlay ─────────────────────────────── */
/* The Mac files taps every 15 minutes, so between a tap and the next publish
   the blob does not know about it. Without this overlay Amir presses Start and
   the screen sits there insisting nothing is running. Each pending event is
   saved to localStorage BEFORE it is sent, so losing signal mid-tap costs
   nothing, and it is dropped once the published state has clearly caught up. */
var PEND = [];
function loadPend(){
  try{
    var v = JSON.parse(localStorage.getItem('myday_pending')||'[]');
    // Shape-checked, not just array-checked. An entry missing `at` reached
    // minsBetween as undefined, threw, and put the app on the error card whose
    // only button reloads the same broken entry straight back in.
    PEND = (Array.isArray(v) ? v : []).filter(function(e){
      return e && typeof e.qid === 'string' && typeof e.kind === 'string' &&
             typeof e.ts === 'string' && typeof e.at === 'string';
    });
  }catch(e){ PEND = []; }
}
function savePend(){
  try{ localStorage.setItem('myday_pending', JSON.stringify(PEND)); return true; }
  catch(e){ return false; }
}
function newQid(){
  return 'q' + Date.now().toString(36) + Math.random().toString(36).slice(2,9);
}
function dropSupersededGoalEvents(title){
  /* Only the latest change to one goal matters. Dragging 40 to 60 and back to
     40 left the 60 pending, because the 40 matched the published value and was
     pruned first, and the slider then snapped back to 60. */
  var key = (title || '').trim().toLowerCase();
  PEND = PEND.filter(function(e){
    return !(e.kind === 'goal_progress' &&
             ((e.payload || {}).title || '').trim().toLowerCase() === key);
  });
}
async function record(kind, payload){
  if(kind === 'goal_progress') dropSupersededGoalEvents((payload || {}).title);
  var ev = {qid:newQid(), kind:kind, payload:payload||{}, ts:nowISO(),
            at:hhmm(), sent:false};
  PEND.push(ev);
  var stored = savePend();
  render();
  try{
    await postEvent(kind, payload, ev.qid, ev.ts);
    ev.sent = true; savePend();
  }catch(e){
    if(e && e.duplicate){ ev.sent = true; savePend(); return ev; }
    /* savePend can fail on a full or blocked store. Promising it is safe on the
       phone when the write did not happen is the one lie the app must not tell. */
    toast(stored ? 'Saved on this phone. It will be sent as soon as you are back online.'
                 : 'Could not save that. Check your connection and try again.');
  }
  return ev;
}
var FLUSHING = false;
async function flushPend(){
  /* Two flushes at once both see sent === false and both post the same qid, so
     the second gets a 409. The unlock path fires the interval, the visibility
     handler and the online handler within a second of each other. */
  if(FLUSHING) return;
  FLUSHING = true;
  try{
    for(var i=0;i<PEND.length;i++){
      var e = PEND[i];
      if(e.sent) continue;
      try{ await postEvent(e.kind, e.payload, e.qid, e.ts); e.sent = true; savePend(); }
      catch(err){
        if(err && err.duplicate){ e.sent = true; savePend(); continue; }
        e.tries = (e.tries || 0) + 1;
        if(e.tries > 40){
          // Forty failures is not a flaky connection, it is a payload the server
          // will never take. Letting it go stops one bad event blocking every
          // later tap for ever.
          e.dead = true; e.sent = true; savePend(); continue;
        }
        savePend();

      }

var STALE_MS = 6*60*60*1000;   // the backstop, not the rule
function prunePend(st){

     when a clock says it should be. `publish` and `apply` are separate commands
     on the Mac, so a bare publish stamps a fresh generated_at without filing
     anything, and a timestamp rule silently deleted pending taps that had not
     been filed at all. The clock is kept only as a six-hour backstop so a
     never-filed event cannot haunt the screen forever. */
  var tasks = (st && st.tasks) || [];
  var sessions = (st && st.today && st.today.sessions) || [];
  var week = st && st.week;
  var live = {}; tasks.forEach(function(t){ live[t.id]=1; });
  var now = Date.now();

  PEND = PEND.filter(function(e){
    if(!e.sent) return true;
    var age = now - Date.parse(e.ts);
    var p = e.payload || {};
    // A tick is filed by Claude at the computer, which can be a day or more
    // away, so the six-hour backstop must not reach it. The task reappearing
    // unticked invites a second tick, and a repeating task would then have its
    // due date rolled forward twice.
    if(e.kind === 'task_tick') return age < 14*24*60*60*1000 && !!live[p.id];
    if(age > STALE_MS) return false;
    if(e.kind === 'session_start')
      return !sessions.some(function(x){ return x.start === e.at; });
    if(e.kind === 'session_stop')
      return !sessions.some(function(x){ return x.start === p.start && !x.open; });
    if(e.kind === 'session_focus')
      return !sessions.some(function(x){ return x.start === p.start && x.focus != null; });
    if(e.kind === 'goals_set'){
      // Matched on the titles themselves. Comparing counts deleted the overlay
      // the moment three goals were replaced by three different ones.
      var want = (p.goals||[]).map(function(g){ return (g.title||'').trim().toLowerCase(); }).sort();
      var have = ((week && week.goals) || []).map(function(g){ return (g.title||'').trim().toLowerCase(); }).sort();
      return want.join('|') !== have.join('|');
    }
    if(e.kind === 'goal_progress')
      return !(week && (week.goals||[]).some(function(g){
        return g.title === p.title && (g.done ? 100 : g.percent) === p.percent; }));
    return age < 15*60*1000;   // keep an unrecognised kind briefly, then let it go
  });

}

/* ── derived view: published state + what has not landed yet ────────────── */
var RAW = null, VIEW = null, UPDATED = null;

function derive(){
  if(!RAW){ VIEW = null; return; }
  var v = JSON.parse(JSON.stringify(RAW));
  var t = v.today;
  t.sessions = t.sessions || [];
  v.tasks = v.tasks || [];

  PEND.forEach(function(e){
    var p = e.payload || {};
    /* An event only belongs to the day it was tapped in. Without this, a Start
       pressed at 23:50 with no signal reappeared on the next morning's screen
       as an eight-hour session that had never happened. */
    if(workingDayOf(e.ts) !== t.date) return;
    if(e.kind === 'session_start'){
      if(!t.sessions.some(function(s){ return s.open; })){
        t.sessions.push({start:e.at, end:null, minutes:null, focus:null,
          area:p.area||'ai', area_label:(v.areas||{})[p.area]||p.area,
          bucket:({ucw:'academia',research:'academia',dog:'dog',ai:'ai'})[p.area]||null,
          task:(v.areas||{})[p.area]||p.area, notes:'', open:true, pending:true});
      }
    } else if(e.kind === 'session_stop'){
      for(var i=t.sessions.length-1;i>=0;i--){
        if(t.sessions[i].open){
          var s = t.sessions[i];
          s.end = e.at; s.open = false; s.pending = true;
          s.minutes = minsBetween(s.start, s.end);
          if(p.focus) s.focus = p.focus;
          break;
        }
      }
    } else if(e.kind === 'session_focus'){
      var m = t.sessions.filter(function(s){ return s.start === p.start; })[0];
      if(m){ m.focus = p.focus; m.pending = true; }
    } else if(e.kind === 'task_tick'){
      v.tasks = v.tasks.filter(function(x){ return x.id !== p.id; });
    } else if(e.kind === 'goals_set'){
      v.week = v.week || {key:'', start:'', end:'', goals:[], progress:0, hit:0, total:0};
      // Carry the bucket and the progress of a goal whose wording did not
      // change, exactly as apply_goal_events does on the Mac. Showing every goal
      // reset to 0% for fifteen minutes and then jumping back was worse than
      // showing nothing at all.
      var old = {};
      (v.week.goals || []).forEach(function(g){ old[(g.title||'').trim().toLowerCase()] = g; });
      v.week.goals = (p.goals || []).map(function(g){
        var prev = old[(g.title||'').trim().toLowerCase()];
        return {title:g.title, bucket:g.bucket || (prev && prev.bucket) || null,
                done: !!(g.done || (prev && prev.done)),
                percent: g.percent != null ? g.percent : ((prev && prev.percent) || 0)};
      });
      v.week.total = v.week.goals.length;
      v.week.pending = true;
    } else if(e.kind === 'goal_progress'){
      if(v.week && v.week.goals[p.index]) v.week.goals[p.index].percent = p.percent;
      if(v.week) v.week.pending = true;

  // totals and the balance never disagree with the list right above them.

  t.sessions.forEach(function(s){
    if(s.minutes == null || s.open) return;
    closed += s.minutes;
    if(s.area === 'overhead') overhead += s.minutes;
    if(s.area === 'personal') personal += s.minutes;
    if(s.bucket) buckets[s.bucket] += s.minutes;

  // work_minutes and focus_coverage were left at their published values, and
  // triScores prefers work_minutes, so the Consistency tile and the triangle
  // both ignored the session Amir had just finished while the Hours page showed
  // it. Two screens, one fact, two answers.
  t.personal_minutes = personal;
  t.work_minutes = closed - personal;

  t.sessions.forEach(function(x){ if(x.focus != null && x.minutes) scoredMin += x.minutes; });
  t.focus_coverage = t.work_minutes ? Math.round(scoredMin / t.work_minutes * 1000) / 1000 : 0;
  t.open_session = t.sessions.filter(function(s){ return s.open; })[0] || null;
  t.unscored = t.sessions.filter(function(s){ return !s.open && s.minutes && s.focus == null; });
  t.focus = weightedFocus(t.sessions);

  if(v.week && v.week.goals.length){
    var sum = 0; v.week.goals.forEach(function(g){ sum += (g.done ? 100 : (g.percent||0)); });

    v.week.hit = v.week.goals.filter(function(g){ return g.done || g.percent >= 100; }).length;
    v.week.total = v.week.goals.length;

  // until the Mac republished. Its hours at least can follow the day.
  if(v.triangle.week && RAW.today && RAW.triangle && RAW.triangle.week){
    var delta = t.work_minutes - (RAW.today.work_minutes || 0);
    if(delta){

}
function workingDayOf(iso){

     counted as zero, because unrated is unknown, not bad. */

  // day just because the sessions have not been rated yet.

  var weakest = Object.keys(corners).sort(function(a,b){ return corners[a]-corners[b]; })[0];

    date:onDate,
    consistency:consistency, focus:focus, goals:goals,
    area: Math.round((consistency*focus + focus*goals + goals*consistency)/3 * 10000)/10000,
    scored: unknown.length === 0,
    unknown: unknown,
    weakest: weakest,
    advice: adviceFor(weakest, today, week, corners, unknown),
    worked_minutes: worked,
    focus_score: today.focus,

    // Secondary advice, so a low-coverage warning is not swallowed by an
    // unset-goals warning. The Python computes this and nothing rendered it.

         unknown.length) n.push(ADVICE.low_coverage);

var ADVICE = {

  focus:'The focus corner is the shortest one. Make it quiet and work on one thing.',
  focus_unknown:'Nothing is rated yet, so today has no score. Rate your sessions.',
  goals:'The goals corner is the shortest one. Make progress on this week’s goals, not just hours.',
  goals_unknown:'No goals are set for this week, so the third corner cannot be measured.',
  all_short:'All three corners are short today. The day needs hours before anything else.',
  low_coverage:'The focus score covers less than half the day. Rate the rest of your sessions.'
};

  if(unknown && unknown.length) return ADVICE[unknown[0] + '_unknown'];
  if(today.focus != null && today.focus_coverage > 0 && today.focus_coverage < 0.5)
    return ADVICE.low_coverage;

  // adjustment, when the honest message is that the whole day was thin.

     && (today.work_minutes || 0) < 300) return ADVICE.all_short;
  return ADVICE[weakest];

<script>
/* ═══════════════════════════════════════════════ the triangle, drawn ═════ */
/* Three arms leave the centre 120 degrees apart, each as long as its corner's
   score, and the tips are joined. Consistency sits at the top, focus bottom
   right, goals bottom left, and those positions never change so the shape is
   readable at a glance without reading a single label.

   The fill is three wedges, each a gradient between the two corners it touches,
   so the colour itself says which corner is short. */
var CORNERS = [
  {k:'consistency', label:'Consistency', unit:'of 10h',  ang:-90, col:'var(--consistency)', hex:'#C2703D'},
  {k:'focus',       label:'Focus',       unit:'of 10',   ang:30,  col:'var(--focus)',       hex:'#3F7D6E'},
  {k:'goals',       label:'Goals',       unit:'of pace', ang:150, col:'var(--goals)',       hex:'#6B5CA5'}
];
function ptAt(ang, r, cx, cy){
  var a = ang * Math.PI / 180;
  return [ (cx + r*Math.cos(a)).toFixed(2), (cy + r*Math.sin(a)).toFixed(2) ];
}
function triSVG(tri, opts){
