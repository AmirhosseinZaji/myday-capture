<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>myday</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<!--
  NOT black-translucent. On a Home Screen app iOS draws a black-translucent page
  from the top of the screen but sizes the web view as though the status bar still
  occupied its space, so the page ends about one status-bar height above the bottom
  of the screen. On a 440x956 iPhone that is 62pt of screen the page cannot paint,
  which is why the tab bar sat visibly high no matter what padding it had: the bar
  was flush with the bottom of the page, and the page was not flush with the screen.
-->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="myday">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">

<!--
  myday console: the visual half of a_myday.

  THE MODEL, in one paragraph. The Mac is the source of truth: Claude publishes a
  state blob (tasks, today's sessions, focus balance) and this page renders it.
  The page never edits tasks/ or days/. Everything Amir taps here is an EVENT
  ("started ucw", "stopped", "ticked X") that queues up and is reconciled by
  Claude at the Mac. So the screen always shows two layers: what Claude has
  filed, and what Amir has done since that hasn't been filed yet. Every pending
  thing is labelled as pending. That distinction is the whole design.

  Renders from localStorage first and refreshes in the background, so opening the
  app is instant on bad signal and works with none. Events and voice notes are
  saved to localStorage BEFORE any network call and removed only once the server
  confirms: the save-before-send ordering the capture app learned the hard way on
  2026-08-11.
-->

<style>
  :root {
    --bg:#f2f2f7; --surface:#fff; --fg:#000; --dim:#8a8a8e; --faint:#c7c7cc;
    --line:rgba(60,60,67,.10); --sunk:#ececf1;
    --go:#34c759; --stop:#ff3b30; --warn:#ff9500; --accent:#007aff;
    --acad:#5e5ce6; --dog:#ff9500; --ai:#32ade6;
    --shadow:0 1px 2px rgba(0,0,0,.04), 0 6px 20px rgba(0,0,0,.05);
    --ring-track:rgba(120,120,128,.14);
    --seg-on:#fff;          /* the selected segment, which must read as raised */
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#000; --surface:#1c1c1e; --fg:#fff; --dim:#98989d; --faint:#6c6c70;
      --line:rgba(84,84,88,.5); --sunk:#2c2c2e;
      /* #48484a on #1c1c1e is about 1.8:1. Unticked task boxes and the dash on
         an unused timer were both drawn in it and were close to invisible. */
      --go:#30d158; --stop:#ff453a; --warn:#ff9f0a; --accent:#0a84ff;
      --acad:#7d7aff; --dog:#ff9f0a; --ai:#64d2ff;
      --shadow:none; --ring-track:rgba(120,120,128,.22);
      /* In dark, --surface is DARKER than the --sunk track, so reusing it made
         the selected segment look like a hole punched in the control. */
      --seg-on:#48484a;
    }
  }

  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { -webkit-text-size-adjust:100%; text-size-adjust:100%; }
  html,body { margin:0; padding:0; }
  /* The app owns the whole visible viewport and only <main> scrolls. The tab bar
     used to be position:fixed, which on iOS is measured against Safari's toolbar
     state: on Tasks the page was long enough to scroll, the toolbar minimised and
     the bar landed correctly, but on Time and Talk the page never scrolled, the
     full-height toolbar stayed put and the bar sat visibly too high. A flex column
     of 100dvh puts the bar at the bottom of what is actually on screen, the same
     on all three tabs, and stops the layout jumping while scrolling. */
  html { height:100%; }
  body {
    /* position:fixed with inset:0 pins the app to the initial containing block,
       which with viewport-fit=cover is the whole screen. 100dvh was leaving a
       strip of dead page below the tab bar on the Home Screen app, which is why
       the bar kept looking like it was floating too high no matter how much
       padding came off it. inset:0 cannot come up short the way dvh can. */
    position:fixed; inset:0;
    display:flex; flex-direction:column; overflow:hidden;
    background:var(--bg); color:var(--fg);
    font:17px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
    -webkit-user-select:none; user-select:none; overscroll-behavior-y:none;
  }
  button { font-family:inherit; touch-action:manipulation; }

  header {
    flex:none; position:relative; z-index:20;
    padding:calc(env(safe-area-inset-top) + 6px) 20px 10px;
    background:color-mix(in srgb, var(--bg) 82%, transparent);
    -webkit-backdrop-filter:saturate(180%) blur(20px);
    backdrop-filter:saturate(180%) blur(20px);
    border-bottom:.5px solid var(--line);
  }
  .htop { display:flex; align-items:center; gap:10px; }
  header h1 { font-size:23px; font-weight:700; margin:0; letter-spacing:-.03em; }
  header .date { color:var(--dim); font-size:14px; font-weight:500; margin-left:auto; }
  .qmark {
    width:34px; height:34px; border-radius:50%; border:0; background:var(--sunk);
    color:var(--dim); font-size:15px; font-weight:700; flex:none; line-height:1;
  }
  .status { display:flex; align-items:center; gap:5px; font-size:11.5px; color:var(--dim); margin-top:3px; }
  .status .led { width:6px; height:6px; border-radius:50%; background:var(--go); flex:none; }
  .status.bad .led { background:var(--stop); }
  .status.warn .led { background:var(--warn); }

  main {
    flex:1 1 auto; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain; padding:4px 20px 24px; max-width:640px; width:100%; margin:0 auto;
  }
  section { display:none; animation:fade .22s ease both; }
  section.on { display:block; }
  @keyframes fade { from { opacity:0; transform:translateY(6px);} to { opacity:1; transform:none; } }

  nav {
    flex:none; position:relative; z-index:30; display:flex; align-items:stretch;
    background:var(--bg);
    border-top:.5px solid var(--line);
    /* No safe-area reservation at all. Amir wants the row on the bottom edge, and
       env() here is what kept lifting it. Keeping env() out also means this file
       renders identically on a desktop browser and on the phone, so the layout can
       actually be checked before it ships. */
    padding-bottom:8px;
  }
  /* Never smaller than 56px: an earlier build let these collapse on iOS until
     they could not be hit. */
  nav button {
    flex:1 1 0; min-height:66px; border:0; background:none; color:var(--dim);
    font-size:12.5px; font-weight:600; line-height:1.1;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px;
    padding:8px 4px 0;
  }
  nav button .ic { font-size:31px; line-height:1; font-weight:400; }
  nav button.on { color:var(--accent); }
  nav button:active { opacity:.55; }
  nav button .badge {
    position:absolute; transform:translate(16px,-14px); background:var(--warn); color:#fff;
    font-size:10px; font-weight:700; min-width:16px; height:16px; border-radius:8px;
    display:flex; align-items:center; justify-content:center; padding:0 4px;
  }

  .card { background:var(--surface); border-radius:18px; padding:18px; box-shadow:var(--shadow); margin-bottom:14px; }
  h2 { font-size:13px; font-weight:600; color:var(--dim); margin:24px 4px 10px; }
  .sub { font-size:12.5px; color:var(--dim); margin:-6px 4px 10px; line-height:1.45; }

  /* ring */
  .ringwrap { display:flex; align-items:center; gap:16px; }
  .ring { width:142px; height:142px; flex:none; position:relative; }
  .ring svg { transform:rotate(-90deg); display:block; }
  .ring .mid { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .ring .mid .v { font-size:23px; font-weight:700; letter-spacing:-.04em; font-variant-numeric:tabular-nums; }
  .ring .mid .l { font-size:10px; color:var(--dim); font-weight:500; margin-top:1px; max-width:92px;
                  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:center; }
  .ring.live .mid .v { color:var(--go); }
  .legend { flex:1; min-width:0; display:flex; flex-direction:column; gap:11px; }
  .legend .row { display:flex; align-items:center; gap:9px; }
  .legend .sw { width:9px; height:9px; border-radius:3px; flex:none; }
  .legend .nm { font-size:14px; font-weight:500; flex:1; }
  .legend .vl { font-size:14px; font-weight:600; font-variant-numeric:tabular-nums; }
  .legend .row.zero .nm, .legend .row.zero .vl { color:var(--dim); }
  .verdict { margin-top:16px; padding-top:14px; border-top:.5px solid var(--line);
             font-size:13.5px; line-height:1.5; color:var(--dim); }
  .verdict b { color:var(--fg); font-weight:600; }

  /* the timer card: the one thing that has to be unambiguous */
  .timer { padding:0; overflow:hidden; }
  .timer .head { display:flex; align-items:center; gap:12px; padding:18px; }
  .timer.on .head { border-left:4px solid var(--go); padding-left:14px; }
  .timer.off .head { border-left:4px solid var(--faint); padding-left:14px; }
  .timer .dot { width:9px; height:9px; border-radius:50%; background:var(--go); flex:none;
                animation:pulse 2.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1; transform:scale(1)} 50%{opacity:.3; transform:scale(.82)} }
  .timer .what { flex:1; min-width:0; }
  .timer .what b { display:block; font-size:17px; font-weight:600; letter-spacing:-.01em; }
  .timer .what span { font-size:12.5px; color:var(--dim); display:block; margin-top:2px; }
  .timer .el { font-size:23px; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:-.03em; }
  .timer .acts { display:flex; gap:8px; padding:0 18px 18px; }
  .timer .acts.stack { flex-direction:column; }

  button.primary {
    width:100%; border:0; border-radius:14px; padding:16px; font-size:17px; font-weight:600;
    color:#fff; letter-spacing:-.01em; display:flex; align-items:center; justify-content:center; gap:7px;
    transition:transform .12s ease, opacity .12s ease;
  }
  button.primary:active { transform:scale(.975); opacity:.85; }
  button.primary.stop { background:var(--stop); }
  button.ghost {
    flex:1; border:0; border-radius:14px; padding:13px; font-size:15px; font-weight:600;
    background:var(--sunk); color:var(--fg);
  }
  button.ghost:active { opacity:.6; }
  button.ghost.warn { color:var(--warn); }

  .picker { padding:0 18px 18px; }
  .picker .lbl { font-size:13px; font-weight:600; color:var(--dim); margin-bottom:10px; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:9px; }
  .grid button {
    background:var(--sunk); border:0; border-radius:14px; color:var(--fg);
    padding:14px 6px 12px; display:flex; flex-direction:column; align-items:center; gap:6px;
    font-size:13px; font-weight:600; min-height:78px; transition:transform .12s ease;
  }
  .grid button:active { transform:scale(.95); }
  .grid button .ic { font-size:24px; line-height:1; }

  .pill { display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:600;
          padding:3px 8px; border-radius:999px; background:var(--sunk); color:var(--dim); }
  .pill.pend { background:rgba(255,149,0,.16); color:var(--warn); }
  .pill.filed { background:rgba(52,199,89,.16); color:var(--go); }

  /* sessions */
  .sess { display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:.5px solid var(--line); }
  .sess:last-child { border-bottom:0; padding-bottom:0; }
  .sess:first-child { padding-top:0; }
  .sess .ic { font-size:19px; width:26px; text-align:center; flex:none; }
  .sess .b { flex:1; min-width:0; }
  .sess .b b { font-size:15px; font-weight:500; display:block; }
  .sess .b span { font-size:12.5px; color:var(--dim); font-variant-numeric:tabular-nums; }
  .sess .d { font-size:15px; font-weight:600; font-variant-numeric:tabular-nums; text-align:right; }
  .sess.running .d { color:var(--go); }
  .sess .chev { color:var(--faint); font-size:17px; flex:none; margin-left:2px; }
  .sess:active { opacity:.55; }

  /* editing a session: native time inputs, because a wrong entry has to be
     fixable on the phone. Not being able to correct 17h56m is what made the
     whole screen untrustworthy. */
  .edit { background:var(--sunk); border-radius:14px; padding:14px; margin:10px 0; }
  .edit .fields { display:flex; gap:10px; margin-bottom:12px; }
  .edit .f { flex:1; }
  .edit .f label { display:block; font-size:11.5px; font-weight:600; color:var(--dim); margin-bottom:5px; }
  .edit input[type=time] {
    width:100%; border:0; border-radius:10px; padding:11px 10px; font-size:17px;
    font-family:inherit; background:var(--surface); color:var(--fg);
    font-variant-numeric:tabular-nums; -webkit-appearance:none; min-height:44px;
  }
  .edit .areas { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
  .edit .areas button {
    border:0; border-radius:999px; padding:8px 12px; font-size:13px; font-weight:600;
    background:var(--surface); color:var(--dim);
  }
  .edit .areas button.on { background:var(--fg); color:var(--bg); }
  .edit .btns { display:flex; gap:8px; }
  .edit .btns button { flex:1; border:0; border-radius:11px; padding:12px; font-size:15px; font-weight:600; }
  .edit .save { background:var(--accent); color:#fff; }
  .edit .cancel { background:var(--surface); color:var(--fg); }
  .edit .del { background:var(--surface); color:var(--stop); }

  /* tasks */
  .chips { display:flex; gap:8px; overflow-x:auto; padding:4px 20px 8px; margin:0 -20px; scrollbar-width:none; }
  .chips + .chips { padding-top:2px; padding-bottom:10px; }
  .chips::-webkit-scrollbar { display:none; }
  .chips button { border:0; background:var(--surface); color:var(--dim); white-space:nowrap;
                  border-radius:999px; padding:8px 15px; font-size:14px; font-weight:600;
                  box-shadow:var(--shadow); flex:none; }
  .chips button.on { background:var(--fg); color:var(--bg); }
  .chips button .ct { opacity:.5; margin-left:4px; font-weight:500; }
  .grp { margin-bottom:22px; }
  .grp .hd { display:flex; align-items:baseline; gap:8px; margin:0 4px 8px; }
  .grp .hd b { font-size:15px; font-weight:600; }
  .grp .hd span { font-size:13px; color:var(--dim); }
  .grp .body { background:var(--surface); border-radius:18px; box-shadow:var(--shadow); overflow:hidden; }
  .task { display:flex; gap:13px; align-items:flex-start; padding:14px 16px; border-bottom:.5px solid var(--line); }
  .task:last-child { border-bottom:0; }
  .task:active { background:var(--bg); }
  .task .box { width:23px; height:23px; border:2px solid var(--faint); border-radius:7px; flex:none;
               margin-top:1px; display:flex; align-items:center; justify-content:center;
               font-size:14px; color:#fff; transition:background .15s, border-color .15s; }
  .task.on .box { background:var(--go); border-color:var(--go); }
  .task.on .tt { text-decoration:line-through; color:var(--dim); }
  .task .c { flex:1; min-width:0; }
  .task .tt { font-size:15.5px; line-height:1.35; }
  .task .mt { font-size:12.5px; color:var(--dim); margin-top:4px; display:flex; gap:9px;
              flex-wrap:wrap; align-items:center; }
  .task .mt .od { color:var(--stop); font-weight:600; }

  /* talk */
  .rec {
    width:100%; border:0; border-radius:20px; padding:30px 16px; color:#fff;
    font-size:19px; font-weight:700; letter-spacing:.02em; background:var(--go);
    display:flex; flex-direction:column; align-items:center; gap:6px; min-height:150px;
    justify-content:center; transition:background .18s ease, transform .12s ease;
    /* touch-action:none, NOT manipulation. With manipulation iOS may decide a
       slight finger movement is a scroll, claim the gesture and fire
       pointercancel, which ends the recording while the finger is still down.
       That is exactly what made the button flash red and drop back to green
       mid-hold. The capture app has always had none; do not relax it. */
    touch-action:none; user-select:none; -webkit-user-select:none;
  }
  .rec small { font-size:12.5px; font-weight:500; opacity:.85; letter-spacing:0; }
  .rec.arming { background:var(--faint); }
  .rec.live { background:var(--stop); transform:scale(1.01); }
  .rec:disabled { background:var(--faint); }
  /* Swipe a note left to reveal Edit and Delete, same gesture as the capture
     app. A misheard word has to be fixable where it is noticed. */
  .note { position:relative; overflow:hidden; border-bottom:.5px solid var(--line); }
  .note:last-child { border-bottom:0; }
  .note .w {
    position:relative; z-index:1; background:var(--surface); padding:13px 2px;
    transition:transform .18s ease;
  }
  .note.swiping .w { transition:none; }
  .note.open .w { transform:translateX(-160px); }
  .note .w p { margin:0; font-size:15px; line-height:1.4; word-wrap:break-word; }
  .note .w span { font-size:11.5px; color:var(--dim); display:block; margin-top:4px; }
  .note .actions { position:absolute; top:0; right:0; bottom:0; display:flex; z-index:0; }
  .note .actions button {
    border:0; width:80px; color:#fff; font-size:14px; font-weight:600;
  }
  .note .actions .e { background:var(--accent); }
  .note .actions .d { background:var(--stop); }

  /* Editing a note happens in a full-screen sheet, never in place. In-place
     editing had two faults and both of them bit. It fought the keyboard for the
     scrap of room left under the record button and the tab bar, and it lived
     inside the markup that the 20s poll redraws, so a poll landing mid-sentence
     tore the box out and threw the typing away. This is the same fault that once
     killed recordings mid-hold, which is why the record button is static markup.
     The sheet is static too, and its height comes from fitViewport(), so it
     follows the keyboard instead of guessing. */
  #esheet {
    position:fixed; left:0; right:0; top:0; z-index:50;
    display:none; flex-direction:column; background:var(--bg);
  }
  #esheet.on { display:flex; }
  .ehead {
    flex:none; display:flex; align-items:center; gap:10px;
    padding:calc(env(safe-area-inset-top) + 8px) 16px 10px;
    border-bottom:.5px solid var(--line);
  }
  .ehead b { flex:1; text-align:center; font-size:15px; font-weight:600; }
  /* 44pt is Apple's floor for a tap target, and Save is the button that commits a
     time correction. It was the smallest control on the screen. */
  .ehead button {
    flex:none; border:0; border-radius:11px; padding:12px 16px;
    font-size:15px; font-weight:600; min-height:44px;
  }
  .ehead .cancel { background:var(--sunk); color:var(--fg); }
  .ehead .save   { background:var(--accent); color:#fff; }
  .ehead button:active { opacity:.6; }
  /* 16px is a floor, not a preference: iOS zooms the whole page in on any input
     smaller than that, and the zoom does not come back out on blur. */
  #esheet textarea {
    flex:1 1 auto; min-height:0; width:100%; resize:none; border:0; outline:0;
    background:var(--bg); color:var(--fg);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
    padding:14px 16px calc(env(safe-area-inset-bottom) + 24px);
    -webkit-user-select:text; user-select:text;
  }

  /* The timers. Six buttons, always on screen, one per area. */
  .tgrid { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; padding:0 14px 4px; }
  .tbtn {
    display:flex; flex-direction:column; align-items:center; gap:2px;
    border:1.5px solid var(--line); border-radius:15px; padding:12px 4px 10px;
    background:var(--surface); color:var(--fg); min-height:82px; justify-content:center;
    transition:transform .08s ease, background .15s ease, border-color .15s ease;
  }
  .tbtn:active { transform:scale(.96); }
  .tbtn .ic { font-size:22px; line-height:1; }
  .tbtn .nm { font-size:13px; font-weight:600; }
  .tbtn .vl { font-size:11.5px; color:var(--dim); font-variant-numeric:tabular-nums; }
  .tbtn.zero .vl { color:var(--faint); }
  /* The running one is unmistakable. Amir has to be able to tell at a glance. */
  .tbtn.on { background:var(--go); border-color:var(--go); color:#fff; }
  .tbtn.on .vl { color:rgba(255,255,255,.85); }
  .thint { font-size:11.5px; color:var(--dim); text-align:center; padding:8px 18px 2px; }

  .addsess {
    width:100%; border:1.5px dashed var(--line); background:transparent; color:var(--accent);
    border-radius:15px; padding:14px; font-size:15px; font-weight:600; margin-bottom:14px;
  }
  .addsess:active { opacity:.6; }

  /* The session editor sheet.
     It used to be markup inside the sessions card, which the 20-second poll
     rebuilds. That is why it opened for a second or two and then disappeared, and
     why a start time typed as 9:00 snapped back to the original: the edit was
     destroyed before it could ever be saved. Out here nothing can redraw over it. */
  #ssheet {
    position:fixed; left:0; right:0; top:0; z-index:50;
    display:none; flex-direction:column; background:var(--bg);
  }
  #ssheet.on { display:flex; }
  #ssheet .sbody { flex:1 1 auto; min-height:0; overflow-y:auto; padding:16px 16px 40px; }
  #ssheet .seg {
    display:flex; background:var(--sunk); border-radius:12px; padding:3px; margin-bottom:16px;
  }
  #ssheet .seg button {
    flex:1; border:0; background:transparent; color:var(--dim);
    border-radius:10px; padding:12px; font-size:14px; font-weight:600; min-height:44px;
  }
  #ssheet .seg button.on { background:var(--seg-on); color:var(--fg); box-shadow:var(--shadow); }
  #ssheet .fields { display:flex; gap:10px; }
  #ssheet .f { flex:1; }
  #ssheet .f label, #ssheet .alab {
    display:block; font-size:12px; font-weight:600; color:var(--dim); margin-bottom:6px;
  }
  #ssheet .alab { margin-top:18px; }
  /* 17px, not smaller: iOS zooms the whole page in on any input under 16px. */
  #ssheet input[type=time] {
    width:100%; border:1.5px solid var(--line); border-radius:12px; padding:13px;
    font-size:17px; background:var(--surface); color:var(--fg); font-variant-numeric:tabular-nums;
  }
  #ssheet .dur {
    margin-top:12px; text-align:center; font-size:15px; font-weight:600; color:var(--dim);

  #ssheet .del {

  }

  /* The 15-minute reminder switch, and the banner it raises. */

  /* diagnostics + misc */

  code { font:12.5px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace; background:var(--bg);
         padding:2px 6px; border-radius:5px; word-break:break-all; }

<body>

<header>
  <div class="htop">
    <h1 id="hTitle">Today</h1>
    <button class="qmark" id="hHelp" aria-label="How this works">?</button>
    <span class="date" id="hDate"></span>
  </div>
  <div class="status" id="hStatus"><span class="led"></span><span id="hStatusT">starting…</span></div>
</header>

<main>
  <section id="s-today" class="on"></section>
  <section id="s-tasks"></section>

  <!--
    The record button is STATIC markup and is never re-rendered. The notes list
    below it is the only part that redraws. Rebuilding this button while a
    recording was in progress tore the live one out of the DOM, taking its
    pointer capture with it, and the hold silently died on the next 20s poll.
  -->
  <section id="s-talk">
    <div style="padding:8px 0 4px">
      <button class="rec" id="rec"><span id="recLabel">HOLD &amp; TALK</span><small id="recSub">let go to send</small></button>
    </div>
    <div class="sub" style="text-align:center;margin:12px 4px 0">
      Notes stay listed until Claude files them at the Mac.
    </div>
    <div id="notes"></div>
  </section>
</main>

<nav>
  <button data-go="today" class="on"><span class="ic">⏱️</span>Time</button>
  <button data-go="tasks"><span class="ic">☑</span>Tasks</button>
  <button data-go="talk"><span class="ic">🎙</span>Talk</button>
</nav>

<!--
  The session editor. Static markup, outside <main>, for the reason written on
  #ssheet in the stylesheet: it used to live inside the part of the page that
  redraws every 20 seconds, so it vanished mid-edit and threw the change away.
-->
<div id="ssheet">
  <div class="ehead">
    <button class="cancel" id="sCancel">Cancel</button>
    <b id="sTitle">Edit session</b>
    <button class="save" id="sSave">Save</button>
  </div>
  <div class="sbody">
    <div class="seg" id="sSeg">
      <button data-sstate="running">Still running</button>
      <button data-sstate="done" class="on">Finished</button>
    </div>
    <div class="fields">
      <div class="f"><label>Started</label><input type="time" id="sStart" step="60"></div>
      <div class="f" id="sEndWrap"><label>Ended</label><input type="time" id="sEnd" step="60"></div>
    </div>
    <div class="dur" id="sDur">—</div>
    <label class="alab">Area</label>
    <div class="areas" id="sAreas"></div>
    <button class="del" id="sDelete">Delete this session</button>
  </div>
</div>

<!--
  The note editor. Static markup, deliberately outside <main>, so that no redraw
  can tear it out from under him mid-sentence. Save and Cancel are explicit
  buttons: the old editor saved on blur, and a blur it never asked for is exactly
  what made editing feel random.
-->
<div id="esheet">
  <div class="ehead">
    <button class="cancel" id="eCancel">Cancel</button>
    <b>Edit note</b>
    <button class="save" id="eSave">Save</button>
  </div>
  <!-- autocorrect is OFF on purpose. This box exists to FIX transcripts full of
       names the project works hard to protect: Bonakdari, Poodi, MHMI, BUSI 654.
       iOS would rewrite them while he types nearby. -->
  <textarea id="eText" autocapitalize="sentences" autocorrect="off" spellcheck="false"></textarea>
</div>

<script>
(function () {
  'use strict';

  var BUILD = 'c27 · 2026-08-30';

  var CFG_KEY   = 'myday_cfg';
  var STATE_KEY = 'myday_state';
  var EVQ_KEY   = 'myday_evq';     // start/stop/tick events, saved before sending
  var NOTEQ_KEY = 'myday_queue';   // voice notes. SHARED with the capture app on
                                   // purpose: same origin, same format, same
                                   // server contract, and qid makes a double
                                   // send by both apps harmless.
  var SENT_KEY  = 'myday_sent';    // client_ts of the last event the server accepted
  var NUDGE_KEY = 'myday_nudge';   // the 15-minute reminder switch, and when it next fires
  var LOCAL_KEY = 'myday_local2';  // what Amir has done since the last publish

  var POLL_MS = 20000;
  var MAX_AUDIO_BYTES = 4500000;

  var AREAS = [
    { slug:'ucw',      label:'UCW',      ic:'🎓' },
    { slug:'ai',       label:'AI',       ic:'🤖' },
    { slug:'dog',      label:'Dog',      ic:'🐕' },
    { slug:'research', label:'Research', ic:'🔬' },
    { slug:'personal', label:'Personal', ic:'🏠' },
    { slug:'overhead', label:'Overhead', ic:'🚚' }
  ];
  var AREA_IC = {}; AREAS.forEach(function (a) { AREA_IC[a.slug] = a.ic; });
  var BUCKET_OF = { ucw:'academia', research:'academia', dog:'dog', ai:'ai' };
  var BUCKETS = [
    { k:'academia', n:'Academia', c:'var(--acad)' },
    { k:'dog',      n:'Dog',      c:'var(--dog)'  },
    { k:'ai',       n:'AI',       c:'var(--ai)'   }
  ];

  var cfg=null, state=null, local=null, evq=[], tab='today';
  var dueFilter='all', areaFilter='all';
  var showHelp=false, notes=[];
  var editNote=null;                 // the note open in the note sheet, if any
  var editSess=null;                 // the session open in the session sheet, if any
  var health = { net:null, err:'', lastTry:'' };

  // ---------------------------------------------------------------- storage
  function load(k, d) { try { var v=localStorage.getItem(k); return v?JSON.parse(v):d; } catch(e){ return d; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }

  function readConfig() {
    var h = location.hash.replace(/^#/, '');
    if (h) {
      var p = {};
      h.split('&').forEach(function (kv) {
        var i = kv.indexOf('='); if (i>0) p[kv.slice(0,i)] = decodeURIComponent(kv.slice(i+1));
      });
      var url = p.e || (p.d ? 'https://script.google.com/macros/s/'+p.d+'/exec' : '');
      if (url && p.k) { var c={url:url, token:p.k}; save(CFG_KEY,c); return c; }
    }
    return load(CFG_KEY, null);
  }

  // ---------------------------------------------------------------- helpers
  function esc(t) {
    return String(t==null?'':t).replace(/[&<>"]/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
    });
  }
  function pad(n){ return (n<10?'0':'')+n; }
  function stamp() {
    var d=new Date();
    return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+
           pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
  }
  function clock(){ var d=new Date(); return pad(d.getHours())+':'+pad(d.getMinutes()); }
  function hm(m) {
    if (m==null) return '—';
    m = Math.max(0, Math.round(m));
    return Math.floor(m/60)+'h'+pad(m%60)+'m';
  }
  /**
   * The WORKING day, not the calendar day. Amir's day ends when he sleeps, and
   * CLAUDE.md puts the boundary at 05:00. Without this the screen would reset
   * itself at midnight while he was still mid-session, and a session started at
   * 23:00 would look like it belonged to a day that had already ended.
   */
  function todayISO() {
    var d = new Date();
    if (d.getHours() < 5) d.setDate(d.getDate() - 1);
    return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  }

  function toMin(hhmm) {
    var m = /^(\d{1,2}):(\d{2})/.exec(hhmm||''); return m ? (+m[1])*60 + (+m[2]) : null;
  }
  /** Minutes from an "HH:MM" earlier today until now. Amir's day rolls over at
      05:00, not midnight, so a start in the future is really yesterday's. */
  function sinceToday(hhmm) {
    var s = toMin(hhmm); if (s==null) return 0;
    var d = new Date(), now = d.getHours()*60 + d.getMinutes();
    return now >= s ? now - s : (24*60 - s) + now;
  }
  /**
   * The running timer is the one number on this screen that has to prove it is
   * moving. Minutes alone left Amir watching a still number, unsure the start had
   * registered at all, so this counts in seconds. The start he is measured from
   * is only ever HH:MM, so the reading can sit up to 59 seconds behind the moment
   * he actually pressed the button. It still ticks once a second, which is the
   * point of it.
   */
  function secSince(hhmm) {
    var m = toMin(hhmm); if (m==null) return 0;
    var st = m*60, d = new Date();
    var now = d.getHours()*3600 + d.getMinutes()*60 + d.getSeconds();
    return now >= st ? now - st : (24*3600 - st) + now;
  }
  function hms(sec) {
    sec = Math.max(0, Math.round(sec));
    return Math.floor(sec/3600)+'h'+pad(Math.floor(sec/60)%60)+'m'+pad(sec%60)+'s';
  }

  /** "HH:MM" minus n minutes, wrapping past midnight. */
  function minusMinutes(hhmm, n) {
    var m = toMin(hhmm); if (m==null) return hhmm;
    m = (m - n + 24*60) % (24*60);
    return pad(Math.floor(m/60)) + ':' + pad(m%60);
  }

  function spanMin(a, b) {
    var x = toMin(a), y = toMin(b);
    if (x==null || y==null) return 0;
    return y >= x ? y - x : (24*60 - x) + y;
  }

  // ---------------------------------------------------------------- network
  function get(action, params) {
    var q = 'action='+action+'&token='+encodeURIComponent(cfg.token);
    for (var k in params) q += '&'+k+'='+encodeURIComponent(params[k]);
    return fetch(cfg.url+'?'+q, {method:'GET'}).then(function(r){ return r.json(); });
  }
  function post(body) {
    var b = { token: cfg.token };
    for (var k in body) b[k] = body[k];
    // text/plain keeps this a "simple" request, so the browser skips the CORS
    // preflight that Apps Script cannot answer.
    return fetch(cfg.url, { method:'POST', headers:{'Content-Type':'text/plain'},
                            body: JSON.stringify(b), redirect:'follow' })
           .then(function(r){ return r.json(); });
  }

  // ============================================================= the model
  //
  //  filed        what Claude has written into days/<today>.md
  //  pending      what Amir has done on the phone since the last publish
  //
  //  local = {
  //    date,
  //    open:      {start, area} | null      a session started here, still running
  //    segments:  [{start, end, area}]      sessions started AND stopped here
  //    filedEnd:  "HH:MM" | null            he stopped the session Claude had open
  //    ticked:    {taskId: true}
  //  }
  //
  //  Exactly one session can be running at a time, and it is either the filed
  //  one (if he has not stopped it) or the local one. They can never both count,
  //  which is what made the old screen show two different totals.

  function freshLocal() {
    return { date:todayISO(), open:null, segments:[], filedEnd:null, ticked:{}, edits:{}, seq:1 };
  }

  /**
   * Every session row carries an id, and edits are keyed by that id.
   *
   * They used to be keyed by start+area, and that quietly broke the app. Delete
   * a UCW session that started at 09:16, start UCW again inside the same minute,
   * and the new session inherited the deleted one's key and was filtered straight
   * back out. The start really happened, the row just never appeared, so the
   * button looked dead. Only UCW, only that minute, and only until the edits were
   * cleared, which is exactly the pattern Amir described on 2026-08-30.
   *
   * Local ids come from a counter that is saved with the rest of local state, so
   * a new row can never collide with a deleted one. Filed ids are positional,
   * which is safe because a fresh publish clears every filed edit anyway.
   */
  /**
   * Roll into a new working day WITHOUT throwing away a session that is still
   * running. The old code replaced the whole local layer at 05:00, so a session
   * started at 03:40 and still going simply vanished: the screen said "Not
   * working", the stop was never sent, and the row on the previous day stayed
   * open forever. That is the exact failure the Start/Stop button exists to cure.
   */
  function rollLocal(prev) {
    var fresh = freshLocal();
    if (prev && prev.open) { fresh.open = prev.open; fresh.seq = prev.seq || 1; }
    return fresh;
  }

  function nextSessId() {
    local.seq = (local.seq || 1) + 1;
    return 'l' + local.seq;
  }

  /** The filed session Claude has open, if Amir has not already stopped it here. */
  function filedOpen() {
    var s = state && state.today && state.today.open_session;
    if (!s) return null;
    if (local && local.filedEnd) return null;   // he stopped it from the phone
    return s;
  }
  /** The single running session, whichever layer it comes from, after edits. */
  function running() {
    var rows = sessionRows();
    for (var i=0; i<rows.length; i++) if (rows[i].running) return rows[i];
    return null;
  }
  // The big number and the buckets are both derived from the SAME list the user
  // is looking at, so they can never disagree with it. Two independent sums were
  // what let the ring say one thing and the rows another.
  function workedMinutes() {
    return sessionRows().reduce(function (n, s) { return n + (s.minutes||0); }, 0);
  }
  function liveBuckets() {
    var out = { academia:0, dog:0, ai:0 };
    sessionRows().forEach(function (s) {
      var k = BUCKET_OF[s.area];
      if (k) out[k] += (s.minutes||0);
    });
    return out;
  }

  // ----------------------------------------------------------------- events
  function emit(kind, payload) {
    var ev = { qid:'e'+Date.now()+'-'+Math.random().toString(36).slice(2,8),
               kind:kind, payload:payload||{}, client_ts:stamp() };
    evq.push(ev); save(EVQ_KEY, evq);
    return ev;
  }

  /** Tapping a timer: start it, stop it, or switch to it. */
  function doTimer(area) {
    var r = running();
    if (r && r.area === area) { doStop(false); return; }
    doStart(area);
  }

  function doStart(area) {
    var now = clock();
    // Starting while something runs is a SWITCH: close the old one first, so the
    // two can never overlap and the totals stay honest. Both halves use the SAME
    // timestamp. Reading the clock twice meant a tap at 09:59:59 could end the old
    // session at 10:00 and start the new one at 09:59, counting that minute twice.
    if (running()) doStop(true, now);
    emit('session_start', { area:area });
    local.open = { id:nextSessId(), start:now, area:area };
    local.date = todayISO(); save(LOCAL_KEY, local);
    render(); flush();
  }

  function doStop(silent, at) {
    var now = at || clock();
    /* `at` is used when a session is re-opened earlier in the day, so the running
       one closes where the new one begins. If that point is BEFORE the running
       session started, spanMin wraps past midnight and banks about 23 hours.
       Closing it at its own start is the honest answer: it recorded no time. */
    if (at && local.open && spanMin(local.open.start, at) > 12*60) now = local.open.start;
    if (at && !local.open && filedOpen() && spanMin(filedOpen().start, at) > 12*60) {
      now = filedOpen().start;
    }
    if (local.open) {
      var id = local.open.id || nextSessId();
      // A switch inside one clock minute leaves a row of zero minutes. It records
      // no work, it clutters the list, and it is never what he meant to keep.
      if (spanMin(local.open.start, now) > 0) {
        local.segments.push({ id:id, start:local.open.start, end:now, area:local.open.area });
      }
      if (local.edits) delete local.edits[id];   // the row now carries its own truth
      local.open = null;
    } else if (filedOpen()) {
      local.filedEnd = now;
    } else { return; }
    emit('session_stop', {});
    local.date = todayISO(); save(LOCAL_KEY, local);
    if (!silent) { render(); flush(); }
  }

  /**
   * Undo a start he did not mean. If the event is still queued it is simply
   * dropped and the server never hears about it; if it has already gone, a
   * `session_cancel` tells Claude to ignore the previous start.
   */
  function doUndoStart() {
    if (!local.open) return;
    var i = -1;
    for (var j = evq.length-1; j >= 0; j--) {
      if (evq[j].kind === 'session_start') { i = j; break; }
    }
    if (i > -1) { evq.splice(i,1); save(EVQ_KEY, evq); }
    else { emit('session_cancel', { start: local.open.start, area: local.open.area }); }
    local.open = null; save(LOCAL_KEY, local);
    render(); flush();
  }

  var flushing = false;
  function flush() {
    if (flushing || !cfg) return;
    if (!evq.length) { flushNotes(); return; }
    flushing = true;
    var ev = evq[0];
    post({ action:'event', kind:ev.kind, payload:ev.payload, client_ts:ev.client_ts, qid:ev.qid })
      .then(function (r) {
        if (r && r.ok) {
          // What the Mac has now definitely been told, and when.
          if (ev.client_ts) save(SENT_KEY, ev.client_ts);
          evq.shift(); save(EVQ_KEY, evq); health.net = true;
        }
        else if (r && r.error) { health.net = false; health.err = r.error; }
      })
      .catch(function (e) { health.net = false; health.err = String(e && e.message || e); })
      .then(function () {
        flushing = false; render();
        if (evq.length) setTimeout(flush, 1500); else flushNotes();
      });
  }

  /**
   * Is it safe to throw away what this phone is still holding?
   *
   * Only when nothing is queued, nothing has been sent that the publish predates,
   * and he is not looking at the very rows in question.
   */
  function pendingLayerIsSpent(updated) {
    if (evq.length) return false;                    // still unsent
    if (editSess || editNote) return false;          // open on screen right now
    /* `updated` is Apps Script's clock and `sent` is the iPhone's. Comparing them
       as strings only means anything if both are on the same timezone, and nothing
       here can guarantee that. So the comparison is only trusted when the two are
       already close; when they are far apart the clocks disagree and the safe
       answer is to keep what the phone is holding rather than throw it away. */
    var sent = load(SENT_KEY, '');
    if (sent) {
      var gap = Math.abs(minutesBetween(sent, String(updated || '')));
      if (gap > 90) return false;                       // clocks disagree, keep it
      if (String(updated || '').slice(0,16) < sent.slice(0,16)) return false;
    }
    return true;
  }

  /** Minutes from one "YYYY-MM-DD HH:MM" to another, or 0 if either is unreadable. */
  function minutesBetween(a, b) {
    function mins(t) {
      if (!t || t.length < 16) return null;
      var d = new Date(Number(t.slice(0,4)), Number(t.slice(5,7))-1, Number(t.slice(8,10)),
                       Number(t.slice(11,13)), Number(t.slice(14,16)));
      return isNaN(d.getTime()) ? null : d.getTime()/60000;
    }
    var x = mins(a), y = mins(b);
    return (x==null || y==null) ? 0 : Math.round(y - x);
  }

  // ------------------------------------------------------------------- sync
  function refresh() {
    if (!cfg) return;
    health.lastTry = clock();
    get('state').then(function (r) {
      if (!r)      { health.net=false; health.err='no response'; render(); return; }
      if (!r.ok)   { health.net=false; health.err=r.error||'server refused'; render(); return; }
      health.net = true; health.err = '';
      if (!r.state){ state=null; render(); return; }

      var s; try { s = JSON.parse(r.state); } catch(e){ health.err='state unreadable'; render(); return; }
      s._updated = r.updated || '';
      var prev = state && state._updated;
      state = s; save(STATE_KEY, s);

      /* The pending layer holds what Amir has done here that the Mac has not
         filed yet. Dropping it at the right moment is what stops an hour being
         counted twice. Dropping it at the WRONG moment is worse: a stop he made
         reappears as a running session, a forgotten session he added vanishes,
         and the totals on screen are wrong exactly when he is reading them.

         The old rule was "any newer publish clears everything". That fires on
         every fifteen-minute apply run, including ones whose snapshot was taken
         before his tap ever left the phone. Three conditions now have to hold. */
      if (prev !== s._updated && pendingLayerIsSpent(s._updated)) {
        local.segments = [];
        local.filedEnd = null;
        local.edits = {};
        // Same area AND same start. Matching on area alone let an older filed
        // session in that area swallow the one he had just started here.
        if (local.open && s.today && s.today.open_session &&
            s.today.open_session.area  === local.open.area &&
            s.today.open_session.start === local.open.start) local.open = null;
      }
      if (local.ticked && s.tasks) {
        var live = {}; s.tasks.forEach(function(t){ live[t.id]=true; });
        Object.keys(local.ticked).forEach(function(id){ if (!live[id]) delete local.ticked[id]; });
      }
      if (local.date !== todayISO()) local = rollLocal(local);
      save(LOCAL_KEY, local);
      // The switch is the server's to state, except while one of his taps is
      // still on its way there.
      if (!nudgeSending && typeof r.nudge === 'boolean') save(NUDGE_KEY, { on: r.nudge });
      // A reminder that fails silently is worse than none, because he trusts it.
      nudgeErr = r.nudge_error || '';
      render();
    }).catch(function (e) {
      health.net = false; health.err = String(e && e.message || e);
      render();   // cached state stays on screen; only the badge changes
    });
  }

  // ----------------------------------------------------------------- render
  function ringSVG(vals, live) {
    var R=62, SW=14, C=2*Math.PI*R, total=vals.academia+vals.dog+vals.ai;

    h+='<circle cx="71" cy="71" r="'+R+'" fill="none" stroke="var(--ring-track)" stroke-width="'+SW+'"/>';
    if (total>0) {
      var off=0;
      BUCKETS.forEach(function (b) {

           '" stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+
           '" stroke-dashoffset="'+(-off).toFixed(2)+'" stroke-linecap="butt"/>';
        off+=len;
      });

    h+='</svg>';

  }

  /**
   * The timers. Six buttons, always on screen, one per area.
   *
   * Tap one to start it. Tap the running one to stop. Tap a different one and it
   * switches, which closes the first at that moment so two can never overlap.
   * The old screen hid all of this behind a "Switch area" step, and Amir wanted
   * the timers themselves in front of him.
   */
  function timerGrid() {
    var r = running();
    var h = '<div class="tgrid">';
    AREAS.forEach(function (a) {
      var on = r && r.area === a.slug;
      var m = areaMinutes(a.slug);
      h += '<button class="tbtn'+(on?' on':'')+(m?'':' zero')+'" data-timer="'+a.slug+'">'+
             '<span class="ic">'+a.ic+'</span>'+
             '<span class="nm">'+a.label+'</span>'+
             '<span class="vl">'+(m ? hm(m) : (on ? 'running' : '—'))+'</span>'+
           '</button>';
    });
    return h + '</div>';
  }

  /** Minutes into the WORKING day, which starts at 05:00, so 00:10 sorts after 23:00. */
  function wdMin(hhmm) {
    var m = toMin(hhmm); if (m == null) return 0;
    return (m - 5*60 + 24*60) % (24*60);
  }

  /**
   * A filed row's id is made from what it contains, never from where it sits.
   *
   * Positional ids looked stable and were not. A publish that inserts an earlier
   * session shifts every index, so an edit saved as "f2" would land on whatever
   * session happened to be second afterwards. Content ids cannot misfire: if the
   * filed row changes, the id changes, and the stale edit is simply dropped
   * instead of being applied to the wrong session.
   */
  var filedSeen = {};
  function filedId(sess) {
    // Two filed rows really can share a start minute and an area, because a fast
    // switch writes zero-minute rows into the day file. A bare start+area id made
    // one edit apply to both of them, and one delete remove both.
    var base = 'f|' + sess.start + '|' + (sess.end || '') + '|' + sess.area;
    filedSeen[base] = (filedSeen[base] || 0) + 1;
    return base + '|' + filedSeen[base];
  }

  function sessionRows() {
    var out = [];
    filedSeen = {};
    var t = (state && state.today) || {};
    (t.sessions || []).forEach(function (s) {
      if (s.open) {
        out.push({ id:filedId(s), start:s.start, end:null, area:s.area, local:false,
                   running:true, minutes:sinceToday(s.start) });
      } else {
        out.push({ id:filedId(s), start:s.start, end:s.end, area:s.area, local:false,
                   minutes:s.minutes });
      }
    });
    (local.segments||[]).forEach(function (s, ix) {
      if (!s.id) s.id = 'lseg' + ix;          // rows saved before ids existed
      out.push({ id:s.id, start:s.start, end:s.end, area:s.area, local:true,
                 minutes:spanMin(s.start, s.end) });
    });
    if (local.open) {
      if (!local.open.id) local.open.id = 'lopen';
      out.push({ id:local.open.id, start:local.open.start, end:null, area:local.open.area,
                 local:true, running:true, minutes:sinceToday(local.open.start) });
    }

    /* Corrections to FILED rows live in `local.edits`, because a filed row is the
       Mac's to own and cannot be changed here. Corrections to LOCAL rows are made
       on the row itself in saveSessEditor.

       Keeping local rows out of this map matters. When an edit said "still
       running" and the session was later stopped, the edit kept re-applying and
       put the end back to null, so a finished session showed as running for the
       rest of the day and its time counted twice. */
    var edits = (local && local.edits) || {};
    out = out.filter(function (s) { return edits[s.id] !== 'deleted'; });
    out.forEach(function (s) {
      var e = edits[s.id];
      if (!e || e === 'deleted') return;
      s.start = e.start; s.area = e.area;
      s.end = e.end || null;
      s.running = !s.end;
      s.minutes = s.end ? spanMin(s.start, s.end) : sinceToday(s.start);
    });

    out.sort(function (a,c) { return wdMin(a.start) - wdMin(c.start); });

    /* Exactly one session may be running, and this is where that is guaranteed.
       The phone's open session and the one the Mac published are separate layers
       and they can disagree, and a day file can carry more than one row whose end
       cell was never filled in. Without this, every one of them drew as running
       and every one of them counted time. The latest start wins; anything open
       behind it is closed at that moment and marked `guessedEnd`, because that end
       is this app's inference and must never be sent to the Mac as fact. */
    var lastOpen = -1;
    for (var i = 0; i < out.length; i++) if (out[i].running) lastOpen = i;
    if (lastOpen > -1) {
      for (var j = 0; j < lastOpen; j++) {
        if (!out[j].running) continue;
        out[j].running = false;
        out[j].end = out[lastOpen].start;
        out[j].guessedEnd = true;
        out[j].minutes = spanMin(out[j].start, out[j].end);
      }
    }

    /* A stop he made here on the Mac's session is a real recorded time, so it is
       applied to the FIRST filed open row rather than only to whichever row
       happens to run last. Applying it only to the last one closed his UCW
       session at the start of the next session instead of when he stopped it, and
       counted his break as work. */
    if (local && local.filedEnd) {
      for (var k = 0; k < out.length; k++) {
        if (out[k].local) continue;
        if (!out[k].running && !out[k].guessedEnd) continue;
        out[k].running = false;
        out[k].end = local.filedEnd;
        out[k].guessedEnd = false;          // this end was recorded, not inferred
        out[k].minutes = spanMin(out[k].start, out[k].end);
        break;
      }
    }
    return out.reverse();
  }

  /** Today's minutes for one area, used on the face of each timer button. */
  function areaMinutes(slug) {
    return sessionRows().reduce(function (n, s) {
      return n + (s.area === slug ? (s.minutes||0) : 0);
    }, 0);
  }

  function lastFinished() {
    var done = sessionRows().filter(function (s) { return s.end; });
    return done.length ? done[0] : null;
  }

  function balanceLine(b, total, open) {
    if (!total) return 'No focused work logged yet today.';
    var arr = BUCKETS.map(function(x){ return {n:x.n, v:b[x.k]}; })
                     .sort(function(p,q){ return q.v-p.v; });
    var lead=arr[0], last=arr[2], gap=lead.v-last.v, even=Math.round(total/3);
    if (gap < 30) return 'Evenly split, about <b>'+hm(even)+'</b> each. Keep it there.';
    if (!last.v)  return '<b>'+last.n+' is at zero.</b> '+lead.n+' has '+hm(lead.v)+
                         '. An even finish needs '+hm(even)+' in each.';
    return '<b>'+lead.n+' leads '+last.n+' by '+hm(gap)+'.</b> Even would be '+hm(even)+' each.';
  }

  function diagnostics() {
    var deployed = !(health.err && /unknown action/i.test(health.err));
    var rows = [
      { ok: health.net===true, t:'Connection to the sheet',
        s: health.net===true ? 'Reached the endpoint at '+esc(health.lastTry)

    ];

    rows.forEach(function (r) {
