/* ── the live clock ─────────────────────────────────────────────────────── */
var CLOCK_T = null;
var ASKED_FOR = null;
function askForMissingScore(){
  /* Only when he has just this moment stopped a session and the app reloaded
     out from under the sheet. Anything older gets the banner instead, because a
     modal that opens by itself every time the app is opened is hostile. */
  if(SHEET || !VIEW) return;
  // A stop that is still in the pending queue with no score after it means the
  // app was closed under the mandatory sheet. Ask again, mandatorily.
  var stops = PEND.filter(function(e){ return e.kind === 'session_stop'; });
  for(var i = stops.length - 1; i >= 0; i--){
    var st = (stops[i].payload || {}).start;
    var rated = PEND.some(function(f){ return f.kind === 'session_focus' && (f.payload||{}).start === st; });
    if(rated || ASKED_FOR === st) continue;
    var row = (VIEW.today.sessions || []).filter(function(x){ return x.start === st; })[0];
    if(row && row.focus == null){
      ASKED_FOR = st;
      askFocus(st, row.minutes, true, (stops[i].payload || {}).day || VIEW.today.date);
      return;
    }
  }
  var us = VIEW.today.unscored || [];
  for(var j = 0; j < us.length; j++){
    var u = us[j];
    if(ASKED_FOR === u.start || !u.end || !u.ended_iso) continue;
    var ended = Math.round((Date.now() - Date.parse(u.ended_iso)) / 60000);
    if(!(ended >= 0 && ended <= 3)) continue;
    ASKED_FOR = u.start;
    askFocus(u.start, u.minutes, false);
    return;
  }
}
function tickClock(){
  clearInterval(CLOCK_T);
  var e = document.getElementById('liveclock');
  if(!e) return;
  var upd = function(){
    var n = document.getElementById('liveclock');
    if(!n){ clearInterval(CLOCK_T); return; }
    var o = {start:n.getAttribute('data-start'), started_iso:n.getAttribute('data-since') || null,
             paused_min:+n.getAttribute('data-paused') || 0, paused_at:n.getAttribute('data-pausedat') || null,
             paused_iso:n.getAttribute('data-pausediso') || null};
    var w = workedSecs(o);
    n.innerHTML = hms(w);
    var pc = document.getElementById('pauseclock');
    if(pc && o.paused_at) pc.innerHTML = hms(secsSince(o.paused_at, o.paused_iso));
    var tl = document.getElementById('todaylive');
    if(tl && VIEW){ var tm = (VIEW.today.work_minutes || 0) + Math.floor(w / 60); tl.textContent = hmShort(tm);
      var tb = document.getElementById('todaybar'); if(tb) tb.style.width = Math.min(100, Math.round(tm / 600 * 100)) + '%'; }
  };
  upd();
  CLOCK_T = setInterval(upd, 1000);   // seconds, so a running box visibly runs
}

/* ── sheets ─────────────────────────────────────────────────────────────── */
var SHEET = null;
function openSheet(html, opts){
  opts = opts || {};
  // A mandatory sheet is never replaced. `typeInstead` opening after a failed
  // transcription used to destroy the rating sheet and leave a closed session
  // unrated with nothing ever asking again.
  if(SHEET && SHEET.dataset.mandatory && !opts.mandatory){
    toast('Give the session a score first.');
    return;
  }
  closeSheet(true);
  // Remove any sheet still sliding out. It keeps its ids for 340ms, so
  // getElementById returns the OLD button and every repaint reads stale state.
  document.querySelectorAll('.sheet').forEach(function(n){ n.remove(); });
  SHEET = el('<div class="sheet"><div class="grab"></div>' + html + '</div>');
  SHEET.dataset.mandatory = opts.mandatory ? '1' : '';
  SHEET.setAttribute('tabindex', '-1');
  SHEET_OPENER = document.activeElement;
  document.body.appendChild(SHEET);
  document.getElementById('scrim').classList.add('on');
  setTimeout(function(){ if(SHEET) SHEET.classList.add('on'); }, 16);
  // Focus goes into the sheet, so Tab does not wander the page behind the
  // scrim. A text field is not focused here: that would raise the keyboard
  // on the phone before the sheet has finished sliding in.
  setTimeout(function(){
    if(!SHEET || SHEET.contains(document.activeElement)) return;
    var f = SHEET.querySelector('button:not([disabled])');
    try{ (f || SHEET).focus({preventScroll:true}); }catch(e){}
  }, 60);
}
var SHEET_OPENER = null;
function closeSheet(force){
  document.querySelectorAll('.nav button').forEach(function(b){
    var g = b.dataset.go;
    b.classList.toggle('on', g === TAB || (g === 'more' && (TAB === 'notes' || TAB === 'progress'))); });
  if(!SHEET) return;
  if(SHEET.dataset.mandatory && !force) return;
  var s = SHEET; SHEET = null;
  s.classList.remove('on');
  document.getElementById('scrim').classList.remove('on');
  setTimeout(function(){ s.remove(); }, 340);
  var back = SHEET_OPENER; SHEET_OPENER = null;
  if(back && back.focus && document.contains(back) && s.contains(document.activeElement)){
    try{ back.focus({preventScroll:true}); }catch(e){}
  }
}

/* ── all taps, in one place ─────────────────────────────────────────────── */
document.addEventListener('click', async function(ev){

    '[data-filter],[data-areafilter],[data-goaltick],[data-day],[data-hist],[data-editsess],' +
    '[data-noteact],[data-range],[data-corner],#startBtn,#stopBtn,#pauseBtn,#resumeBtn,#saveGoals,#editGoals,#reloadBtn,#addSess,' +
    '#sessSave,#sessDelete,[data-sarea],[data-sstate],[data-act],[data-info]');
  if(!t) return;
  // A sheet keeps its buttons for 340ms while it slides out. A second tap in
  // that window used to post the same event again.
  if(t.closest('.sheet') && !t.closest('.sheet.on')) return;
  if(t.dataset.act === 'allhist'){ SHOW_ALL_HIST = true; render(); return; }
  if(t.dataset.act === 'type'){ typeInstead(null); return; }
  if(t.dataset.info){ var inf = INFO[t.dataset.info]; openSheet('<h3>'+esc(inf[0])+'</h3><p class="small dim prose" style="margin-top:10px">'+esc(inf[1])+'</p>'); return; }
  if(t.dataset.act === 'daytoday'){ SHOW_TOMORROW = false; render(); return; }
  if(t.dataset.range){ P_RANGE = t.dataset.range; rememberView(); render(); return; }
  if(t.dataset.corner){ P_CORNER = t.dataset.corner; rememberView(); render(); return; }
  if(t.dataset.act === 'daytomorrow'){ SHOW_TOMORROW = true; render(); return; }

  if(t.id === 'reloadBtn'){ location.reload(); return; }
  if(t.dataset.go && SHEET && SHEET.dataset.mandatory){ toast('Give the session a score first.'); return; }
  if(t.dataset.go === 'more'){ moreSheet(); return; }
  if(t.dataset.go){ closeSheet(true); TAB = t.dataset.go; rememberTab(); window.scrollTo(0,0); render(); return; }
  if(t.dataset.filter){ TASK_FILTER = t.dataset.filter; rememberView(); render(); return; }
  if(t.dataset.areafilter){ AREA_FILTER = t.dataset.areafilter; rememberView(); render(); return; }

    return;
  }

    await record(t.id === 'pauseBtn' ? 'session_pause' : 'session_resume', {start: os.start, day: VIEW.today.date});

    // row rather than for "any open session". Without it, a start and a stop
    // inside one publish window left the blob with nothing open, the stop was
    // deleted as already filed, and the start alone reopened the session a
    // minute later with the day's total back at zero.
    // The sheet opens BEFORE the network call. Awaiting the post first left
    // seconds on a slow connection where the session already read as stopped,
    // the Start button was live again, and no sheet had appeared.

  }

    // may already be on the wire, so amending its payload would be a race, and
    // the score names the session by its start time instead. The 190ms delay
    // was purely so the selected button was visible, and a force-quit inside it
    // used to throw away a score the user had actually given.
    record('session_focus', {start:forStart, focus:n, day:forDay || VIEW.today.date});
    setTimeout(function(){
      closeSheet(true);

    }, 190);
    return;
  }
  if(t.dataset.noteact){

      if(!t.dataset.armed){
        t.dataset.armed = '1'; t.textContent = 'Sure?';

function nextDate(iso){
  var d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + 1);
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
}
async function planFromSpeech(text, entryId){
  if(TAB !== 'time') return false;
  var blocks = parsePlan(text);
  if(!blocks.length) return false;
  // "tomorrow 9 to 11 research" is tomorrow's plan. It goes to the Mac under
  // that date and is not drawn on today's timeline.
  // Said "tomorrow", or spoken while looking at tomorrow's plan.
  var tomorrow = /\btomorrow\b/i.test(text) || (SHOW_TOMORROW && (VIEW.tomorrow.plan || []).length > 0);
  var forDay = tomorrow ? VIEW.tomorrow.date : VIEW.today.date;
  // A second sentence adds to the plan; it only replaces the blocks it
  // overlaps. The whole merged list goes to the Mac, which writes the table.
  var kept = (tomorrow ? (VIEW.tomorrow.plan || []) : (VIEW.today.plan || [])).filter(function(e){
    return e.start && e.end && !blocks.some(function(b){ return planOverlap(e, b); });
  }).map(function(e){ return {start:e.start, end:e.end, minutes:e.minutes, activity:e.activity,
                              duration:e.duration, status:e.status}; });
  blocks = kept.concat(blocks).sort(function(x, y){
    var m = function(v){ var q = toMin(v); return q < 300 ? q + 1440 : q; };
    return m(x.start) - m(y.start);
  });
  await record('plan_set', {blocks:blocks, day:forDay});
  if(entryId){ try{ await patchNote(entryId, {status:'done'}); }catch(e){} }
  if(tomorrow){ SHOW_TOMORROW = true; if(TAB !== 'time'){ TAB = 'time'; rememberTab(); } }
  render();
  toast('Planned ' + blocks.length + ' block' + (blocks.length > 1 ? 's' : '') + (tomorrow ? ' for tomorrow.' : ' for today.'));
  return true;
}
/* Goals spoken on the Goals page while the week has none become the week's
   goal list at once. "This week: finish the rebuttal, and ship the landing
   page" is two goals. Once goals exist, a note there is a review or a change
   for Claude to read. */
/* Spoken goals are never read by the phone. A goal is a sentence about the
   week, and the page once cut a two-minute note into five goals made of its
   first words. The note stays on the Notes page until Claude has written the
   goals into the week file; only then do they appear here. Amir, 2026-09-02. */
function typeInstead(ts){
  var pageName = TAB === 'home' ? 'Triangle' : TITLES[TAB];
  openSheet('<h3>Write a note</h3>' +
    '<p class="small muted">It goes where a spoken note goes, tagged with the ' + esc(pageName) +
    ' page. On a keyboard, Cmd or Ctrl and Enter sends it.</p>' +
    '<textarea id="typedNote" rows="4" dir="auto" placeholder="What happened?" style="width:100%;resize:none;' +
    'margin-top:14px;padding:13px;border:1px solid var(--line);border-radius:11px;' +
    'background:var(--surface);resize:vertical"></textarea>' +
    '<button class="btn wide primary" id="sendTyped" style="margin-top:12px">Send</button>');
  setTimeout(function(){
    var b = document.getElementById('sendTyped'); if(!b) return;
    var ta = document.getElementById('typedNote');
    if(ta){
      ta.focus();
      ta.addEventListener('keydown', function(ev){
        if(ev.key === 'Enter' && (ev.metaKey || ev.ctrlKey)){ ev.preventDefault(); b.click(); }
      });
    }
    b.onclick = async function(){
      var v = (document.getElementById('typedNote')||{}).value || '';
      if(!v.trim()) return;
      try{
        if(await planFromSpeech(v.trim(), null)){ closeSheet(true); return; }
        await postEntry(v.trim(), TAB, ts || nowISO());
        closeSheet(true); toast('Saved. Claude files it at your computer.');
        await refreshNotes(); if(TAB === 'notes') render();
      }catch(e){ toast('Could not save that. Check your connection.'); }
    };
  }, 60);
}
function bindMic(){
  var m = document.getElementById('mic');
  if(!m) return;
  m.addEventListener('pointerdown', function(e){ e.preventDefault(); startRec(); });
  ['pointerup','pointercancel','pointerleave'].forEach(function(ev){
    m.addEventListener(ev, function(e){ e.preventDefault(); stopRec(); });
  });
  // A long press with no microphone still has to lead somewhere.
  m.addEventListener('contextmenu', function(e){ e.preventDefault(); });
}

/* ═════════════════════════════════════════════════════════════ boot ══════ */
var REFRESHING = false, LAST_OK = 0;
var LAST_SIG = '', UPDATED_RAW = '';
function djb2(str){ var h = 5381; for(var i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) | 0; return h; }
function sigNow(){
  var pic = RAW ? [RAW.generated_at, djb2(JSON.stringify(RAW.today || '')), djb2(JSON.stringify(RAW.tomorrow || '')),
                   djb2(JSON.stringify(RAW.week || '')), djb2(JSON.stringify(RAW.tasks || '')),
                   (RAW.open_qids || []).length].join(':') : '';
  return [UPDATED_RAW, pic, workingDayOf(new Date().toISOString()),
          (NOTES || []).map(function(x){ return x.id; }).join(','),
          PEND.map(function(e){ return e.qid + (e.sent ? '+' : '-'); }).join(','),
          REMOTE.map(function(e){ return e.qid; }).join(','),
          UNREACHABLE, !!RAW, staleWhy()].join('|');
}
async function refresh(){
  if(!CFG || REFRESHING) return;
  REFRESHING = true;
  try{
    // Both fetches at once: the notes used to wait for the state, and the
    // first paint waited for both.
    var notesP = Promise.all([refreshNotes(), refreshRemote()]).catch(function(){});
    try{
      var st = await getState();
      if(st && st.blob && typeof st.blob === 'object' && !Array.isArray(st.blob)){
        RAW = st.blob; UPDATED = localStamp(st.updated_at); UPDATED_RAW = String(st.updated_at || ''); LAST_OK = Date.now(); UNREACHABLE = '';
      } else if(!RAW){
        // The table answered but holds nothing: the Mac has never published.
        UNREACHABLE = 'Your computer has not published a picture yet. Run the myday job on the Mac once, then try again.';
      }
    }catch(e){
      if(!RAW){
        // A toast fades in three seconds and leaves a skeleton that looks
        // broken for ever. The failure has to stay on the page, with a way back.
        // render() draws it, so the loading skeleton cannot overwrite it.
        var raw = String((e && e.message) || e), code = (raw.match(/\b(\d{3})\b/) || [])[1];
        UNREACHABLE = code === '401' ? 'The database did not accept the key in this link (401).'
                    : code ? 'The database answered with an error (' + code + ').'
                    : 'No answer came back from the database.';
      }
    }
    try{ prunePend(RAW); }catch(e){ console.error('prune failed', e); }
    flushPend();
    await notesP;
    // Redraw only when something changed. A timer redraw every minute made
    // the page breathe while he read it, for no new information.
    // Compared with what the last render drew, whoever called it, so a prune
    // that undoes a tap is always painted.
    if(sigNow() !== LAST_SIG || !VIEW) render();
  } finally { REFRESHING = false; }
}
function staleMinutes(){
  /* Once a blob has loaded, every later fetch failure used to be silent, so a
     phone that had been offline all day looked exactly like a fresh one. */
  return LAST_OK ? Math.floor((Date.now() - LAST_OK) / 60000) : null;
}
function publishAgeMinutes(){
  /* How old the DATA is, which is a different question from how old the fetch
     is. If the Mac sleeps overnight while the phone stays online, every fetch
     succeeds and the phone happily shows yesterday. The job publishes every
     fifteen minutes, so anything much past that means the Mac is not awake. */
  if(!UPDATED) return null;
  var t = Date.parse(UPDATED.replace(' ', 'T'));
  return isNaN(t) ? null : Math.floor((Date.now() - t) / 60000);
}

/* The page reloads itself when the deployed build differs from the one running,
   because a phone with the app already open would otherwise keep showing an old
   copy forever and a correct deploy would look like a failed one. */
var PAGE_ETAG = null;
async function checkBuild(){
  if(SHEET) return;   // never reload out from under any open sheet
  try{
    // A HEAD is a few hundred bytes. Downloading the whole page every five
    // minutes cost 50 KB a time and competed with the data on every unlock.
    var h = await fetch(location.pathname, {method:'HEAD', cache:'no-store'});
    var tag = h.headers.get('etag') || h.headers.get('last-modified') || '';
    if(PAGE_ETAG === null){ PAGE_ETAG = tag; return; }
    if(!tag || tag === PAGE_ETAG) return;
    var r = await fetch(location.pathname + '?b=' + Date.now(), {cache:'no-store'});
    var m = (await r.text()).match(/var BUILD = '([^']+)'/);
    PAGE_ETAG = tag;
    if(m && m[1] !== BUILD) location.reload();
  }catch(e){}
}

loadPend();
window.addEventListener('scroll', syncBar, {passive:true});
// A resized window is a new layout: the task columns and the board's fit are
// decided at render time.
var RESIZE_T = null, LAST_W = window.innerWidth;
window.addEventListener('resize', function(){
  clearTimeout(RESIZE_T);
  RESIZE_T = setTimeout(function(){
    if(window.innerWidth === LAST_W) return;
    LAST_W = window.innerWidth;
    if(!(SHEET && SHEET.classList.contains('on'))) render();
  }, 250);
});
render();
refresh();
setTimeout(checkBuild, 4000);   // record the tag now, so a deploy in the first five minutes is seen
setInterval(function(){ if(!document.hidden) refresh(); }, 60000);
setInterval(function(){ if(!document.hidden) pollRemote(); }, 20000);
setInterval(function(){ if(!document.hidden) checkBuild(); }, 300000);
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState === 'visible'){ refresh(); checkBuild(); tickClock(); }
  else clearInterval(CLOCK_T);   // nobody is looking at the live clock
});
window.addEventListener('online', flushPend);
