<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>myday</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="myday">
<meta name="theme-color" content="#FBFAF9">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 5 28 26H4z' fill='none' stroke='%23AD5B2B' stroke-width='3' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preload" href="../fonts/instrument-serif.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"></noscript>
<style>
/* The serif is ours, 15 KB, preloaded, so the numbers never repaint. Inter
   loads without blocking; the system face stands in until it lands. */
@font-face{font-family:"Instrument Serif"; font-style:normal; font-weight:400; font-display:swap;
  src:url(../fonts/instrument-serif.woff2) format("woff2")}
/* ─────────────────────────────────────────────────────────────────────────
   myday — light and calm.

   The whole site is built around one idea: consistency, focus and goals only
   work together. Those three are the triangle, they own the three accent
   colours below, and every screen uses the same colour for the same corner so
   the meaning never has to be re-learned.
   ───────────────────────────────────────────────────────────────────────── */
:root{
  /* paper and ink */
  --bg:#FBFAF9; --surface:#FFFFFF; --surface-2:#F6F4F1;
  --line:#EAE6E1; --line-soft:#F2EFEB;
  --ink:#1C1917; --ink-2:#57534E; --ink-3:#6F6963;

  /* the three corners. same colour, same meaning, everywhere. */
  --consistency:#AD5B2B; --consistency-soft:#FBF0E8;
  --focus:#33695C;       --focus-soft:#EAF3F0;
  --goals:#6B5CA5;       --goals-soft:#F0EDF7;

  --good:#33695C; --warn:#AD5B2B; --bad:#B0413E;
  /* Notices are slate, not terracotta and not red. Terracotta belongs to
     Consistency and red belongs to overdue; a missing score is neither bad nor
     urgent, it is simply not there yet. */
  --notice:#5C5651; --notice-bg:#F1EFEC; --notice-line:#DCD7D1;

  --r:16px; --r-sm:10px; --r-lg:16px;
  --shadow:0 1px 2px rgba(28,25,23,.04), 0 8px 24px -12px rgba(28,25,23,.10);
  --shadow-lg:0 2px 4px rgba(28,25,23,.05), 0 18px 48px -20px rgba(28,25,23,.18);
  --ease:cubic-bezier(.22,.61,.36,1);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overscroll-behavior-y:none;
}
h1,h2,h3{margin:0; font-weight:600; letter-spacing:-.015em}
p{margin:0}
button{font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer;
  -webkit-tap-highlight-color:transparent}
input,textarea{font:inherit; color:inherit}
.serif{font-family:"Instrument Serif",Georgia,"Times New Roman",serif; font-weight:400; letter-spacing:0}

/* ── layout ─────────────────────────────────────────────────────────────── */
#app{min-height:100dvh; display:flex; flex-direction:column}
.topbar.stale{box-shadow:inset 0 3px 0 var(--consistency)}
.topbar{
  position:sticky; top:0; z-index:40; padding:calc(var(--safe-t) + 14px) 20px 12px;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:saturate(180%) blur(14px); -webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid transparent; transition:border-color .2s;
  display:flex; align-items:baseline; gap:12px;
}
.topbar.scrolled{border-bottom-color:var(--line)}
.topbar h1{font-size:19px}
.topbar .date{margin-left:auto; font-size:13px; color:var(--ink-3); white-space:nowrap; max-width:55%; overflow:hidden; text-overflow:ellipsis}
main{flex:1; padding:4px 20px calc(160px + var(--safe-b)); max-width:760px; width:100%; margin:0 auto}
.page{display:none}
.page.on{display:block; animation:rise .36s var(--ease) both}
@keyframes rise{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}

/* ── cards ──────────────────────────────────────────────────────────────── */
.card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:18px; margin:14px 0; box-shadow:var(--shadow); min-width:0;
}
.card.flush{padding:0; overflow:hidden}
.card h2{font-size:12px; font-weight:600; letter-spacing:.09em; text-transform:uppercase;
  color:var(--ink-3); margin-bottom:14px}
.card h2.hd{display:flex; align-items:center; gap:8px}
.card h2.hd .ibtn{margin-left:auto}
.row{display:flex; align-items:center; gap:12px}
.spread{display:flex; align-items:center; justify-content:space-between; gap:12px}
.muted{color:var(--ink-3)}
.prose{max-width:66ch; overflow-wrap:anywhere}
.dim{color:var(--ink-2)}
.tiny{font-size:12px}
.small{font-size:13px}
.stack{display:flex; flex-direction:column; gap:10px}
.grid2{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:12px}
.grid3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px}

/* ── the triangle ───────────────────────────────────────────────────────── */
.tri-wrap{display:flex; flex-direction:column; align-items:center; padding:6px 0 0}
.tri-svg{width:100%; max-width:330px; height:auto; overflow:visible}
.tri-guide{fill:none; stroke:var(--line); stroke-width:1}
.tri-ring{fill:none; stroke:var(--line-soft); stroke-width:1}
.tri-axis{stroke:var(--line); stroke-width:1}
.tri-shape-g{animation:triIn .42s var(--ease) both}
.strip .tri-shape-g, .pcell .tri-shape-g{animation:none}
@keyframes triIn{from{transform:scale(.94); opacity:0} to{transform:scale(1); opacity:1}}
.tri-dot{stroke:#fff; stroke-width:2.5}
.tri-label{font-size:10.5px; font-weight:600; letter-spacing:.07em; text-transform:uppercase}
.tri-val{font-family:"Instrument Serif",Georgia,serif; font-size:19px}
.tri-unit{font-size:9.5px; letter-spacing:.05em; text-transform:uppercase}
.tri-score{text-align:center; margin-top:2px}
.tri-score .n{font-family:"Instrument Serif",Georgia,serif; font-size:56px; line-height:1;
  letter-spacing:-.02em}
.tri-score .n sup{font-size:22px; vertical-align:top; margin-left:2px; color:var(--ink-3)}
.tri-score .cap{font-size:12px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3);
  margin-top:6px}
.advice{
  margin-top:16px; padding:13px 15px; border-radius:var(--r-sm); font-size:13.5px;
  background:var(--surface-2); border:1px solid var(--line-soft); color:var(--ink-2);
  display:flex; gap:9px; align-items:flex-start;
}
.advice b{color:var(--ink); font-weight:600}
.advice .pip{width:8px; height:8px; border-radius:50%; margin-top:6px; flex:0 0 auto}

/* ── corner stats ───────────────────────────────────────────────────────── */
.corner{
  border:1px solid var(--line); border-radius:var(--r-sm); padding:12px 13px; background:var(--surface);
  display:flex; flex-direction:column; gap:7px; text-align:left;
  transition:transform .2s var(--ease), box-shadow .2s var(--ease);
}
.corner:active{transform:scale(.975)}
.corner .lab{font-size:10.5px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; white-space:nowrap}
.corner .val{font-family:"Instrument Serif",Georgia,serif; font-size:28px; line-height:1}
.corner .sub{font-size:11.5px; color:var(--ink-3)}
.bar{height:8px; border-radius:5px; background:var(--surface-2);
  border:1px solid var(--line-soft); overflow:hidden}
.bar > i{display:block; height:100%; border-radius:3px; width:0;
  transform-origin:left center; animation:growBar .9s var(--ease) both}
@keyframes growBar{from{transform:scaleX(0)} to{transform:scaleX(1)}}

/* ── month strip ────────────────────────────────────────────────────────── */
.strip-head{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:4px 2px; text-align:center;
  font-size:10.5px; font-weight:600; letter-spacing:.06em; color:var(--ink-3); margin-bottom:4px}
.strip .d.pad{visibility:hidden}
.strip{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:4px 2px; padding:2px 0 4px}
.strip .d{width:auto; text-align:center; cursor:pointer; border-radius:8px; padding:3px 0; transition:background .16s}
.strip .d:hover{background:var(--surface-2)}
.strip .d svg{display:block; width:40px; height:auto; margin:0 auto}
.strip .d .dl{font-size:11px; color:var(--ink-3); margin-top:2px}
.strip .d.sel .dl{color:var(--ink); font-weight:700}

/* ── session / list rows ────────────────────────────────────────────────── */
.item{display:flex; gap:12px; align-items:center; padding:13px 16px; border-bottom:1px solid var(--line-soft)}
.item:last-child{border-bottom:0}
.item .grow{flex:1; min-width:0}
.item .t{font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  unicode-bidi:plaintext}
.tk .t, .goal .txt{unicode-bidi:plaintext}
.item .s{font-size:12px; color:var(--ink-3); margin-top:2px}
.item .grow > div{overflow-wrap:anywhere}
.pill{font-size:11px; font-weight:600; padding:3px 8px; border-radius:99px; white-space:nowrap}
.fscore{
  width:34px; height:34px; flex:0 0 auto; border-radius:10px; display:grid; place-items:center;
  font-family:"Instrument Serif",Georgia,serif; font-size:17px; border:1px solid transparent;
}
.fscore.none{background:var(--notice-bg); border:1px solid var(--notice-line);
  color:var(--notice); font-family:Inter,sans-serif; font-size:9.5px; font-weight:700;
  letter-spacing:.02em; line-height:1.05; text-align:center}
.fscore.live{background:var(--focus-soft); border:1px solid var(--focus); color:var(--focus);
  font-family:Inter,sans-serif; font-size:10px; font-weight:700}
.dur{font-variant-numeric:tabular-nums; font-size:13px; color:var(--ink-2); white-space:nowrap}
.ibtn{position:relative; width:20px; height:20px; border-radius:50%; border:1.5px solid var(--ink-3); color:var(--ink-3);
  font-family:"Instrument Serif",Georgia,serif; font-style:italic; font-size:13px; line-height:1; display:inline-grid;
  place-items:center; vertical-align:middle; margin-left:4px; flex:0 0 auto}
.editbtn{width:30px; height:30px; flex:0 0 auto; border-radius:9px; border:1px solid var(--line);
  color:var(--ink-3); font-size:13px; display:grid; place-items:center; margin-left:2px}

/* ── buttons ────────────────────────────────────────────────────────────── */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:13px 20px; border-radius:12px; font-weight:600; font-size:14.5px;
  border:1px solid var(--line); background:var(--surface); color:var(--ink);
  transition:transform .16s var(--ease), background .16s, box-shadow .16s;
}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--ink); color:#fff; border-color:var(--ink)}
.btn.stop{background:var(--bad); color:#fff; border-color:var(--bad)}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45; pointer-events:none}

/* ── the big start/stop ─────────────────────────────────────────────────── */
.runner{
  border-radius:var(--r); padding:18px; border:1px solid var(--line);
  background:var(--surface); box-shadow:var(--shadow); margin:14px 0;
}
.runner.live{border-color:color-mix(in srgb,var(--focus) 40%,var(--line)); background:var(--focus-soft)}
.runner .clock{font-family:"Instrument Serif",Georgia,serif; font-size:30px; line-height:1;
  font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){ .livedot{animation:none !important} }
.runner .area-big{font-size:24px; font-weight:700; letter-spacing:-.01em; margin:8px 0 2px; overflow-wrap:anywhere}
.runner .runlab{font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--focus)}
.runner .runlab #pauseclock{font-weight:600; letter-spacing:0; text-transform:none; margin-left:6px; color:var(--notice)}
.runner.paused{border-color:var(--notice-line); background:var(--notice-bg)}
.runner.paused .runlab{color:var(--notice)}
.runner.paused .livedot{background:var(--notice); animation:none}
.runner.paused .clock{color:var(--ink-2)}
.run-grid{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:16px; align-items:end}
.run-side{text-align:right; min-width:104px}
.run-side .eyebrow{font-weight:700; letter-spacing:.08em; text-transform:uppercase}
.run-side .today-live{font-size:26px; line-height:1.1; margin:6px 0 2px}
.run-side .bar{margin-top:8px; width:104px; margin-left:auto}
.run-btns{gap:10px; margin-top:16px}
.run-btns .btn{flex:1}
.run-btns .btn.primary{flex:1.6}
.runner .clock{font-variant-numeric:tabular-nums}
.runner .clock .secs{font-size:.6em; color:var(--ink-3); margin-left:2px}
.livedot{width:8px;height:8px;border-radius:50%;background:var(--focus);
  animation:pulse 2s var(--ease) infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}

/* ── nav ────────────────────────────────────────────────────────────────── */
.nav{
  position:fixed; left:0; right:0; bottom:0; z-index:50;
  padding:5px 8px calc(4px + var(--safe-b)); display:flex; gap:2px;
  background:color-mix(in srgb, var(--bg) 90%, transparent);
  backdrop-filter:saturate(180%) blur(16px); -webkit-backdrop-filter:saturate(180%) blur(16px);
  border-top:1px solid var(--line);
}
.nav button{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; min-height:46px;
  padding:5px 0; min-width:0; border-radius:12px; color:var(--ink-3); font-size:10.5px; font-weight:600;
  letter-spacing:-.02em; transition:color .18s, background .18s; position:relative;
}
.nav button .ic{line-height:0; position:relative}
.nav button .ic svg{width:22px; height:22px; display:block}
.nav button .badge{position:absolute; top:-5px; right:-9px; min-width:16px; height:16px; padding:0 4px;
  border-radius:8px; background:var(--goals); color:#fff; font-size:10px; font-weight:700;
  display:grid; place-items:center; line-height:1}
@media (hover:hover){
  .nav button:not(.on):hover, .chip:not(.on):hover, .seg button:not(.on):hover{background:var(--surface-2)}
  .btn:not(.primary):hover, .tk:hover, .goal:hover, .drow:hover, .corner:hover{background:var(--surface-2)}
  .btn.primary:hover, .typebtn:hover, .mic:hover{background:#33302c}
  .ibtn:hover, .tk .box:hover, .goal .tick:not(.on):hover, .editbtn:hover{border-color:var(--ink)}
}
.morebtn{justify-content:flex-start; gap:14px; padding:14px 16px; text-align:left}
.morebtn .ic{width:28px; display:grid; place-items:center; color:var(--ink-2)}
.morebtn .ic svg{width:24px; height:24px}
.empty .ico svg{width:32px; height:32px; display:block; margin:0 auto}
.nav .wide-tab{display:none}
.nav button.on{color:var(--ink); background:var(--surface-2)}

/* ── the microphone, on every page ──────────────────────────────────────── */
/* The microphone is a bar, not a floating blob. A floating button parks itself
   on top of whatever control happens to scroll under it, and it did exactly
   that to the Start button. As part of the fixed chrome it can never cover
   anything, and main's bottom padding accounts for its height. */
.micwrap{position:fixed; left:0; right:0; bottom:calc(56px + var(--safe-b)); z-index:60}
.mic{
  display:flex; align-items:center; justify-content:center; gap:10px; width:100%;
  padding:9px 18px; background:var(--ink); color:#fff; font-size:14.5px; font-weight:600;
  text-align:left;
  border-top:1px solid rgba(255,255,255,.08);
  transition:background .18s var(--ease), padding .18s var(--ease);
  touch-action:none; user-select:none; -webkit-user-select:none;
}
.microw{display:flex; align-items:stretch}
.microw .mic{flex:1; min-width:0}
.typebtn{
  flex:0 0 60px; background:var(--ink); color:#fff; line-height:1;
  border-left:1px solid rgba(255,255,255,.14); border-top:1px solid rgba(255,255,255,.08);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; touch-action:manipulation;
}
.typebtn span{font-size:22px; font-weight:400}
.typebtn small{font-size:9.5px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; opacity:.75}
.typebtn:active{background:var(--ink-2)}
.mic .ring{
  width:26px; height:26px; border-radius:50%; flex:0 0 auto;
  background:rgba(255,255,255,.14); border:1.5px solid rgba(255,255,255,.5);
  display:grid; place-items:center;
}
.mic .ring::before{
  content:""; width:8px; height:12px; border-radius:4px; background:#fff;
  box-shadow:0 7px 0 -3px #fff, 0 9px 0 -4px #fff;
}
.mic:active,.mic.rec{background:var(--bad); padding:18px 20px}
.mic.rec .ring{animation:ripple 1.1s var(--ease) infinite}
@keyframes ripple{0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(.55);opacity:.5}}
/* The hint used to be its own strip. Three stacked bars took about 145 CSS px
   of an iPhone screen on every page, so it lives inside the bar now. */
.mic-hint{display:block; font-size:11.5px; font-weight:400; opacity:.72; margin-top:2px}

/* ── sheet (focus prompt, editors) ──────────────────────────────────────── */
.scrim{position:fixed; inset:0; z-index:80; background:rgba(28,25,23,.34);
  opacity:0; pointer-events:none; transition:opacity .26s var(--ease)}
.scrim.on{opacity:1; pointer-events:auto}
.sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:90;
  background:var(--surface); border-radius:22px 22px 0 0; padding:22px 20px calc(24px + var(--safe-b));
  transform:translateY(102%); transition:transform .34s var(--ease);
  box-shadow:0 -12px 44px -16px rgba(28,25,23,.28); max-height:88dvh; overflow-y:auto;
}
.sheet.on{transform:none}
.sheet .grab{width:38px; height:4px; border-radius:3px; background:var(--line);
  margin:-8px auto 16px}
.sheet h3{font-size:19px; margin-bottom:6px}

/* ── the 1 to 10 focus picker ───────────────────────────────────────────── */
.seg{display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:4px; background:var(--surface-2);
  border:1px solid var(--line); border-radius:12px; padding:4px}
.seg button{padding:9px; min-height:40px; border-radius:9px; font-size:13.5px; font-weight:600; color:var(--ink-2)}
.seg button.on{background:var(--surface); color:var(--ink); box-shadow:var(--shadow)}
.sheet label{display:flex; flex-direction:column; gap:5px; min-width:0}
.sheet input[type=time]{padding:11px 12px; border:1px solid var(--line); border-radius:11px;
  background:var(--surface); font-variant-numeric:tabular-nums; width:100%}
.kbd-hint{display:none}
@media (min-width:900px){ .kbd-hint{display:block; margin-top:10px} }
.scale{display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin:18px 0 4px}
.scale button{
  aspect-ratio:1; border-radius:13px; border:1px solid var(--line); background:var(--surface);
  font-family:"Instrument Serif",Georgia,serif; font-size:22px; color:var(--ink-2);
  transition:transform .14s var(--ease), background .14s, color .14s, border-color .14s;
}
.scale button:active{transform:scale(.92)}
.scale button.on{background:var(--focus); border-color:var(--focus); color:#fff}
.scale-ends{display:flex; justify-content:space-between; font-size:11.5px; color:var(--ink-3);
  margin-top:9px}

/* ── goals ──────────────────────────────────────────────────────────────── */
.goal{padding:15px 16px; border-bottom:1px solid var(--line-soft)}
.goal:last-child{border-bottom:0}
.goal .top{display:flex; gap:11px; align-items:flex-start}
.goal .tick{
  width:22px;height:22px;border-radius:7px;border:1.5px solid #C9C2BA;flex:0 0 auto;
  display:grid;place-items:center;font-size:12px;color:#fff;background:var(--surface);
  transition:.18s var(--ease); margin-top:1px;
}
.goal .tick.on{background:var(--goals); border-color:var(--goals)}
.goal .txt{flex:1; min-width:0; font-weight:500; line-height:1.4; overflow-wrap:anywhere}
.goal.done .txt{color:var(--ink-3)}
.goal.done .txt .gt{text-decoration:line-through}
.goal .pct{font-variant-numeric:tabular-nums; font-size:13px; color:var(--ink-3); font-weight:600}
.slider{width:calc(100% - 33px); margin:12px 0 0 33px; accent-color:var(--goals)}
.slider[data-locked]{pointer-events:none}
.goal .bar{margin-left:33px; width:calc(100% - 33px)}
.nag{
  background:var(--goals-soft); border:1px solid color-mix(in srgb,var(--goals) 26%,transparent);
  border-radius:var(--r); padding:17px; margin:14px 0;
}
.nag h3{color:var(--goals); font-size:15px; margin-bottom:6px}

/* ── calendar timeline ──────────────────────────────────────────────────── */
.timeline{position:relative; margin:6px 0 4px; padding-left:46px}
.timeline .hr{position:absolute; left:0; width:100%; border-top:1px solid var(--line-soft)}

<body>
<div id="app"></div>
<div class="scrim" id="scrim"></div>
<div class="toast" id="toast"></div>
<script>
/* ═════════════════════════════════════════════════════════════════════════
   myday console.

   The site never writes to the markdown files. It renders a blob the Mac
   publishes, and it records what Amir taps as events. Claude files those back
   into tasks/ and days/ by hand. That boundary is what makes the markdown
   trustworthy, and it is the same contract the voice notes have always had.
   ═════════════════════════════════════════════════════════════════════════ */
'use strict';

/* Bump on every deploy. The page compares this against the copy the server has
   and reloads itself when they differ, because a phone with the app already
   open would otherwise keep showing yesterday's build forever. Shipping correct
   code with a stale BUILD looks exactly like the deploy failing. */
var BUILD = 'c75-2026-09-03-wide';

/* ── config ─────────────────────────────────────────────────────────────── */
/* The Supabase URL and the publishable key ride in the #fragment. A fragment is
   never sent to a server and never committed, so the public repo holds no key. It must stay in the address bar:
   iOS gives a Home Screen web app its own storage, so an icon saved without the
   fragment opens to "Not linked yet" no matter what Safari has. */
var TAB_KEYS = ['home','time','focus','goals','tasks','notes','progress'];
var CFG = null;
function loadCfg(){
  var h = location.hash.replace(/^#/,'');
  if(h){
    var p = new URLSearchParams(h), u = p.get('u'), k = p.get('k');
    if(u && k){
      CFG = {url:u.replace(/\/+$/,''), key:k};
      try{ localStorage.setItem('myday_cfg2', JSON.stringify(CFG)); }catch(e){}
    }
    // A refresh stays on the page he was reading. The last tab is remembered on
    // this device, and a `tab` in the link wins over it, so a link can still
    // open straight on one page.
    restoreTab();
    var t = p.get('tab');
    if(t && TAB_KEYS.indexOf(t) >= 0) TAB = t;
    if(CFG) return CFG;
  }
  restoreTab();
  try{ CFG = JSON.parse(localStorage.getItem('myday_cfg2')||'null'); }catch(e){ CFG = null; }
  return CFG;
}
function restoreTab(){
  try{ var lt = localStorage.getItem('myday_tab'); if(lt && TAB_KEYS.indexOf(lt) >= 0) TAB = lt; }catch(e){}
  // The filters and the Progress view come back too. A refresh on Tasks with
  // UCW selected used to land on All areas.
  try{
    var vw = JSON.parse(localStorage.getItem('myday_view') || '{}') || {};
    if(typeof vw.task === 'string') TASK_FILTER = vw.task;
    if(typeof vw.area === 'string') AREA_FILTER = vw.area;
    if(typeof vw.range === 'string') P_RANGE = vw.range;
    if(typeof vw.corner === 'string') P_CORNER = vw.corner;
  }catch(e){}
}
function rememberView(){
  try{ localStorage.setItem('myday_view', JSON.stringify({task:TASK_FILTER, area:AREA_FILTER, range:P_RANGE, corner:P_CORNER})); }catch(e){}
}
function rememberTab(){
  try{ localStorage.setItem('myday_tab', TAB); }catch(e){}
  // The address bar follows, so a bookmark or a share opens the same page.
  if(CFG) try{ history.replaceState(null, '', '#u=' + CFG.url + '&k=' + CFG.key + '&tab=' + TAB); }catch(e){}
}

/* ── api ────────────────────────────────────────────────────────────────── */
function hdrs(extra){
  var h = {apikey:CFG.key, Authorization:'Bearer '+CFG.key, 'Content-Type':'application/json'};
  for(var k in (extra||{})) h[k] = extra[k];
  return h;
}
async function api(path, opts){
  opts = opts || {};
  var r = await fetch(CFG.url + path, {
    method: opts.method || 'GET',
    headers: hdrs(opts.headers),
    cache: 'no-store',
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  if(!r.ok){
    var body = await r.text();
    /* A 409 on an event means its qid is already in the table, so the row DID
       reach the server and only the reply was lost. Treating that as a failure
       left the event unsent forever, and flushPend then stopped on it and
       nothing the user tapped ever sent again. */
    if(r.status === 409 || /duplicate key|23505/.test(body)){
      var dup = new Error('duplicate'); dup.duplicate = true; throw dup;
    }
    throw new Error(path + ' → ' + r.status + ' ' + body.slice(0,160));
  }
  var txt = await r.text();
  return txt ? JSON.parse(txt) : null;
}
async function getState(){
  var rows = await api('/rest/v1/state?id=eq.1&select=blob,updated_at');
  return rows && rows[0] ? rows[0] : null;
}
async function postEvent(kind, payload, qid, ts){
  return api('/rest/v1/events', {
    method:'POST', headers:{Prefer:'return=minimal'},
    body:[{kind:kind, payload:payload||{}, qid:qid, client_ts:ts||nowISO()}]
  });
}
async function postEntry(text, page, ts){
  return api('/rest/v1/entries', {
    method:'POST', headers:{Prefer:'return=minimal'},
    body:[{text:text, page:page||null, client_ts:ts||nowISO()}]
  });
}

/* ── time ───────────────────────────────────────────────────────────────── */
function pad(n){ return (n<10?'0':'') + n; }
function nowISO(){
  var d = new Date(), off = -d.getTimezoneOffset(),
      sg = off>=0?'+':'-', a = Math.abs(off);
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+
         pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())+
         sg+pad(Math.floor(a/60))+':'+pad(a%60);
}
function hhmm(d){ d = d||new Date(); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function localStamp(iso){
  /* Postgres hands timestamps back in UTC. Printing one raw told Amir his day
     had updated at 07:12 when his clock said 00:12. */
  if(iso == null || iso === '') return '';
  var d = new Date(iso);
  if(isNaN(d)) return String(iso).replace('T',' ').slice(0,16);
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+
         pad(d.getHours())+':'+pad(d.getMinutes());
}
function hm(m){
  if(m===null||m===undefined) return '·';
  m = Math.max(0, Math.round(m));
  return Math.floor(m/60)+'h'+pad(m%60)+'m';
}
function hmShort(m){
  /* One spelling everywhere: 8h20m. Only a round number of hours drops the
     minutes, so a target reads "10h" and a day reads "8h20m". */
  m = Math.max(0, Math.round(m || 0));
  if(m === 0) return '0h';
  return m % 60 === 0 ? (m/60)+'h' : hm(m);
}
/* Seconds actually worked in an open session: since its start, minus the
   pauses so far, minus the pause running now. */
function workedSecs(o){
  var total = secsSince(o.start, o.started_iso) - (o.paused_min || 0) * 60;
  if(o.paused_at) total -= secsSince(o.paused_at, o.paused_iso);
  return Math.max(0, total);
}
function secsSince(hhmmStr, sinceIso){
  if(sinceIso){ var t = Date.parse(sinceIso); if(!isNaN(t)) return Math.max(0, Math.floor((Date.now() - t) / 1000)); }
  return minsSince(hhmmStr, null) * 60 + new Date().getSeconds();
}
function hms(sec){
  var h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s2 = sec % 60;
  return (h ? h + 'h ' : '') + pad(m) + 'm <span class="secs">' + pad(s2) + 's</span>';
}
function minsSince(hhmmStr, sinceIso){
  if(!hhmmStr) return 0;

function weightedFocus(sessions){

  focus:'The focus corner is the shortest one. Make it quiet and work on one thing.',
  no_sessions:'No sessions yet today. Press Start a session when you begin, and the triangle starts filling.',
  running_only:'A session is running. Its score comes when you stop it, and the triangle fills from there.',
  focus_unknown:'Nothing is rated yet, so today has no score. Rate your sessions.',
  goals:'The goals corner is the shortest one. Make progress on this week’s goals, not just hours.',
  goals_unknown:'No goals are set for this week, so the third corner cannot be measured.',
  all_short:'All three corners are short today. The day needs hours before anything else.',
  low_coverage:'The focus score covers less than half the day. Rate the rest of your sessions.'
};
function adviceFor(weakest, today, week, corners, unknown){
  if(!(today.sessions || []).length && !(today.work_minutes || 0)) return ADVICE.no_sessions;
  if(today.open_session && !(today.sessions || []).some(function(s){ return !s.open && s.minutes; }))
    return ADVICE.running_only;
  if(unknown && unknown.length) return ADVICE[unknown[0] + '_unknown'];
  if(today.focus != null && today.focus_coverage > 0 && today.focus_coverage < 0.5)
    return ADVICE.low_coverage;

  // adjustment, when the honest message is that the whole day was thin.

<script>
/* ═══════════════════════════════════════════════ the triangle, drawn ═════ */
/* Three arms leave the centre 120 degrees apart, each as long as its corner's
   score, and the tips are joined. Consistency sits at the top, focus bottom
   right, goals bottom left, and those positions never change so the shape is
   readable at a glance without reading a single label.

   The fill is three wedges, each a gradient between the two corners it touches,
   so the colour itself says which corner is short. */
var CORNERS = [
  {k:'consistency', label:'Consistency', unit:'of 10h',  ang:-90, col:'var(--consistency)', hex:'#AD5B2B'},
  {k:'focus',       label:'Focus',       unit:'of a full 10', ang:30,  col:'var(--focus)',       hex:'#33695C'},
  {k:'goals',       label:'Goals',       unit:'of pace', ang:150, col:'var(--goals)',       hex:'#6B5CA5'}

function ptAt(ang, r, cx, cy){
  var a = ang * Math.PI / 180;
  return [ (cx + r*Math.cos(a)).toFixed(2), (cy + r*Math.sin(a)).toFixed(2) ];
}
function triSVG(tri, opts){
  opts = opts || {};
  var S = opts.size || 200, cx = S/2, cy = S/2 + (opts.dy||0), R = opts.r || (S*0.34);
  var labels = opts.labels !== false, id = 'g' + Math.random().toString(36).slice(2,8);

  var tiny = R < 22;
  var full = CORNERS.map(function(c){ return ptAt(c.ang, R, cx, cy).join(','); }).join(' ');
  var rings = (tiny ? [] : [0.25,0.5,0.75]).map(function(f){
    return '<polygon class="tri-ring" points="' +
      CORNERS.map(function(c){ return ptAt(c.ang, R*f, cx, cy).join(','); }).join(' ') + '"/>';
  }).join('');
  var axes = tiny ? '' : CORNERS.map(function(c){
    var p = ptAt(c.ang, R, cx, cy);

  }).join('');

  var pts = CORNERS.map(function(c){ return ptAt(c.ang, R * (tri[c.k]||0), cx, cy); });

    var a = CORNERS[i], b = CORNERS[(i+1)%3], pa = pts[i], pb = pts[(i+1)%3];
    var gid = id + 'w' + i;
    defs += '<linearGradient id="'+gid+'" gradientUnits="userSpaceOnUse" x1="'+pa[0]+'" y1="'+pa[1]+
            '" x2="'+pb[0]+'" y2="'+pb[1]+'">' +
            '<stop offset="0" stop-color="'+a.hex+'"/><stop offset="1" stop-color="'+b.hex+'"/></linearGradient>';
    // At thumbnail size the shape has to be the ink, not a hairline on a grid.

    wedges += '<line x1="'+pa[0]+'" y1="'+pa[1]+'" x2="'+pb[0]+'" y2="'+pb[1]+
              '" stroke="url(#'+gid+')" stroke-width="'+Math.max(1, R*0.028).toFixed(1)+
              '" stroke-linecap="round"/>';
  }
  var dotR = Math.max(1.4, Math.min(4.5, R * 0.062));
  var dots = R < 22 ? '' : pts.map(function(p, i){
    if(!(tri[CORNERS[i].k] > 0)) return '';

      '" fill="'+CORNERS[i].hex+'" stroke-width="'+(dotR*0.55).toFixed(1)+'"/>';
  }).join('');
  if(R >= 22 && CORNERS.some(function(c){ return !(tri[c.k] > 0); })){
    dots += '<circle class="tri-dot" cx="'+cx+'" cy="'+cy+'" r="'+(dotR*0.8).toFixed(1)+
      '" fill="#B8B2AC" stroke-width="'+(dotR*0.5).toFixed(1)+'"/>';
  }

  var text = '';
  if(labels){
    CORNERS.forEach(function(c, i){
      var p = ptAt(c.ang, R + (c.ang === -90 ? 30 : 24), cx, cy);
      var unknown = (tri.unknown || []).indexOf(c.k) > -1;
      var anchor = c.ang === -90 ? 'middle' : (c.ang === 30 ? 'start' : 'end');
      var dy = c.ang === -90 ? -6 : 4;
      text += '<text class="tri-label" x="'+p[0]+'" y="'+(+p[1]+dy)+'" text-anchor="'+anchor+
              '" fill="'+c.hex+'">'+c.label+'</text>' +
              '<text class="tri-val" x="'+p[0]+'" y="'+(+p[1]+dy+17)+'" text-anchor="'+anchor+
              '" fill="'+(unknown ? 'var(--ink-3)' : 'var(--ink)')+'">'+(unknown ? '—' : pct(tri[c.k])+'%')+'</text>' +
              // What the percentage is measured against, which the Goals corner
              // in particular needs: it is progress against pace, while the tile
              // beside it shows raw progress.
              '<text class="tri-unit" x="'+p[0]+'" y="'+(+p[1]+dy+29)+'" text-anchor="'+anchor+
              '" fill="var(--ink-3)">'+(unknown ? (c.k === 'goals' ? 'none set' : 'not rated') : c.unit)+'</text>';
    });

  return '<svg class="tri-svg" viewBox="'+vbX+' '+vbY.toFixed(1)+' '+vbW+' '+vbH.toFixed(1)+'" role="img" aria-label="'+
    (tri.scored === false ? 'Triangle, not scored.' : 'Triangle. Consistency '+pct(tri.consistency)+' percent, focus '+
    ((tri.unknown||[]).indexOf('focus') > -1 ? 'not rated' : pct(tri.focus)+' percent')+
    ', goals '+((tri.unknown||[]).indexOf('goals') > -1 ? 'no goals set' : pct(tri.goals)+' percent')+'.')+'">' +
    '<defs>'+defs+'</defs>' + rings +
    (tiny ? '<polygon points="'+full+'" fill="none" stroke="var(--line-soft)" stroke-width="1"/>'
          : '<polygon class="tri-guide" points="'+full+'"/>') + axes +
    '<g class="tri-shape-g" style="transform-origin:'+cx+'px '+cy+'px">' + wedges + dots + '</g>' +
    text + '</svg>';
}


/* ═════════════════════════════════════════════════════════ helpers ═══════ */

/* ═════════════════════════════════════════════════════════ home page ═════ */
function pageHome(v){

       ((tri.notes||[]).filter(function(x){ return !(/no goals/i.test(x) && !(v.week && v.week.total)); }).length

  h += '<div class="side">';

  h += '<div class="grid3">' + CORNERS.map(function(c){
    var val, sub;

    } else if(c.k === 'focus'){

function stripHTML(v){

  // sits under the last one.
  var first = new Date(days[0].date + 'T12:00:00'), pad0 = isNaN(first) ? 0 : (first.getDay() + 6) % 7, cells = '';
  for(var i = 0; i < pad0; i++) cells += '<span class="d pad"></span>';
  cells += days.map(function(d){
    var t = {consistency:d.consistency, focus:d.focus, goals:d.goals, unknown:d.unknown, scored:d.scored};
    var label = d.scored === false ? 'not scored' : pct(d.area) + '%';

  return '<div class="strip-head">' + ['M','T','W','T','F','S','S'].map(function(x){ return '<span>'+x+'</span>'; }).join('') +
    '</div><div class="strip" id="strip">' + cells + '</div>';

/* ═════════════════════════════════════ the session editor ═══════════════ */
/* Correcting a session, adding one done away from the phone, and deleting one.
   The old console had all three and the rebuild dropped them, which left a
   forgotten stop or a mis-tapped area with no way back except a voice note. */
var EDIT = null;

function minusMinutes(hhmm, n){
  var p = hhmm.split(':'), m = (+p[0]) * 60 + (+p[1]) - n;
  if(m < 0) m += 24 * 60;
  return pad(Math.floor(m / 60)) + ':' + pad(m % 60);
}
function toMin(hhmm){ var p = (hhmm||'0:0').split(':'); return (+p[0]) * 60 + (+p[1]); }

function sessProblem(st, en, running){
  if(!st) return 'It needs a start time.';
  if(running){
    // A start in the future is a mis-spun wheel, not a 23-hour session.
    var now = new Date().getHours() * 60 + new Date().getMinutes();
    if(toMin(st) > now && (now + 1440 - toMin(st)) > 12 * 60) return 'That start is in the future.';
    if(minsSince(st) > 14 * 60) return 'That started more than fourteen hours ago.';
    return '';
  }
  if(!en) return 'It needs an end time.';
  if(minsBetween(st, en) === 0) return 'That is zero minutes.';
  // A real session can cross midnight, so the test is length, not order.
  // 09:00 to 08:00 is 23 hours, and 23 hours would wreck the day's totals.
  if(toMin(en) < toMin(st) && minsBetween(st, en) > 12 * 60) return 'It ends before it starts.';
  if(minsBetween(st, en) > 14 * 60) return 'That is longer than fourteen hours.';
  return '';
}

function openSessEditor(sess){
  EDIT = sess
    ? {was:{start:sess.start, end:sess.open ? null : sess.end, area:sess.area},
       start:sess.start, end:sess.end || hhmm(), area:sess.area, running:!!sess.open, isNew:false}
    : {was:null, start:minusMinutes(hhmm(), 60), end:hhmm(), area:'ai', running:false, isNew:true};
  paintSessEditor();
}

function overlapWith(st, en, was){
  /* Named, not refused: a genuine overlap is rare and Amir may mean it, but a
     silent double count of the shared hour is how the day's total lies. */
  var nowM = new Date().getHours() * 60 + new Date().getMinutes();
  var a1 = toMin(st), a2 = en ? toMin(en) : nowM; if(a2 < a1) a2 += 1440;
  var hit = null;
  ((VIEW && VIEW.today.sessions) || []).forEach(function(s){
    if(hit) return;
    if(was && s.start === was.start && s.area === was.area) return;
    var b1 = toMin(s.start), b2 = s.end ? toMin(s.end) : nowM; if(b2 < b1) b2 += 1440;
    if(a1 < b2 && b1 < a2) hit = s;
  });
  return hit;
}
function sessLengthHTML(e){
  var bad = sessProblem(e.start, e.running ? null : e.end, e.running);
  var mins = e.running ? minsSince(e.start) : minsBetween(e.start, e.end);
  var ov = bad ? null : overlapWith(e.start, e.running ? null : e.end, e.was);
  return {bad: bad, html:
    '<span class="muted">' + (bad ? 'Problem' : 'Length') + '</span>' +
    '<span style="text-align:right;font-weight:600;color:' + (bad ? 'var(--bad)' : (ov ? 'var(--notice)' : 'var(--ink-2)')) + '">' +
      esc(bad || (hm(mins) +
        (!e.running && toMin(e.end) < toMin(e.start) ? ' · crosses midnight' : '') +
        (ov ? ' · overlaps the ' + ov.start + ' ' + (ov.area_label || ov.area) + ' session' : ''))) + '</span>'};
}
/* A time wheel on iOS fires `change` every time it settles, which is the moment
   the finger lifts. Rebuilding the sheet then destroyed the input under the
   wheel and the picker snapped shut, so every adjustment took two taps. The
   length line and the Save button are updated in place instead. */
function sessEditorBits(){
  if(!EDIT) return;
  var r = sessLengthHTML(EDIT);
  var L = document.getElementById('sLen'); if(L) L.innerHTML = r.html;
  var S = document.getElementById('sessSave'); if(S) S.disabled = !!r.bad;
}
function paintSessEditor(){
  var e = EDIT, bad = sessProblem(e.start, e.running ? null : e.end, e.running);
  var open = !!(SHEET && SHEET.classList.contains('on'));
  var mins = e.running ? minsSince(e.start) : minsBetween(e.start, e.end);
  var ov = bad ? null : overlapWith(e.start, e.running ? null : e.end, e.was);
  openSheet(
    '<h3>' + (e.isNew ? 'Add a session' : 'Edit this session') + '</h3>' +
    '<p class="small muted">' + (e.isNew
      ? 'Work you did away from the phone. Claude files it like any other session.'
      : 'Correcting this sends the change to Claude, who fixes the day file.') + '</p>' +
    '<div class="seg" style="margin-top:16px">' +
      '<button data-sstate="running"' + (e.running ? ' class="on"' : '') + '>Still running</button>' +
      '<button data-sstate="done"' + (e.running ? '' : ' class="on"') + '>Finished</button>' +
    '</div>' +
    '<div class="row" style="gap:12px;margin-top:14px">' +
      '<label class="grow"><span class="tiny muted">Start</span>' +
        '<input type="time" id="sStart" value="' + esc(e.start) + '"></label>' +
      '<label class="grow" style="' + (e.running ? 'visibility:hidden' : '') + '">' +
        '<span class="tiny muted">End</span>' +
        '<input type="time" id="sEnd" value="' + esc(e.end || hhmm()) + '"></label>' +
    '</div>' +
    '<div class="spread tiny" style="margin-top:8px" id="sLen">' + sessLengthHTML(e).html + '</div>' +
    '<div class="tiny muted" style="margin:16px 0 8px">Area</div>' +
    '<div class="grid2">' + AREAS.map(function(a){
      return '<button class="btn' + (a[0] === e.area ? ' primary' : '') + '" data-sarea="' + a[0] +
        '" style="justify-content:flex-start"><span style="width:9px;height:9px;border-radius:50%;' +
        'background:' + areaColour(a[0]) + '"></span>' + esc(a[1]) + '</button>';
    }).join('') + '</div>' +
    '<div class="row" style="gap:10px;margin-top:18px">' +
      (e.isNew ? '' : '<button class="btn" id="sessDelete" style="color:var(--bad)">Delete</button>') +
      '<button class="btn primary grow" id="sessSave"' + (bad ? ' disabled' : '') + ' style="flex:1' + (e.isNew ? ';width:100%' : '') + '">' +
        (e.isNew ? 'Add it' : 'Save') + '</button>' +
    '</div>');
  if(open && SHEET) SHEET.classList.add('on');   // no slide-in on a repaint
  setTimeout(function(){
    ['sStart','sEnd'].forEach(function(id){
      var n = document.getElementById(id);
      if(n) ['input', 'change'].forEach(function(evn){ n.addEventListener(evn, function(){
        if(!n.value) return;
        EDIT[id === 'sStart' ? 'start' : 'end'] = n.value;
        sessEditorBits();
      }); });
    });
  }, 30);
}

function shortfallLine(t){
  // The app knows the gap, so it names it instead of saying "get more hours in".
  var w = t.work_minutes != null ? t.work_minutes : (t.closed_minutes || 0);
  if(w >= 600) return 'You have passed the 10h floor. 12h is a good day.';
  if(!w) return 'Nothing logged yet. The 10h floor starts when you do.';
  return 'You are ' + hmShort(600 - w) + ' short of the 10h floor.';
}
function runnerHTML(v){
  var t = v.today, o = t.open_session;
  if(o){
    var paused = !!o.paused_at, pm = o.paused_min || 0;
    var worked = workedSecs(o), todayMin = (t.work_minutes || 0) + Math.floor(worked / 60);
    // Two columns: the session on the left, the day on the right. The right
    // half used to be empty, and the day's total is the one number that gives
    // the running session its meaning.
    return '<div class="runner live' + (paused ? ' paused' : '') + '">' +
      '<div class="run-grid"><div class="run-main">' +
      '<div class="row" style="gap:7px"><span class="livedot"></span>' +
      '<span class="tiny runlab">' + (paused ? 'Paused <span id="pauseclock">' + hms(secsSince(o.paused_at, o.paused_iso)) + '</span>' : 'Working') + '</span></div>' +
      '<div class="area-big">'+esc(o.area_label||o.area)+'</div>' +
      '<div class="clock" id="liveclock" data-start="'+esc(o.start)+'" data-since="'+esc(o.started_iso||'')+'" ' +
      'data-paused="'+pm+'" data-pausedat="'+esc(o.paused_at||'')+'" data-pausediso="'+esc(o.paused_iso||'')+'">'+hms(worked)+'</div>' +
      '<div class="small muted">started '+esc(o.start)+(pm ? ' · paused ' + hmShort(pm) + ' so far' : '')+'</div>' +
      '</div><div class="run-side">' +
      '<div class="tiny muted eyebrow">Today</div>' +
      '<div class="serif today-live" id="todaylive">'+hmShort(todayMin)+'</div>' +
      '<div class="tiny muted">of 10h</div>' +
      '<div class="bar"><i id="todaybar" style="background:var(--consistency)" data-w="'+Math.min(100, Math.round(todayMin/600*100))+'"></i></div>' +
      '</div></div>' +
      '<div class="row run-btns">' +
      (paused ? '<button class="btn" id="resumeBtn">Resume</button>' : '<button class="btn" id="pauseBtn">Pause</button>') +
      '<button class="btn primary grow" id="stopBtn">Stop and rate</button></div></div>';
  }
  return '<div class="runner">' +
    '<div class="tiny muted" style="font-weight:700;letter-spacing:.08em;text-transform:uppercase">Not working</div>' +
    (t.work_minutes ? '<div class="clock">'+hmShort(t.work_minutes)+'</div>' : '') +
    '<div class="small muted">' + shortfallLine(t) + '</div>' +
    '<button class="btn primary wide" id="startBtn" style="margin-top:14px">Start a session</button></div>';
}
</script>
<script>
/* ═══════════════════════════════════════════ consistency (the hours) ═════ */
function pageTime(v){
  var t = v.today, sp = (v.targets && v.targets.split) || {academia:240, ai:360}, b = t.buckets || {academia:0, ai:0, dog:0};
  var h = '';

  var sessCard = '<div class="card flush sess-card"><h2 style="padding:18px 16px 0;margin-bottom:8px">Sessions</h2>' +
       (t.sessions.length ? t.sessions.map(function(x){ return sessionRow(x, null, true); }).join('')
        : emptyBox('⏱', 'No sessions yet today',
            'Press Start a session when you begin.')) +
       '<button class="btn wide" id="addSess" style="margin:14px 16px 16px;width:calc(100% - 32px)">' +
       '＋ Add a session I forgot</button></div>';
  h += '<div class="split"><div class="side"><div class="card"><h2 class="hd">Today ' + infoBtn('hours') + '</h2>' +
    '<div class="spread today-hero" style="align-items:flex-end;margin-bottom:16px">' +
      '<div><div class="serif" style="font-size:46px;line-height:1">'+hmShort(t.work_minutes)+'</div>' +
      '<div class="small muted">of the 10h floor</div></div>' +
      '<div style="text-align:right"><div class="serif" style="font-size:26px;color:var(--consistency)">'+
        pct(Math.min(1,(t.work_minutes||0)/600))+'%</div>' +
      '<div class="tiny muted" style="white-space:nowrap">done</div></div>' +
    '</div>' +
    '<div class="bar" style="height:8px"><i style="background:var(--consistency)" data-w="'+
      Math.min(100, Math.round((t.work_minutes||0)/600*100))+'"></i></div>' +
    '<p class="tiny muted" style="margin:18px 0 10px">Today’s split, as you set it.</p>' +
    '<div class="stack">' +
      splitBar('Academia', b.academia, sp.academia, AREA_COLOUR.ucw) +
      splitBar('AI Business', b.ai, sp.ai, AREA_COLOUR.ai) +
      splitBar('Dog Business (paused)', b.dog, 0, AREA_COLOUR.dog) +
      (t.overhead_minutes ? '<div class="spread small"><span class="muted">Overhead</span>' +
        '<span class="dim">'+hmShort(t.overhead_minutes)+' · work, not in the split</span></div>' : '') +
    '</div></div>';

  h += runnerHTML(v) + '</div><div class="side">' + sessCard + '</div>';

  var tm = v.tomorrow || {plan:[]}, hasTm = (tm.plan || []).length > 0, showTm = hasTm && SHOW_TOMORROW;
  h += '<div class="card plan-card"><div class="spread" style="margin-bottom:14px;gap:12px">' +
       '<h2 class="hd" style="margin:0;flex:1">' + (showTm ? 'Tomorrow' : (hasTm ? 'Today' : 'Planned and done')) + (showTm ? '' : ' ' + infoBtn('plan')) + '</h2>' +
       (hasTm ? '<div class="seg dayseg">' +
          '<button data-act="daytoday"' + (showTm ? '' : ' class="on"') + '>Today</button>' +
          '<button data-act="daytomorrow"' + (showTm ? ' class="on"' : '') + '>Tomorrow</button></div>' : '') +
       '</div>' +
       (showTm
         ? '<p class="small" style="margin:-6px 0 8px;font-weight:600">' + esc(longDay(tm.date)) + ' · ' + hmShort(planWork(tm.plan)) +
           ' planned' + (planWork(tm.plan) < 600 ? ' <span class="muted" style="font-weight:400">· ' +
           hmShort(600 - planWork(tm.plan)) + ' under the 10h floor</span>' : planWork(tm.plan) === 600 ? ' <span class="muted" style="font-weight:400">· at the 10h floor</span>' : ' <span class="muted" style="font-weight:400">· past the 10h floor</span>') +
           ' ' + infoBtn('plan') + '</p>' +
           timelineHTML({plan: tm.plan, sessions: []}, true)
         : timelineHTML(t)) + '</div>';
  h += '</div>';   // closes .split: the calendar spans both columns on a laptop

  return h;
}
function splitBar(label, got, target, colour){
  var p = target ? Math.min(100, Math.round(got/target*100)) : 0;
  return '<div><div class="spread small" style="margin-bottom:5px"><span class="muted">'+esc(label)+'</span>' +
    '<span style="font-weight:600">'+hmShort(got)+(target?' <span class="muted" style="font-weight:400">of '+
      hmShort(target)+'</span>':'')+(target && got < target ? ' <span class="muted" style="font-weight:400">· '+
      hmShort(target-got)+' short</span>' : '')+'</span></div>' +
    (target ? '<div class="bar"><i style="background:'+colour+'" data-w="'+p+'"></i></div>' : '') + '</div>';
}
function rateRow(u){
  return '<div class="spread" style="background:var(--surface);border:1px solid var(--line);' +
    'border-radius:var(--r-sm);padding:11px 12px">' +
    '<div><div style="font-weight:600">'+esc(u.start)+' – '+esc(u.end)+'</div>' +
    '<div class="tiny muted">'+esc(u.area_label||u.area)+' · '+hm(u.minutes)+'</div></div>' +
    '<button class="btn" data-rate="'+esc(u.start)+'" style="padding:9px 16px">Rate it</button></div>';
}
function sessionRow(s, day, edit){
  var f = s.focus;
  var dayAttr = day ? 'data-rateday="'+esc(day)+'" ' : '';
  var badge = s.open
    ? '<span class="fscore live">now</span>'
    : (f == null
        ? '<button class="fscore none" data-rate="'+esc(s.start)+'" ' + dayAttr +
          'aria-label="Give this session a score">not<br>rated</button>'
        : '<button class="fscore" data-rate="'+esc(s.start)+'" ' +
          'style="background:'+focusBg(f)+';color:'+focusColour(f)+'"' +
          ' aria-label="Focus '+esc(f)+' of 10">'+esc(f)+'</button>');
  return '<div class="item">' + badge +
    '<div class="grow"><div class="t" dir="auto">'+esc(s.task || s.area_label || s.area)+'</div>' +
    '<div class="s">'+esc(s.start)+' – '+esc(s.malformed ? '?' : (s.end||'now'))+
      // The area is only repeated when the task line is something else.
      (s.task && s.task !== (s.area_label||s.area) ? ' · '+esc(s.area_label||s.area) : '') +
      (s.pending?' · saving':'')+'</div></div>' +
    '<div class="dur">'+(s.open ? 'running' : (s.malformed ? 'unclear' : hm(s.minutes)))+'</div>' +
    (edit ? '<button class="editbtn" data-editsess="'+esc(s.start)+'" ' +
            'aria-label="Edit this session">✎</button>' : '') + '</div>';
}
var SHOW_TOMORROW = false;
function planWork(plan){
  // Overlapping blocks are merged first, so a plan spoken twice over the same
  // hour does not promise it twice.
  var iv = [];
  (plan || []).forEach(function(b){
    if(!b || b.status === 'fixed') return;
    var a = toMin(b.start), z = toMin(b.end);
    if(isNaN(a) || isNaN(z)) return;
    if(z <= a) z += 1440;
    iv.push([a, z]);
  });
  iv.sort(function(x, y){ return x[0] - y[0]; });
  var m = 0, cur = null;
  iv.forEach(function(x){
    if(!cur || x[0] > cur[1]){ if(cur) m += cur[1] - cur[0]; cur = [x[0], x[1]]; }
    else if(x[1] > cur[1]) cur[1] = x[1];
  });
  if(cur) m += cur[1] - cur[0];
  return m;
}
function longDay(iso){
  return new Date(iso + 'T12:00:00').toLocaleDateString('en-GB', {weekday:'long'}) + ' ' + prettyDate(iso);
}
function timelineHTML(t, planOnly){
  var blocks = [];
  (t.plan||[]).forEach(function(p){ blocks.push({k:'planned', s:p.start, e:p.end,
    label:p.activity.replace(/\*\*/g,''), status:p.status}); });
  (t.sessions||[]).forEach(function(s){ if(s.malformed) return; blocks.push({k:'actual', s:s.start,
    e:s.end || hhmm(), label:(s.area_label||s.area), area:s.area, open:s.open}); });
  if(!blocks.length){
    return emptyBox('🗓', 'Nothing planned yet',
      'Hold the talk button and say something like “nine to eleven, research paper”.');
  }
  if(planOnly){
    // Tomorrow has no actual lane. One lane, the plan across it.
    var toM0 = function(x){ var q = x.split(':'), m0 = (+q[0])*60 + (+q[1]); return m0 < 300 ? m0 + 1440 : m0; };
    blocks.forEach(function(b){ b.m0 = toM0(b.s); b.m1 = toM0(b.e); if(b.m1 < b.m0) b.m1 += 1440; });
    var lo0 = Math.floor(Math.min.apply(null, blocks.map(function(b){ return b.m0; }))/60)*60;
    var hi0 = Math.ceil(Math.max.apply(null, blocks.map(function(b){ return Math.max(b.m1, b.m0+15); }))/60)*60;
    var PX0 = 0.85, H0 = (hi0 - lo0) * PX0, out = '';
    for(var m2 = lo0; m2 <= hi0; m2 += 60){
      var y0 = (m2 - lo0) * PX0;
      out += '<div class="hr" style="top:'+y0+'px"></div><div class="hrlab" style="top:'+y0+'px">'+pad(Math.floor(m2/60)%24)+':00</div>';
    }
    blocks.sort(function(a, b){ return a.m0 - b.m0; });
    out += blocks.map(function(b, i){
      var y1 = (b.m0 - lo0) * PX0, hg = Math.max(30, (b.m1 - b.m0) * PX0 - 3);
      if(i + 1 < blocks.length) hg = Math.min(hg, Math.max(6, (blocks[i + 1].m0 - lo0) * PX0 - y1 - 2));
      if(hg < 22) return '<div class="blk planned bar" title="'+esc(b.s+'–'+b.e+' '+b.label)+'" style="top:'+y1+'px;height:'+hg+'px;left:46px;right:2px"></div>';
      var fixed = b.status === 'fixed';
      return '<div class="blk planned'+(hg < 46 ? ' tight' : '')+'" style="top:'+y1+'px;height:'+hg+'px;left:46px;right:2px;' +
        'background:'+(fixed ? 'var(--surface-2)' : 'color-mix(in srgb,var(--goals) 12%,#fff)')+';' +
        'border-color:'+(fixed ? 'var(--line)' : 'color-mix(in srgb,var(--goals) 35%,transparent)')+';color:var(--ink)">' +
        '<div class="bt" style="color:'+(fixed ? 'var(--ink-3)' : 'var(--goals)')+';flex:0 0 auto">'+esc(b.s)+'–'+esc(b.e)+'</div>' +
        '<div dir="auto" class="bl">'+esc(hg < 46 ? String(b.label).split(/ — | · /)[0] : b.label)+'</div></div>';
    }).join('');
    return '<div class="tl-solo"><div class="timeline solo" style="height:'+H0+'px">'+out+'</div></div>';
  }
  /* Minutes since 05:00, the start of Amir's working day, so a block that runs
     from 22:00 to 01:15 is 195 minutes long rather than a negative number
     clamped to a 20px stub. */
  var toM = function(x){
    var p = x.split(':'), m = (+p[0])*60 + (+p[1]);
    return m < 300 ? m + 1440 : m;
  };
  blocks.forEach(function(b){
    b.m0 = toM(b.s); b.m1 = toM(b.e);
    if(b.m1 < b.m0) b.m1 += 1440;
  });
  var lo = Math.min.apply(null, blocks.map(function(b){ return b.m0; }));
  var hi = Math.max.apply(null, blocks.map(function(b){ return Math.max(b.m1, b.m0+15); }));
  lo = Math.floor(lo/60)*60; hi = Math.ceil(hi/60)*60;
  var PX = 0.85, H = (hi - lo) * PX;

  var lines = '';
  for(var m = lo; m <= hi; m += 60){
    var y = (m - lo) * PX;
    lines += '<div class="hr" style="top:'+y+'px"></div>' +
             '<div class="hrlab" style="top:'+y+'px">'+pad(Math.floor(m/60)%24)+':00</div>';
  }
  blocks.sort(function(a, b){ return a.m0 - b.m0 || (a.k < b.k ? -1 : 1); });
  var anyBar = false, lastBar = {};
  var bh = blocks.map(function(b, i){
    var natural = (b.m1 - b.m0) * PX - 3;
    var y = (b.m0 - lo) * PX, hgt = Math.max(20, natural);
    // A short block is given room to be read, but never over the next block
    // in the same column.
    var nxt = null; for(var j = i + 1; j < blocks.length; j++){ if(blocks[j].k === b.k){ nxt = blocks[j]; break; } }
    var maxH = nxt ? Math.max(6, (nxt.m0 - lo) * PX - y - 2) : 1e9;
    // Two different things, drawn two different ways: what was promised is an
    // outline in the goals colour, what happened is a solid block in its area's
    // colour. Nobody should have to read a header to tell them apart.
    var col = b.k === 'actual' ? areaColour(b.area) : 'var(--goals)';
    var bg  = b.k === 'actual' ? 'var(--consistency-soft)' : 'color-mix(in srgb,var(--goals) 5%,#fff)';
    // Under about 34px there is room for one line only, so the time and the
    // label share it instead of the label spilling past the block's edge.
    // A 15-minute block is 13px tall, which cuts a line of text in half. One
    // line needs about 30px and two need about 46px.
    hgt = Math.min(Math.max(hgt, 30), maxH);
    var tight = hgt < 46, bar = hgt < 22;
    // The last of six ten-minute blocks has nothing under it, so it would be
    // stretched to a labelled block while its five siblings are bars.
    if(!bar && lastBar[b.k] && natural < 13){ bar = true; hgt = Math.max(6, natural); }
    lastBar[b.k] = bar;
    var lab = tight ? String(b.label).split(/ — | · /)[0].replace(/^[\u{1F300}-\u{1FAFF}\u2600-\u27BF]\uFE0F?\s*/u, '') : b.label;
    var mins = b.m1 - b.m0;
    if(bar) anyBar = true;
    if(bar) return '<div class="blk '+b.k+' bar" title="'+esc(b.s+'–'+b.e+' '+b.label)+'" style="top:'+y+'px;height:'+hgt+
      'px;background:'+bg+';border-color:color-mix(in srgb,'+col+' 30%,transparent);border-left-color:'+col+'"></div>';
    return '<div class="blk '+b.k+(tight ? ' tight' : '')+'" title="'+esc(b.s+'–'+b.e+' '+b.label)+'" style="top:'+y+'px;height:'+hgt+
      'px;background:'+bg+';border-color:color-mix(in srgb,'+col+' 30%,transparent);border-left-color:'+col+';' +
      'color:var(--ink)">' +
      '<div class="bt" style="color:color-mix(in srgb,'+col+' 62%,#000);flex:0 0 auto">'+esc(b.s)+
        (b.open ? ' · now' : (tight ? '' : '<span class="wide-only">–'+esc(b.e)+' · '+hm(mins)+'</span>'))+'</div>' +
      '<div dir="auto" class="bl">' + esc(lab)+'</div></div>';
  }).join('');

  // Two columns of the same width, each header centred over its own column.
  var planList = blocks.filter(function(b){ return b.k === 'planned'; }).map(function(b){
    return '<div class="spread small" style="padding:7px 0;border-bottom:1px solid var(--line-soft)">' +
      '<span dir="auto" style="min-width:0">' + esc(b.label)+'</span>' +
      '<span class="muted tiny" style="flex:0 0 auto;margin-left:10px">'+esc(b.s)+'–'+esc(b.e)+'</span></div>';
  }).join('');

  var plannedMin = planWork(t.plan);
  var doneMin = t.work_minutes || 0;
  return '<div class="tl-two">' +
    '<div class="tl-heads"><div class="tl-head plan"><span class="sw plan"></span>Planned' +
      '<span class="tl-sum">'+hmShort(plannedMin)+'</span></div>' +
    '<div class="tl-head actual"><span class="sw actual"></span>Done' +
      '<span class="tl-sum">'+hmShort(doneMin)+'</span></div></div>' +
    '<div class="timeline" style="height:'+H+'px">'+lines+bh+'</div>' +
    (planList ? '<details class="tl-list"'+(anyBar ? ' open' : '')+'><summary class="tiny muted">The plan, as a list</summary>'+planList+'</details>' : '') +
    '</div>';
}

/* ═══════════════════════════════════════════════════ focus (the scores) ══ */
function pageFocus(v){
  var t = v.today, h = '';

  var ratedN = t.sessions.filter(function(s){ return !s.open && s.minutes && s.focus != null && s.area !== 'personal'; }).length;
  var workN = t.sessions.filter(function(s){ return !s.open && s.minutes && s.area !== 'personal'; }).length;
  h += '<div class="card"><div class="spread" style="align-items:flex-start">' +
    '<div><h2 style="margin-bottom:8px">Today’s focus</h2>' +
    '<div class="serif" style="font-size:52px;line-height:1;color:' +
      (t.focus == null ? 'var(--ink-3)' : 'var(--focus)') + '">' +
      (t.focus == null ? 'not rated' : t.focus.toFixed(1)) +
      (t.focus == null ? '' : '<span style="font-size:22px;color:var(--ink-3)"> of 10</span>') +
      '</div>' +
    '<div class="small muted" style="margin-top:6px">Weighted by session length · ' +
      (workN ? ratedN + ' of ' + workN + ' session' + (workN === 1 ? '' : 's') + ' rated' : 'no sessions yet') +
      '</div></div>' + infoBtn('focus') + '</div></div>';

  if(t.unscored.length){
    h += '<div class="card" style="border-color:var(--notice-line);' +
      'background:var(--notice-bg)"><h2 style="color:var(--notice)">' +
      (t.unscored.length === 1 ? 'One session is not rated'
        : numWord(t.unscored.length) + ' sessions are not rated') + '</h2>' +
      '<div class="stack">' + t.unscored.map(function(s){
        return rateRow(s);
      }).join('') + '</div></div>';
  }

  var sessCard = '<div class="card flush sess-card"><h2 style="padding:18px 16px 0;margin-bottom:8px">Today’s sessions</h2>' +
       (t.sessions.length ? t.sessions.map(sessionRow).join('')
        : emptyBox('🎯','Nothing to rate yet',
            'The app asks for a score the moment you stop a session.')) +
       '</div>';

  var hist = v.focus_history || [];
  var shown = SHOW_ALL_HIST ? hist : hist.slice(0, 7);   // a week; the rest behind Show all
  var weekCard = '';
  var dayCard = '<div class="card"><h2>Focus, day by day</h2>' +
    (hist.length ? sparkHTML(hist, t.date) : '') +
    '<div class="stack" style="margin-top:16px">' + (hist.length ? shown.map(function(d){
      return '<button class="spread" data-hist="'+esc(d.date)+'" style="width:100%;text-align:left;' +
        'padding:11px 0;border-bottom:1px solid var(--line-soft)">' +
        '<span><span style="font-weight:600">'+esc(d.weekday)+'</span> ' +
        '<span class="tiny muted">'+esc(prettyDate(d.date))+'</span></span>' +
        '<span class="row" style="gap:12px"><span class="small muted">'+hmShort(d.worked_minutes)+'</span>' +
        (d.focus == null
          ? '<span class="fscore none" style="width:auto;padding:0 9px;height:30px">not rated</span>'
          : '<span class="fscore" style="background:'+focusBg(d.focus)+';color:'+focusColour(d.focus)+
            ';width:34px;height:30px;font-size:15px">'+d.focus.toFixed(1)+'</span>') +
        '</span></button>';
    }).join('') : emptyBox('📈','No history yet','This fills in as you rate your sessions.')) + '</div>' +
    (hist.length > shown.length ? '<button class="btn wide" data-act="allhist" style="margin-top:12px">' +
      'Show all '+hist.length+' days</button>' : '') + '</div>';

  // Week by week, the third view the system asks for.
  var wk = (v.weeks || []).slice().reverse();
  if(wk.length){
    weekCard = '<div class="card week-side"><h2>Focus, week by week</h2><div class="stack" style="gap:0">' +
      wk.map(function(x){
        var f = x.focus > 0 ? (x.focus * 10).toFixed(1) + ' of 10' : 'not rated';
        return '<div class="spread" style="padding:10px 0;border-bottom:1px solid var(--line-soft)">' +
          '<span><span style="font-weight:600">Week of '+esc(prettyDate(x.start))+'</span>' +
          (x.current ? ' <span class="tiny muted">this week</span>' : '') + '</span>' +
          '<span style="font-weight:600;color:'+(x.focus > 0 ? 'var(--ink)' : 'var(--ink-3)')+'">'+f+'</span></div>';
      }).join('') + '</div></div>';
  }
  // Phone: sessions, then the day list, then the weeks. Laptop: the day list on
  // the left, sessions and weeks stacked on the right.
  h += '<div class="cols2">' + dayCard + '<div class="side focus-side">' + sessCard + weekCard + '</div></div>';
  return h;
}
var SHOW_ALL_HIST = false;
function sparkHTML(hist, today){
  /* Fourteen slots, always, including the days with nothing in them. The line
     is drawn in segments so a gap really does mean "not rated", which is what
     the caption promises.

     All the text lives in HTML, not in the SVG. Text inside a viewBox scales
     with the drawing, so the same 9px label rendered at 7px on a phone and at
     20px in a wide desktop card. The plot uses preserveAspectRatio="none" and a
     non-scaling stroke so it fills its card at any width without distorting the
     line. */
  var byDate = {};
  hist.forEach(function(d){ byDate[d.date] = d; });
  // Always ends today, so an empty day is a visible gap rather than a chart
  // that quietly stops at the last day with data.
  var last = new Date((today || (hist.length ? hist[0].date : '')) + 'T00:00:00');
  if(isNaN(last)) last = new Date();
  var days = [];
  for(var i = 13; i >= 0; i--){
    var dt = new Date(last.getTime() - i * 86400000);
    var key = dt.getFullYear()+'-'+pad(dt.getMonth()+1)+'-'+pad(dt.getDate());
    days.push(byDate[key] || {date:key, focus:null, worked_minutes:0});
  }

  var W = 1000, H = 300, step = W / days.length;
  var y = function(score){ return H - (score / 10) * H; };

  var grid = [0, 5, 10].map(function(v){
    return '<line x1="0" x2="'+W+'" y1="'+y(v).toFixed(1)+'" y2="'+y(v).toFixed(1)+
      '" stroke="var(--line-soft)" stroke-width="1" vector-effect="non-scaling-stroke"/>';
  }).join('');

  var bars = '', runs = [], run = [];
  days.forEach(function(d, i){
    var cx = step * (i + 0.5);
    var mins = d.worked_minutes || 0;
    if(mins > 0){
      // A day with no hours draws nothing. A two-pixel sliver read as a
      // rendering fault rather than as a zero.
      var bh = Math.max(6, (Math.min(mins, 720) / 720) * H);
      bars += '<rect x="'+(cx - step * 0.3).toFixed(1)+'" y="'+(H - bh).toFixed(1)+
        '" width="'+(step * 0.6).toFixed(1)+'" height="'+bh.toFixed(1)+'" fill="var(--line)"/>';
    }
    if(d.focus != null) run.push(cx.toFixed(1) + ',' + y(d.focus).toFixed(1));
    else { if(run.length) runs.push(run); run = []; }
  });
  if(run.length) runs.push(run);

  var line = runs.map(function(r){
    if(r.length === 1){
      // A lone rated day between two unrated ones still has to be visible.
      var xy = r[0].split(',');
      return '<line x1="'+(+xy[0] - step*0.22).toFixed(1)+'" x2="'+(+xy[0] + step*0.22).toFixed(1)+
        '" y1="'+xy[1]+'" y2="'+xy[1]+'" stroke="var(--focus)" stroke-width="3" ' +
        'stroke-linecap="round" vector-effect="non-scaling-stroke"/>';
    }
    return '<polyline points="'+r.join(' ')+'" fill="none" stroke="var(--focus)" ' +
      'stroke-width="2" stroke-linejoin="round" stroke-linecap="round" ' +
      'vector-effect="non-scaling-stroke"/>';
  }).join('');

  return '<p class="tiny muted" style="margin-bottom:8px">Line: focus, 0 to 10 · Bars: hours worked, a full bar is 12h</p>' +
    '<div class="spark">' +
      '<div class="spark-y"><span>10</span><span>5</span><span>0</span></div>' +
      '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" ' +
      'aria-label="Focus score per day over fourteen days, with hours behind it">' +
      grid + bars + line + '</svg>' +
    '</div>' +
    '<div class="spark-x"><span>'+esc(prettyDate(days[0].date))+'</span>' +
    '<span>'+esc(prettyDate(days[days.length - 1].date))+'</span></div>';
}

</script>
<script>
/* ═══════════════════════════════════════════════════════════════ goals ═══ */
function pageGoals(v){
  var w = v.week, h = '';

  if(!w || !w.total){
    h += '<div class="card"><h2>Set this week’s goals</h2>' +
      '<p class="small dim prose" style="margin-bottom:12px">Hold the talk button and talk about the week. ' +
      'Claude writes the goals from what you said, and they appear here once they are filed. Or type them here, one per line.</p>' +
      '<div class="stack" id="goalDraft">' + goalInput(0) + goalInput(1) + goalInput(2) + goalInput(3) + '</div>' +
      '<button class="btn wide primary" id="saveGoals" style="margin-top:14px">Save</button>' +
      '<p class="tiny muted prose" style="margin-top:10px">Two or three goals are enough. ' +
      'Goals are what turn your hours into finished work by Sunday.</p></div>';
  } else {
    var elapsed = weekElapsed(w, v.today.date);
    h += '<div class="card"><div class="spread" style="align-items:flex-end;margin-bottom:14px">' +
      '<div><div class="serif" style="font-size:46px;line-height:1">'+w.progress+'<span style="font-size:22px">%</span></div>' +
      '<div class="small muted">Week of '+esc(prettyDate(w.start))+' · day '+elapsed+' of 7</div></div>' +
      '<div style="text-align:right"><div style="font-weight:700;font-size:19px">'+w.hit+' of '+w.total+'</div>' +
      '<div class="tiny muted">done</div></div></div>' +
      '<div class="bar" style="height:8px;position:relative;overflow:visible">' +
        '<i style="background:var(--goals)" data-w="'+Math.round(w.progress)+'"></i>' +
        // The pace is the whole idea of this corner, so it is a mark on the
        // track rather than a number in a caption beside it.
        '<span style="position:absolute;top:-5px;bottom:-5px;width:3px;border-radius:2px;' +
        'background:var(--goals);left:'+Math.round(elapsed/7*100)+'%"></span></div>' +
      '<div class="spread tiny muted" style="margin-top:7px">' +
      '<span><b style="color:var(--ink)">'+w.progress+'%</b> done</span>' +
      '<span><span style="display:inline-block;width:3px;height:10px;background:var(--goals);border-radius:2px;vertical-align:middle;margin-right:5px"></span>pace for day '+elapsed+' of 7 is '+Math.round(elapsed/7*100)+'%</span></div></div>';

    h += '<div class="card flush">' + w.goals.map(function(g, i){
      return '<div class="goal'+(g.done?' done':'')+'"><div class="top">' +
        '<button class="tick'+(g.done||g.percent>=100?' on':'')+'" data-goaltick="'+i+'" ' +
        'aria-label="'+((g.done||g.percent>=100)?'Mark not done':'Mark done')+'">'+((g.done||g.percent>=100)?'✓':'')+'</button>' +
        '<span class="txt"><span class="gt" dir="auto">'+esc(g.title)+'</span>'+
          (g.bucket?'<br><span class="pill" style="background:var(--goals-soft);color:var(--goals);' +
            'display:inline-block;margin-top:5px">'+esc(AREA_NAME[g.bucket]||g.bucket)+
            '</span>':'')+'</span>' +
        '<span class="pct">'+(g.done?100:(g.percent||0))+'%</span></div>' +
        // The finished row keeps the slider so the column stays flush. It is
        // disabled, not replaced by a different-looking control.
        '<input class="slider" type="range" min="0" max="100" step="5" value="'+
          (g.done || g.percent >= 100 ? 100 : (g.percent||0))+'" data-goalpct="'+i+'"' +
          (g.done || g.percent >= 100 ? ' data-locked="1" tabindex="-1"' : '') +
          ' aria-label="Progress on '+esc(g.title)+'">' +
        '</div>';
    }).join('') + '</div>';
    h += '<button class="btn wide primary" id="editGoals" style="margin-bottom:14px">' +
       'Change this week’s goals</button>';
  }

  if(w && w.total && v.today.weekday === 'Sunday'){
    h += '<div class="card" style="border-color:var(--goals);background:var(--goals-soft)">' +
      '<h2 style="color:var(--goals)">Review the week</h2>' +
      '<p class="small dim prose">'+w.hit+' of '+w.total+' done. Hold the talk button and say how the ' +
      'week went: what you finished, what slipped, and why. Claude writes it into the week’s file, ' +
      'and it shows here under this week from then on.</p></div>';
  }
  var past = (v.weeks||[]).filter(function(x){ return !x.current; }).reverse();
  if(past.length) h += '<div class="card"><h2>Every week so far</h2>' +
    (past.length ? '<div class="stack" style="gap:0;divide:0">' + past.map(function(x){
      return '<div class="spread" style="padding:11px 0;align-items:flex-start">' +
        '<div style="min-width:0"><div style="font-weight:600">Week of '+esc(prettyDate(x.start))+'</div>' +
        '<div class="tiny muted">'+esc(prettyDate(x.start))+' to '+esc(prettyDate(x.end))+'</div>' +
        (x.review ? '<div class="small prose" style="margin-top:6px">'+esc(x.review)+'</div>' : '') + '</div>' +
        '<div class="row" style="gap:14px;flex:0 0 auto">' +
        '<span class="small" style="white-space:nowrap"><b>'+x.hit+'</b><span class="muted"> of '+x.total+'</span></span>' +
        '<span style="width:44px;flex:0 0 44px">'+triSVG({consistency:x.consistency,focus:x.focus,goals:x.goals},
          {size:44, r:17, labels:false})+'</span></div></div>';
    }).join('') + '</div>' +
      '<div class="spread small" style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line)">' +
      '<span class="muted">Finish rate</span><span style="font-weight:700">' +
      hitRate(past) + '</span></div>'
     : emptyBox('🏁','No finished weeks yet','This fills in every Sunday.')) + '</div>';
  return h;
}
function goalInput(i){
  return '<textarea class="setup-in" rows="1" dir="auto" data-draft="'+i+'" placeholder="Goal '+(i+1)+
    (i?' (optional)':'')+'" style="width:100%;padding:13px;border:1px solid var(--line);' +
    'border-radius:11px;background:var(--surface);resize:none;line-height:1.4;font:inherit;display:block"></textarea>';
}
function prettyDate(iso){
  var d = new Date(iso + 'T00:00:00');
  if(isNaN(d)) return iso;
  var out = d.getDate() + ' ' + ['January','February','March','April','May','June','July',
    'August','September','October','November','December'][d.getMonth()];
  return d.getFullYear() === new Date().getFullYear() ? out : out + ' ' + d.getFullYear();
}
function prettyStamp(stamp){
  // "2026-09-01 19:59" → "1 September, 19:59"
  var m = /^(\d{4}-\d{2}-\d{2})[ T]([01]\d|2[0-3]):([0-5]\d)/.exec(String(stamp || ''));
  if(!m || isNaN(new Date(m[1] + 'T12:00:00'))) return 'time unknown';
  return prettyDate(m[1]) + ', ' + m[2] + ':' + m[3];
}
function weekElapsed(w, onDate){
  var monday = new Date(w.start + 'T00:00:00'), d = new Date(onDate + 'T00:00:00');
  return Math.max(1, Math.min(7, Math.round((d - monday)/86400000) + 1));
}
function hitRate(weeks){
  var hit = 0, tot = 0;
  weeks.forEach(function(w){ hit += w.hit; tot += w.total; });
  return tot ? Math.round(hit/tot*100) + '% (' + hit + ' of ' + tot + ')' : '·';
}

/* ═══════════════════════════════════════════════════════════════ tasks ═══ */
var TASK_FILTER = 'all';
var AREA_FILTER = 'all';
function pageTasks(v){
  var all = (v.tasks || []).filter(function(t){ return t && String(t.title || '').trim(); });
  var ticked = {};
  PEND.forEach(function(e){ if(e.kind === 'task_tick') ticked[(e.payload||{}).id] = 1; });

  function matchDue(f, t){
    return f === 'all' ? true
         : f === 'later' ? t.when === 'future'
         : f === 'none' ? !t.due
         : t.when === f;
  }
  function matchArea(f, t){ return f === 'all' || t.area === f; }

  var dues = [['all','All'],['overdue','Overdue'],['today','Today'],['none','No date'],['later','Later']];
  // Every area Amir actually has open work in, so the row does not carry five
  // chips reading zero. `overhead` is never a task area.
  var order = {ai:0, ucw:1, research:2, dog:3, personal:4};
  var seen = {}, labelOf = {};
  all.forEach(function(t){
    if(t.area && t.area !== 'overhead'){ seen[t.area] = 1; if(t.area_label && !labelOf[t.area]) labelOf[t.area] = t.area_label; }
  });
  var areas = [['all','All areas']].concat(
    Object.keys(seen).sort(function(a, b){
      return (order[a] != null ? order[a] : 9) - (order[b] != null ? order[b] : 9) || (a < b ? -1 : 1);
    }).map(function(k){ return [k, (v.areas || {})[k] || labelOf[k] || k]; })
  );

  // Each chip counts what you would see if you tapped it, so the two rows agree
  // with each other rather than each counting the whole list.
  var h = '<div class="chips-wrap"><div class="chips" aria-label="Due date">' + dues.map(function(c){
    var n = all.filter(function(t){ return matchDue(c[0], t) && matchArea(AREA_FILTER, t); }).length;
    return '<button class="chip'+(TASK_FILTER===c[0]?' on':'')+'" data-filter="'+c[0]+'">' +
      esc(c[1]) + ' <span class="ct">'+n+'</span></button>';
  }).join('') + '</div></div>';

  h += '<div class="chips-wrap"><div class="chips" aria-label="Area">' + areas.map(function(c){
    var n = all.filter(function(t){ return matchDue(TASK_FILTER, t) && matchArea(c[0], t); }).length;
    return '<button class="chip'+(AREA_FILTER===c[0]?' on':'')+'" data-areafilter="'+c[0]+'">' +
      esc(c[1]) + ' <span class="ct">'+n+'</span></button>';
  }).join('') + '</div></div>';

  var list = all.filter(function(t){ return matchDue(TASK_FILTER, t) && matchArea(AREA_FILTER, t); });
  var odAll = all.filter(function(t){ return t.when === 'overdue'; }).length;
  if(odAll && TASK_FILTER === 'all' && AREA_FILTER === 'all')
    h += '<p class="small" style="margin:0 4px 12px;color:var(--consistency);font-weight:600">'+odAll+' overdue</p>';
  if(!list.length) return h + '<div class="card">' +
    (TASK_FILTER === 'all' && AREA_FILTER === 'all'
      ? emptyBox('🎙','No tasks yet','Hold the talk button and say a task and where it belongs.')
      : emptyBox('🔍','Nothing in this filter','Try another one.')) + '</div>';

  var groups = {}, areaOf = {}, sectionOf = {}, areaLabel = {};
  list.forEach(function(t){
    var al = t.area_label || (v.areas || {})[t.area] || t.area || 'Other';
    var k = al + ' · ' + (t.section || 'General');
    (groups[k] = groups[k] || []).push(t);
    areaOf[k] = t.area || 'other'; sectionOf[k] = t.section || 'General'; areaLabel[t.area || 'other'] = al;
  });
  var areasHere = Object.keys(areaLabel);
  // Every area at once is a board: one column per area, the lists stacked
  // inside it, scrolled sideways. Sixteen cards in two long columns were
  // unreadable; five named columns are a map.
  var board = AREA_FILTER === 'all' && areasHere.length > 1;
  // The most overdue list first. Alphabetical order buried the thing that was
  // three weeks late under a list that was not late at all.
  var order = Object.keys(groups).sort(function(a, b){
    var worst = function(k){

    b.worked = b.days.reduce(function(x, d){ return x + (d.worked_minutes || 0); }, 0);
    b.dayCount = b.days.filter(function(d){ return d.exists; }).length;

      return '<div class="spread small" style="padding:8px 0;border-bottom:1px solid var(--line-soft)">' +
        '<span>'+esc(b.title)+'</span><span style="font-weight:600;color:'+(b[P_CORNER] != null ? c.hex : 'var(--ink-3)')+'">' +

/* Taps made on another device. They sit in the events table as `new` until
