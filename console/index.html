<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>myday</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="myday">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">

<!--
  myday console: the visual half of a_myday.

  THE MODEL, in one paragraph. The Mac is the source of truth: Claude publishes a
  state blob (tasks, today's sessions, focus balance) and this page renders it.
  The page never edits tasks/ or days/. Everything Amir taps here is an EVENT
  ("started ucw", "stopped", "ticked X") that queues up and is reconciled by
  Claude at the Mac. So the screen always shows two layers: what Claude has
  filed, and what Amir has done since that hasn't been filed yet. Every pending
  thing is labelled as pending. That distinction is the whole design.

  Renders from localStorage first and refreshes in the background, so opening the
  app is instant on bad signal and works with none. Events and voice notes are
  saved to localStorage BEFORE any network call and removed only once the server
  confirms: the save-before-send ordering the capture app learned the hard way on
  2026-08-11.
-->

<style>
  :root {
    --bg:#f2f2f7; --surface:#fff; --fg:#000; --dim:#8a8a8e; --faint:#c7c7cc;
    --line:rgba(60,60,67,.10); --sunk:#ececf1;
    --go:#34c759; --stop:#ff3b30; --warn:#ff9500; --accent:#007aff;
    --acad:#5e5ce6; --dog:#ff9500; --ai:#32ade6;
    --shadow:0 1px 2px rgba(0,0,0,.04), 0 6px 20px rgba(0,0,0,.05);
    --ring-track:rgba(120,120,128,.14);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#000; --surface:#1c1c1e; --fg:#fff; --dim:#98989d; --faint:#48484a;
      --line:rgba(84,84,88,.5); --sunk:#2c2c2e;
      --go:#30d158; --stop:#ff453a; --warn:#ff9f0a; --accent:#0a84ff;
      --acad:#7d7aff; --dog:#ff9f0a; --ai:#64d2ff;
      --shadow:none; --ring-track:rgba(120,120,128,.22);
    }
  }

  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { -webkit-text-size-adjust:100%; text-size-adjust:100%; }
  html,body { margin:0; padding:0; }
  body {
    background:var(--bg); color:var(--fg);
    font:17px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
    -webkit-user-select:none; user-select:none; overscroll-behavior-y:none;
    padding-top:env(safe-area-inset-top);
  }
  button { font-family:inherit; touch-action:manipulation; }

  header {
    position:sticky; top:0; z-index:20;
    padding:calc(env(safe-area-inset-top) + 6px) 20px 10px;
    margin-top:calc(-1 * env(safe-area-inset-top));
    background:color-mix(in srgb, var(--bg) 82%, transparent);
    -webkit-backdrop-filter:saturate(180%) blur(20px);
    backdrop-filter:saturate(180%) blur(20px);
    border-bottom:.5px solid var(--line);
  }
  .htop { display:flex; align-items:center; gap:10px; }
  header h1 { font-size:26px; font-weight:700; margin:0; letter-spacing:-.03em; }
  header .date { color:var(--dim); font-size:14px; font-weight:500; margin-left:auto; }
  .qmark {
    width:26px; height:26px; border-radius:50%; border:0; background:var(--sunk);
    color:var(--dim); font-size:14px; font-weight:700; flex:none; line-height:1;
  }
  .status { display:flex; align-items:center; gap:5px; font-size:11.5px; color:var(--dim); margin-top:3px; }
  .status .led { width:6px; height:6px; border-radius:50%; background:var(--go); flex:none; }
  .status.bad .led { background:var(--stop); }
  .status.warn .led { background:var(--warn); }

  main { padding:4px 20px 108px; max-width:640px; margin:0 auto; }
  section { display:none; animation:fade .22s ease both; }
  section.on { display:block; }
  @keyframes fade { from { opacity:0; transform:translateY(6px);} to { opacity:1; transform:none; } }

  nav {
    position:fixed; left:0; right:0; bottom:0; z-index:30; display:flex; align-items:stretch;
    background:color-mix(in srgb, var(--bg) 80%, transparent);
    -webkit-backdrop-filter:saturate(180%) blur(20px); backdrop-filter:saturate(180%) blur(20px);
    border-top:.5px solid var(--line); padding-bottom:max(env(safe-area-inset-bottom), 6px);
  }
  /* Never smaller than 56px: an earlier build let these collapse on iOS until
     they could not be hit. */
  nav button {
    flex:1 1 0; min-height:56px; border:0; background:none; color:var(--dim);
    font-size:11px; font-weight:600; line-height:1.1;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    padding:8px 4px;
  }
  nav button .ic { font-size:22px; line-height:1; font-weight:400; }
  nav button.on { color:var(--accent); }
  nav button:active { opacity:.55; }
  nav button .badge {
    position:absolute; transform:translate(16px,-14px); background:var(--warn); color:#fff;
    font-size:10px; font-weight:700; min-width:16px; height:16px; border-radius:8px;
    display:flex; align-items:center; justify-content:center; padding:0 4px;
  }

  .card { background:var(--surface); border-radius:18px; padding:18px; box-shadow:var(--shadow); margin-bottom:14px; }
  h2 { font-size:13px; font-weight:600; color:var(--dim); margin:24px 4px 10px; }
  .sub { font-size:12.5px; color:var(--dim); margin:-6px 4px 10px; line-height:1.45; }

  /* ring */
  .ringwrap { display:flex; align-items:center; gap:16px; }
  .ring { width:142px; height:142px; flex:none; position:relative; }
  .ring svg { transform:rotate(-90deg); display:block; }
  .ring .mid { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .ring .mid .v { font-size:23px; font-weight:700; letter-spacing:-.04em; font-variant-numeric:tabular-nums; }
  .ring .mid .l { font-size:10px; color:var(--dim); font-weight:500; margin-top:1px; max-width:92px;
                  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:center; }
  .ring.live .mid .v { color:var(--go); }
  .legend { flex:1; min-width:0; display:flex; flex-direction:column; gap:11px; }
  .legend .row { display:flex; align-items:center; gap:9px; }
  .legend .sw { width:9px; height:9px; border-radius:3px; flex:none; }
  .legend .nm { font-size:14px; font-weight:500; flex:1; }
  .legend .vl { font-size:14px; font-weight:600; font-variant-numeric:tabular-nums; }
  .legend .row.zero .nm, .legend .row.zero .vl { color:var(--dim); }
  .verdict { margin-top:16px; padding-top:14px; border-top:.5px solid var(--line);
             font-size:13.5px; line-height:1.5; color:var(--dim); }
  .verdict b { color:var(--fg); font-weight:600; }

  /* the timer card: the one thing that has to be unambiguous */
  .timer { padding:0; overflow:hidden; }
  .timer .head { display:flex; align-items:center; gap:12px; padding:18px; }
  .timer.on .head { border-left:4px solid var(--go); padding-left:14px; }
  .timer.off .head { border-left:4px solid var(--faint); padding-left:14px; }
  .timer .dot { width:9px; height:9px; border-radius:50%; background:var(--go); flex:none;
                animation:pulse 2.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1; transform:scale(1)} 50%{opacity:.3; transform:scale(.82)} }
  .timer .what { flex:1; min-width:0; }
  .timer .what b { display:block; font-size:17px; font-weight:600; letter-spacing:-.01em; }
  .timer .what span { font-size:12.5px; color:var(--dim); display:block; margin-top:2px; }
  .timer .el { font-size:23px; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:-.03em; }
  .timer .acts { display:flex; gap:8px; padding:0 18px 18px; }
  .timer .acts.stack { flex-direction:column; }

  button.primary {
    width:100%; border:0; border-radius:14px; padding:16px; font-size:17px; font-weight:600;
    color:#fff; letter-spacing:-.01em; display:flex; align-items:center; justify-content:center; gap:7px;
    transition:transform .12s ease, opacity .12s ease;
  }
  button.primary:active { transform:scale(.975); opacity:.85; }
  button.primary.stop { background:var(--stop); }
  button.ghost {
    flex:1; border:0; border-radius:14px; padding:13px; font-size:15px; font-weight:600;
    background:var(--sunk); color:var(--fg);
  }
  button.ghost:active { opacity:.6; }
  button.ghost.warn { color:var(--warn); }

  .picker { padding:0 18px 18px; }
  .picker .lbl { font-size:13px; font-weight:600; color:var(--dim); margin-bottom:10px; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:9px; }
  .grid button {
    background:var(--sunk); border:0; border-radius:14px; color:var(--fg);
    padding:14px 6px 12px; display:flex; flex-direction:column; align-items:center; gap:6px;
    font-size:13px; font-weight:600; min-height:78px; transition:transform .12s ease;
  }
  .grid button:active { transform:scale(.95); }
  .grid button .ic { font-size:24px; line-height:1; }

  .pill { display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:600;
          padding:3px 8px; border-radius:999px; background:var(--sunk); color:var(--dim); }
  .pill.pend { background:rgba(255,149,0,.16); color:var(--warn); }
  .pill.filed { background:rgba(52,199,89,.16); color:var(--go); }

  /* sessions */
  .sess { display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:.5px solid var(--line); }
  .sess:last-child { border-bottom:0; padding-bottom:0; }
  .sess:first-child { padding-top:0; }
  .sess .ic { font-size:19px; width:26px; text-align:center; flex:none; }
  .sess .b { flex:1; min-width:0; }
  .sess .b b { font-size:15px; font-weight:500; display:block; }
  .sess .b span { font-size:12.5px; color:var(--dim); font-variant-numeric:tabular-nums; }
  .sess .d { font-size:15px; font-weight:600; font-variant-numeric:tabular-nums; text-align:right; }
  .sess.running .d { color:var(--go); }

  /* tasks */
  .chips { display:flex; gap:8px; overflow-x:auto; padding:4px 20px 10px; margin:0 -20px; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chips button { border:0; background:var(--surface); color:var(--dim); white-space:nowrap;
                  border-radius:999px; padding:8px 15px; font-size:14px; font-weight:600;
                  box-shadow:var(--shadow); flex:none; }
  .chips button.on { background:var(--fg); color:var(--bg); }
  .chips button .ct { opacity:.5; margin-left:4px; font-weight:500; }
  .grp { margin-bottom:22px; }
  .grp .hd { display:flex; align-items:baseline; gap:8px; margin:0 4px 8px; }
  .grp .hd b { font-size:15px; font-weight:600; }
  .grp .hd span { font-size:13px; color:var(--dim); }
  .grp .body { background:var(--surface); border-radius:18px; box-shadow:var(--shadow); overflow:hidden; }
  .task { display:flex; gap:13px; align-items:flex-start; padding:14px 16px; border-bottom:.5px solid var(--line); }
  .task:last-child { border-bottom:0; }
  .task:active { background:var(--bg); }
  .task .box { width:23px; height:23px; border:2px solid var(--faint); border-radius:7px; flex:none;
               margin-top:1px; display:flex; align-items:center; justify-content:center;
               font-size:14px; color:#fff; transition:background .15s, border-color .15s; }
  .task.on .box { background:var(--go); border-color:var(--go); }
  .task.on .tt { text-decoration:line-through; color:var(--dim); }
  .task .c { flex:1; min-width:0; }
  .task .tt { font-size:15.5px; line-height:1.35; }
  .task .mt { font-size:12.5px; color:var(--dim); margin-top:4px; display:flex; gap:9px;
              flex-wrap:wrap; align-items:center; }
  .task .mt .od { color:var(--stop); font-weight:600; }

  /* talk */
  .rec {
    width:100%; border:0; border-radius:20px; padding:30px 16px; color:#fff;
    font-size:19px; font-weight:700; letter-spacing:.02em; background:var(--go);
    display:flex; flex-direction:column; align-items:center; gap:6px; min-height:132px;
    justify-content:center; transition:background .18s ease, transform .12s ease;
  }
  .rec small { font-size:12.5px; font-weight:500; opacity:.85; letter-spacing:0; }
  .rec.arming { background:var(--faint); }
  .rec.live { background:var(--stop); transform:scale(1.01); }
  .rec:disabled { background:var(--faint); }
  .note { display:flex; gap:11px; padding:13px 0; border-bottom:.5px solid var(--line); align-items:flex-start; }
  .note:last-child { border-bottom:0; padding-bottom:0; }
  .note:first-child { padding-top:0; }
  .note .w { flex:1; min-width:0; }
  .note .w p { margin:0; font-size:15px; line-height:1.4; word-wrap:break-word; }
  .note .w span { font-size:11.5px; color:var(--dim); display:block; margin-top:4px; }

  /* diagnostics + misc */
  .diag .r { display:flex; gap:11px; padding:11px 0; border-bottom:.5px solid var(--line); align-items:flex-start; }
  .diag .r:last-child { border-bottom:0; padding-bottom:0; }
  .diag .r .s { font-size:15px; width:20px; flex:none; text-align:center; }
  .diag .r .t b { display:block; font-weight:600; font-size:14.5px; }
  .diag .r .t span { color:var(--dim); font-size:13px; line-height:1.45; display:block; margin-top:2px; }
  code { font:12.5px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace; background:var(--bg);
         padding:2px 6px; border-radius:5px; word-break:break-all; }
  .hint { color:var(--dim); font-size:13.5px; line-height:1.55; text-align:center; padding:26px 10px; }
  .hint b { color:var(--fg); }
  .foot { text-align:center; color:var(--faint); font-size:11px; padding:6px 0 2px; }
  .help p { margin:0 0 11px; font-size:14px; line-height:1.5; color:var(--dim); }
  .help p:last-child { margin-bottom:0; }
  .help b { color:var(--fg); }
</style>
</head>

<body>

<header>
  <div class="htop">
    <h1 id="hTitle">Today</h1>
    <button class="qmark" id="hHelp" aria-label="How this works">?</button>
    <span class="date" id="hDate"></span>
  </div>
  <div class="status" id="hStatus"><span class="led"></span><span id="hStatusT">starting…</span></div>
</header>

<main>
  <section id="s-today" class="on"></section>
  <section id="s-tasks"></section>
  <section id="s-talk"></section>
</main>

<nav>
  <button data-go="today" class="on"><span class="ic">◍</span>Today</button>
  <button data-go="tasks"><span class="ic">☑</span>Tasks</button>
  <button data-go="talk"><span class="ic">🎙</span>Talk</button>
</nav>

<script>
(function () {
  'use strict';

  var BUILD = 'c3 · 2026-08-14';

  var CFG_KEY   = 'myday_cfg';
  var STATE_KEY = 'myday_state';
  var EVQ_KEY   = 'myday_evq';     // start/stop/tick events, saved before sending
  var NOTEQ_KEY = 'myday_queue';   // voice notes. SHARED with the capture app on
                                   // purpose: same origin, same format, same
                                   // server contract, and qid makes a double
                                   // send by both apps harmless.
  var LOCAL_KEY = 'myday_local2';  // what Amir has done since the last publish

  var POLL_MS = 20000;
  var MAX_AUDIO_BYTES = 4500000;

  var AREAS = [
    { slug:'ucw',      label:'UCW',      ic:'🎓' },
    { slug:'ai',       label:'AI',       ic:'🤖' },
    { slug:'dog',      label:'Dog',      ic:'🐕' },
    { slug:'research', label:'Research', ic:'🔬' },
    { slug:'personal', label:'Personal', ic:'🏠' },
    { slug:'overhead', label:'Overhead', ic:'🚚' }
  ];
  var AREA_IC = {}; AREAS.forEach(function (a) { AREA_IC[a.slug] = a.ic; });
  var BUCKET_OF = { ucw:'academia', research:'academia', dog:'dog', ai:'ai' };
  var BUCKETS = [
    { k:'academia', n:'Academia', c:'var(--acad)' },
    { k:'dog',      n:'Dog',      c:'var(--dog)'  },
    { k:'ai',       n:'AI',       c:'var(--ai)'   }
  ];

  var cfg=null, state=null, local=null, evq=[], tab='today', filter='all';
  var picking=false, showHelp=false, notes=[];
  var health = { net:null, err:'', lastTry:'' };

  // ---------------------------------------------------------------- storage
  function load(k, d) { try { var v=localStorage.getItem(k); return v?JSON.parse(v):d; } catch(e){ return d; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }

  function readConfig() {
    var h = location.hash.replace(/^#/, '');
    if (h) {
      var p = {};
      h.split('&').forEach(function (kv) {
        var i = kv.indexOf('='); if (i>0) p[kv.slice(0,i)] = decodeURIComponent(kv.slice(i+1));
      });
      var url = p.e || (p.d ? 'https://script.google.com/macros/s/'+p.d+'/exec' : '');
      if (url && p.k) { var c={url:url, token:p.k}; save(CFG_KEY,c); return c; }
    }
    return load(CFG_KEY, null);
  }

  // ---------------------------------------------------------------- helpers
  function esc(t) {
    return String(t==null?'':t).replace(/[&<>"]/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
    });
  }
  function pad(n){ return (n<10?'0':'')+n; }
  function stamp() {
    var d=new Date();
    return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+
           pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
  }
  function clock(){ var d=new Date(); return pad(d.getHours())+':'+pad(d.getMinutes()); }
  function hm(m) {
    if (m==null) return '—';
    m = Math.max(0, Math.round(m));
    return Math.floor(m/60)+'h'+pad(m%60)+'m';
  }
  function todayISO(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }

  function toMin(hhmm) {
    var m = /^(\d{1,2}):(\d{2})/.exec(hhmm||''); return m ? (+m[1])*60 + (+m[2]) : null;
  }
  /** Minutes from an "HH:MM" earlier today until now. Amir's day rolls over at
      05:00, not midnight, so a start in the future is really yesterday's. */
  function sinceToday(hhmm) {
    var s = toMin(hhmm); if (s==null) return 0;
    var d = new Date(), now = d.getHours()*60 + d.getMinutes();
    return now >= s ? now - s : (24*60 - s) + now;
  }
  function spanMin(a, b) {
    var x = toMin(a), y = toMin(b);
    if (x==null || y==null) return 0;
    return y >= x ? y - x : (24*60 - x) + y;
  }

  // ---------------------------------------------------------------- network
  function get(action, params) {
    var q = 'action='+action+'&token='+encodeURIComponent(cfg.token);
    for (var k in params) q += '&'+k+'='+encodeURIComponent(params[k]);
    return fetch(cfg.url+'?'+q, {method:'GET'}).then(function(r){ return r.json(); });
  }
  function post(body) {
    var b = { token: cfg.token };
    for (var k in body) b[k] = body[k];
    // text/plain keeps this a "simple" request, so the browser skips the CORS
    // preflight that Apps Script cannot answer.
    return fetch(cfg.url, { method:'POST', headers:{'Content-Type':'text/plain'},
                            body: JSON.stringify(b), redirect:'follow' })
           .then(function(r){ return r.json(); });
  }

  // ============================================================= the model
  //
  //  filed        what Claude has written into days/<today>.md
  //  pending      what Amir has done on the phone since the last publish
  //
  //  local = {
  //    date,
  //    open:      {start, area} | null      a session started here, still running
  //    segments:  [{start, end, area}]      sessions started AND stopped here
  //    filedEnd:  "HH:MM" | null            he stopped the session Claude had open
  //    ticked:    {taskId: true}
  //  }
  //
  //  Exactly one session can be running at a time, and it is either the filed
  //  one (if he has not stopped it) or the local one. They can never both count,
  //  which is what made the old screen show two different totals.

  function freshLocal() { return { date:todayISO(), open:null, segments:[], filedEnd:null, ticked:{} }; }

  /** The filed session Claude has open, if Amir has not already stopped it here. */
  function filedOpen() {
    var s = state && state.today && state.today.open_session;
    if (!s) return null;
    if (local && local.filedEnd) return null;   // he stopped it from the phone
    return s;
  }
  /** The single running session, whichever layer it comes from. */
  function running() {
    if (local && local.open) return { start:local.open.start, area:local.open.area, pending:true };
    var f = filedOpen();
    return f ? { start:f.start, area:f.area, task:f.task, pending:false } : null;
  }
  /** Minutes contributed by the filed open session, whether or not it is still running. */
  function filedOpenMinutes() {
    var s = state && state.today && state.today.open_session;
    if (!s) return 0;
    return (local && local.filedEnd) ? spanMin(s.start, local.filedEnd) : sinceToday(s.start);
  }
  function workedMinutes() {
    var t = (state && state.today) || {};
    var n = t.closed_minutes || 0;      // filed, already closed
    n += filedOpenMinutes();            // filed, still open (or stopped here)
    (local.segments||[]).forEach(function (s) { n += spanMin(s.start, s.end); });
    if (local.open) n += sinceToday(local.open.start);
    return n;
  }
  function liveBuckets() {
    var b = (state && state.today && state.today.buckets) || {};
    var out = { academia:b.academia||0, dog:b.dog||0, ai:b.ai||0 };
    function add(area, mins) { var k = BUCKET_OF[area]; if (k) out[k] += mins; }
    var fs = state && state.today && state.today.open_session;
    if (fs) add(fs.area, filedOpenMinutes());
    (local.segments||[]).forEach(function (s) { add(s.area, spanMin(s.start, s.end)); });
    if (local.open) add(local.open.area, sinceToday(local.open.start));
    return out;
  }

  // ----------------------------------------------------------------- events
  function emit(kind, payload) {
    var ev = { qid:'e'+Date.now()+'-'+Math.random().toString(36).slice(2,8),
               kind:kind, payload:payload||{}, client_ts:stamp() };
    evq.push(ev); save(EVQ_KEY, evq);
    return ev;
  }

  function doStart(area) {
    var now = clock();
    // Starting while something runs is a SWITCH: close the old one first, so the
    // two can never overlap and the totals stay honest.
    if (running()) doStop(true);
    emit('session_start', { area:area });
    local.open = { start:now, area:area };
    local.date = todayISO(); save(LOCAL_KEY, local);
    picking = false; render(); flush();
  }

  function doStop(silent) {
    var now = clock();
    if (local.open) {
      local.segments.push({ start:local.open.start, end:now, area:local.open.area });
      local.open = null;
    } else if (filedOpen()) {
      local.filedEnd = now;
    } else { return; }
    emit('session_stop', {});
    local.date = todayISO(); save(LOCAL_KEY, local);
    if (!silent) { render(); flush(); }
  }

  /**
   * Undo a start he did not mean. If the event is still queued it is simply
   * dropped and the server never hears about it; if it has already gone, a
   * `session_cancel` tells Claude to ignore the previous start.
   */
  function doUndoStart() {
    if (!local.open) return;
    var i = -1;
    for (var j = evq.length-1; j >= 0; j--) {
      if (evq[j].kind === 'session_start') { i = j; break; }
    }
    if (i > -1) { evq.splice(i,1); save(EVQ_KEY, evq); }
    else { emit('session_cancel', { start: local.open.start, area: local.open.area }); }
    local.open = null; save(LOCAL_KEY, local);
    render(); flush();
  }

  var flushing = false;
  function flush() {
    if (flushing || !cfg) return;
    if (!evq.length) { flushNotes(); return; }
    flushing = true;
    var ev = evq[0];
    post({ action:'event', kind:ev.kind, payload:ev.payload, client_ts:ev.client_ts, qid:ev.qid })
      .then(function (r) {
        if (r && r.ok) { evq.shift(); save(EVQ_KEY, evq); health.net = true; }
        else if (r && r.error) { health.net = false; health.err = r.error; }
      })
      .catch(function (e) { health.net = false; health.err = String(e && e.message || e); })
      .then(function () {
        flushing = false; render();
        if (evq.length) setTimeout(flush, 1500); else flushNotes();
      });
  }

  // ------------------------------------------------------------------- sync
  function refresh() {
    if (!cfg) return;
    health.lastTry = clock();
    get('state').then(function (r) {
      if (!r)      { health.net=false; health.err='no response'; render(); return; }
      if (!r.ok)   { health.net=false; health.err=r.error||'server refused'; render(); return; }
      health.net = true; health.err = '';
      if (!r.state){ state=null; render(); return; }

      var s; try { s = JSON.parse(r.state); } catch(e){ health.err='state unreadable'; render(); return; }
      s._updated = r.updated || '';
      var prev = state && state._updated;
      state = s; save(STATE_KEY, s);

      // A fresh publish means Claude has filed everything up to that moment, so
      // the pending layer for sessions is no longer needed. Dropping it here is
      // what stops the same hour being counted twice.
      if (prev !== s._updated) {
        local.segments = [];
        local.filedEnd = null;
        if (local.open && s.today && s.today.open_session &&
            s.today.open_session.area === local.open.area) local.open = null;
      }
      if (local.ticked && s.tasks) {
        var live = {}; s.tasks.forEach(function(t){ live[t.id]=true; });
        Object.keys(local.ticked).forEach(function(id){ if (!live[id]) delete local.ticked[id]; });
      }
      if (local.date !== todayISO()) local = freshLocal();
      save(LOCAL_KEY, local);
      render();
    }).catch(function (e) {
      health.net = false; health.err = String(e && e.message || e);
      render();   // cached state stays on screen; only the badge changes
    });
  }

  // ----------------------------------------------------------------- render
  function ringSVG(vals, live) {
    var R=62, SW=14, C=2*Math.PI*R, total=vals.academia+vals.dog+vals.ai;
    var h='<svg width="142" height="142" viewBox="0 0 142 142">';
    h+='<circle cx="71" cy="71" r="'+R+'" fill="none" stroke="var(--ring-track)" stroke-width="'+SW+'"/>';
    if (total>0) {
      var off=0;
      BUCKETS.forEach(function (b) {
        var v=vals[b.k]; if (!v) return;
        var len=v/total*C;
        h+='<circle cx="71" cy="71" r="'+R+'" fill="none" stroke="'+b.c+'" stroke-width="'+SW+
           '" stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+
           '" stroke-dashoffset="'+(-off).toFixed(2)+'" stroke-linecap="butt"/>';
        off+=len;
      });
    }
    h+='</svg>';
    return '<div class="ring'+(live?' live':'')+'">'+h;
  }

  function helpCard() {

      'and lets you tell him what you are doing now.</p>'+
      '<p><b>One session runs at a time.</b> Tap an area to start it. Tapping a different area while '+
      'one is running <b>switches</b>: the first is stopped at that moment and the new one begins. '+
      'Nothing ever overlaps.</p>'+
      '<p><b>Orange “pending” means Claude has not filed it yet.</b> It is safely stored and will be '+
      'counted. Green “filed” means it is already in today’s file.</p>'+
      '<p><b>Nothing here can delete anything.</b> Ticking a task or stopping a session is a message '+
      'to Claude, never an edit.</p>'+
      '</div>';
  }

  function areaPicker(label) {
    var h = '<div class="picker"><div class="lbl">'+label+'</div><div class="grid">';
    AREAS.forEach(function (a) {
      h += '<button data-start="'+a.slug+'"><span class="ic">'+a.ic+'</span>'+a.label+'</button>';
    });

  /** Filed rows + pending rows, in clock order, each knowing which layer it is. */
  function sessionRows() {
    var out = [];
    ((state.today && state.today.sessions) || []).forEach(function (s) {
      if (s.open) {
        var end = (local && local.filedEnd) || null;
        out.push({ start:s.start, end:end, area:s.area, pending:false,
                   running:!end, minutes: end ? spanMin(s.start,end) : sinceToday(s.start) });
      } else {
        out.push({ start:s.start, end:s.end, area:s.area, pending:false, minutes:s.minutes });
      }
    });
    (local.segments||[]).forEach(function (s) {
      out.push({ start:s.start, end:s.end, area:s.area, pending:true, minutes:spanMin(s.start,s.end) });
    });
    if (local.open) {
      out.push({ start:local.open.start, end:null, area:local.open.area, pending:true,
                 running:true, minutes:sinceToday(local.open.start) });
    }
    return out.sort(function (a,c) { return (toMin(a.start)||0) - (toMin(c.start)||0); }).reverse();
  }

  function lastFinished() {
    var done = sessionRows().filter(function (s) { return s.end; });
    return done.length ? done[0] : null;
  }

  function balanceLine(b, total, open) {
    if (!total) return 'No focused work logged yet today.';
    var arr = BUCKETS.map(function(x){ return {n:x.n, v:b[x.k]}; })
                     .sort(function(p,q){ return q.v-p.v; });
    var lead=arr[0], last=arr[2], gap=lead.v-last.v, even=Math.round(total/3);
    if (gap < 30) return 'Evenly split, about <b>'+hm(even)+'</b> each. Keep it there.';
    if (!last.v)  return '<b>'+last.n+' is at zero.</b> '+lead.n+' has '+hm(lead.v)+
                         '. An even finish needs '+hm(even)+' in each.';
    return '<b>'+lead.n+' leads '+last.n+' by '+hm(gap)+'.</b> Even would be '+hm(even)+' each.';
  }

  function diagnostics() {
    var deployed = !(health.err && /unknown action/i.test(health.err));

      { ok: health.net===true && deployed, t:'Console endpoints deployed',
        s: health.net!==true ? 'Cannot tell until the connection works'
         : deployed ? 'Server answers the state call'

    ];

    rows.forEach(function (r) {
      h += '<div class="r"><span class="s">'+(r.ok?'✅':'⚪️')+'</span><div class="t"><b>'+

  function renderTasks() {
    var el = document.getElementById('s-tasks');
    if (!state) { el.innerHTML = diagnostics(); return; }
    var ticked = local.ticked || {}, all = (state.tasks||[]).slice();
    function match(f,t) {
      if (f==='all')     return t.when!=='future';
      if (f==='overdue') return t.when==='overdue';
      if (f==='today')   return t.when==='today';
      if (f==='nodate')  return !t.due;
      if (f==='later')   return t.when==='future';
      return t.area===f;
    }
    var view = all.filter(function(t){ return match(filter,t); });
    var defs = [['all','All'],['overdue','Overdue'],['today','Today'],['nodate','No date'],['later','Later']]
      .concat(AREAS.filter(function(a){return a.slug!=='overhead';})
                   .map(function(a){ return [a.slug, a.ic+' '+a.label]; }));

    var h = '<div class="chips">';
    defs.forEach(function (f) {
      var n = all.filter(function(t){ return match(f[0],t); }).length;
      if (!n && f[0]!=='all' && f[0]!==filter) return;
      h += '<button data-f="'+f[0]+'"'+(filter===f[0]?' class="on"':'')+'>'+f[1]+
           '<span class="ct">'+n+'</span></button>';
    });
    h += '</div>';
    if (!view.length) { el.innerHTML = h+'<div class="hint">Nothing here.</div>'; return; }

    var groups={}, order=[];
    view.forEach(function (t) {
      var key = t.area==='ucw' ? 'ucw · '+t.section : t.area;
      if (!groups[key]) { groups[key]=[]; order.push(key); }
      groups[key].push(t);
    });
    order.sort(function (a,c) {
      function worst(k){ return Math.max.apply(null, groups[k].map(function(t){return t.overdue_days||0;})); }
      return worst(c)-worst(a);
    });
    order.forEach(function (key) {
      var list = groups[key].slice().sort(function (a,c) {
        if (!a.due && !c.due) return 0;
        if (!a.due) return 1; if (!c.due) return -1;
        return a.due < c.due ? -1 : 1;
      });
      var f = list[0];
      var name = key.indexOf('ucw · ')===0 ? '🎓 '+key.slice(6)
               : (AREA_IC[f.area]||'•')+' '+((state.areas&&state.areas[f.area])||f.area);
      var od = list.filter(function(t){ return t.when==='overdue'; }).length;
      h += '<div class="grp"><div class="hd"><b>'+esc(name)+'</b><span>'+list.length+
           (od?' · '+od+' overdue':'')+'</span></div><div class="body">';
      list.forEach(function (t) {
        var on = !!ticked[t.id];
        h += '<div class="task'+(on?' on':'')+'" data-tick="'+t.id+'"><div class="box">'+(on?'✓':'')+
             '</div><div class="c"><div class="tt">'+esc(t.title)+'</div><div class="mt">';
        if (t.when==='overdue')    h += '<span class="od">'+t.overdue_days+'d overdue</span>';
        else if (t.when==='today') h += '<span>due today</span>';
        else if (t.due)            h += '<span>'+esc(t.due)+'</span>';
        else                       h += '<span>no date</span>';
        if (t.priority==='high') h += '<span>🔴</span>';
        if (t.repeat)            h += '<span>🔁 '+esc(t.repeat)+'</span>';
        if (on)                  h += '<span class="pill pend">pending</span>';
        h += '</div></div></div>';
      });
      h += '</div></div>';
    });
    el.innerHTML = h;
  }

  function renderTalk() {
    var el = document.getElementById('s-talk');

            '<button class="rec" id="rec">HOLD &amp; TALK<small>let go to send</small></button></div>'+

      .concat(notes.map(function (n) { return { ts:n.client_ts||n.server_ts, text:n.text, local:false }; }));

  }

  function render() {
    document.getElementById('hTitle').textContent =
      tab==='today' ? 'Today' : tab==='tasks' ? 'Tasks' : 'Talk';
    document.getElementById('hDate').textContent =
      state && state.today ? state.today.weekday+' '+state.today.date.slice(5).replace('-','/') : '';

    else if (health.net===false)      { cls+=' bad';  msg='offline · showing last known'; }
    else if (state && state._updated) { msg='synced · Claude filed up to '+state._updated.slice(11); }
    else                              { cls+=' warn'; msg='waiting for the first publish'; }

    document.getElementById('s-tasks').classList.toggle('on', tab==='tasks');
    document.getElementById('s-talk').classList.toggle('on', tab==='talk');

    else if (tab==='tasks') renderTasks();

  // ------------------------------------------------------------ interaction
  document.addEventListener('click', function (e) {
    var n = e.target.closest('[data-go]');
    if (n) { tab=n.getAttribute('data-go'); picking=false; window.scrollTo(0,0); render(); return; }

    if (e.target.closest('#hHelp')) { showHelp=!showHelp; render(); return; }

    var st = e.target.closest('[data-start]');
    if (st) { doStart(st.getAttribute('data-start')); return; }

    var a = e.target.closest('[data-act]');
    if (a) {
      var act = a.getAttribute('data-act');
      if (act==='stop')       doStop(false);
      if (act==='pick')       { picking=true; render(); }
      if (act==='cancelpick') { picking=false; render(); }
      if (act==='undo')       doUndoStart();
      return;
    }

    var f = e.target.closest('[data-f]');
    if (f) { filter=f.getAttribute('data-f'); render(); return; }

    var tk = e.target.closest('[data-tick]');
    if (tk) {
      var id = tk.getAttribute('data-tick');
      var task = (state.tasks||[]).filter(function(x){ return x.id===id; })[0];
      if (!task || (local.ticked && local.ticked[id])) return;
      emit('task_tick', { id:id, title:task.title, area:task.area, section:task.section });
      local.ticked = local.ticked || {}; local.ticked[id] = true;
      save(LOCAL_KEY, local); render(); flush();
    }
  });

  // ================================================================ recorder
  // Ported from the capture app. Every comment below records a failure that
  // actually happened; do not "simplify" any of it.

  var stream=null, mr=null, chunks=[], holding=false, startedAt=0, ticker=null, armed=false;
  var queueSeq=0, sending=false, sendingSince=0, recBound=null;

  function pickMime() {
    var want=['audio/mp4','audio/webm;codecs=opus','audio/webm'];
    for (var i=0;i<want.length;i++) {
      if (window.MediaRecorder && MediaRecorder.isTypeSupported(want[i])) return want[i];
    }
    return '';
  }
  function extFor(m){ return m.indexOf('mp4')>-1 ? 'm4a' : 'webm'; }

  function enqueueNote(item) {
    var q = load(NOTEQ_KEY, []);
    var held = q.reduce(function(n,x){ return n + (x.audio?x.audio.length:0); }, 0);
    // Over budget: drop audio from the OLDEST entries that still have words to
    // fall back on, so the newest recording always keeps its audio.
    for (var i=0; i<q.length && held+(item.audio?item.audio.length:0)>MAX_AUDIO_BYTES; i++) {
      if (q[i].audio && q[i].spoken) { held-=q[i].audio.length; q[i].audio=null; q[i].mime=null; }
    }
    q.push(item); save(NOTEQ_KEY, q); render();
  }
  function patchNote(qid, ch) {
    var q = load(NOTEQ_KEY, []);
    q.forEach(function(x){ if (x.qid===qid) { for (var k in ch) x[k]=ch[k]; } });
    save(NOTEQ_KEY, q); render();
  }
  function dequeueNote(qid) {
    save(NOTEQ_KEY, load(NOTEQ_KEY, []).filter(function(x){ return x.qid!==qid; }));
    render();
  }

  /** Oldest first, one at a time, stopping at the first failure. */
  function flushNotes() {
    if (sending && Date.now()-sendingSince > 90000) sending=false;   // never wedge
    if (sending || !cfg) return;
    var q = load(NOTEQ_KEY, []); if (!q.length) return;
    sending = true; sendingSince = Date.now();
    var item = q[0];
    // qid makes the send idempotent: a request can succeed on the server and
    // still fail on the way back, and the retry must not store the note twice.
    var body = item.audio
      ? { action:'transcribe', qid:item.qid, audio:item.audio, mime:item.mime, client_ts:item.ts }
      : { action:'add', qid:item.qid, text:item.spoken, client_ts:item.ts };
    post(body)
      .then(function (d) {
        if (d && d.ok) { notes = d.pending || notes; dequeueNote(item.qid); }
        else if (item.audio && item.spoken) patchNote(item.qid, {audio:null, mime:null});
        else if (item.audio) patchNote(item.qid, {audio:null, mime:null, spoken:'[could not transcribe]'});
        sending=false; flushNotes();
      })
      .catch(function () { sending=false; });   // stays queued, retried next tick
  }

  function recSet(cls, label, sub) {
    var rec = document.getElementById('rec'); if (!rec) return;
    rec.className = 'rec' + (cls?' '+cls:'');
    rec.innerHTML = esc(label) + (sub ? '<small>'+esc(sub)+'</small>' : '');
  }

  /**
   * Three states, because the microphone takes a second or two to open and the
   * button used to go red immediately. Anything said in that gap was never
   * recorded, and nothing on screen said so. Red is driven by MediaRecorder's
   * own onstart, the real moment capture begins.
   */
  function down(ev) {
    ev.preventDefault();
    if (holding) return;
    holding = true; armed = false;
    recSet('arming', 'GETTING READY', 'opening the microphone');

    navigator.mediaDevices.getUserMedia({ audio:true }).then(function (s) {
      stream = s;
      if (!holding) { releaseMic(); return; }        // released while it was opening
      var mime = pickMime(); chunks = [];
      // 48 kbps: 24 kbps was tried and cost real accuracy ("UCW work" came back
      // as "UCW award"). See phone/README.md.
      var opts = mime ? { mimeType:mime, audioBitsPerSecond:48000 } : { audioBitsPerSecond:48000 };
      try { mr = new MediaRecorder(s, opts); }
      catch (e) { mr = mime ? new MediaRecorder(s, {mimeType:mime}) : new MediaRecorder(s); }

      mr.onstart = function () {
        if (!holding) { releaseMic(); return; }      // let go before capture began
        armed = true; startedAt = Date.now();
        recSet('live', 'LISTENING', 'let go to send');
        clearInterval(ticker);
        ticker = setInterval(function () {
          if (holding && armed) {
            recSet('live', 'LISTENING  '+Math.round((Date.now()-startedAt)/1000)+'s', 'let go to send');
          }
        }, 500);
      };
      mr.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
      mr.onstop = function () {
        var type = (mr && mr.mimeType) || 'audio/mp4';
        var blob = new Blob(chunks, { type:type });
        if (blob.size < 1200) { releaseMic(); return; }   // a tap, not speech
        var ts = stamp(), qid = ts+'-'+(queueSeq++);
        var fr = new FileReader();
        fr.onloadend = function () {
          enqueueNote({ qid:qid, ts:ts, spoken:'', audio:String(fr.result).split(',')[1],
                        mime:type+';name=note.'+extFor(type) });
          flushNotes();
        };
        // If the clip itself is unreadable, still record that something was said.
        fr.onerror = function () {
          enqueueNote({ qid:qid, ts:ts, spoken:'[recording unreadable]', audio:null, mime:null });
          flushNotes();
        };
        fr.readAsDataURL(blob);
        releaseMic();
      };
      // Chunked, so a long note accumulates as it goes. Buffering ten minutes in
      // one lump is exactly how the tail of a note gets lost.
      mr.start(1000);
    }).catch(function (err) {
      holding = false; clearInterval(ticker);
      var rec = document.getElementById('rec');
      if (rec) { rec.disabled = true; recSet('', 'MIC BLOCKED', String(err && err.name || '')); }
    });
  }

  /**
   * Hands the microphone back to iOS. Keeping the stream alive between presses
   * left the amber recording indicator lit permanently. Never hold it open.
   */
  function releaseMic() {
    if (mr) { try { if (mr.state==='recording') mr.stop(); } catch(e){} mr=null; }
    if (stream) { try { stream.getTracks().forEach(function(t){t.stop();}); } catch(e){} stream=null; }
  }

  function up(ev) {
    if (ev) ev.preventDefault();
    if (!holding) return;
    holding = false;
    // Measured from the real start, not from the press.
    var tooShort = !armed || (Date.now()-startedAt) < 1000;
    clearInterval(ticker); armed = false;
    var rec = document.getElementById('rec');
    if (rec && !rec.disabled) recSet('', 'HOLD & TALK', 'let go to send');
    if (mr && mr.state==='recording') {
      if (tooShort) { try { mr.ondataavailable=null; mr.onstop=null; mr.stop(); } catch(e){} releaseMic(); }
      else { try { mr.stop(); } catch(e){} }        // onstop releases the mic
    } else { releaseMic(); }
  }

  /**
   * Pointer events ONLY. Binding touch* and mouse* together was a real bug: iOS
   * fires synthetic mouse events after every touch, so the second press ran
   * down() twice and could tear down a recording in progress.
   */
  function bindRecorder() {
    var rec = document.getElementById('rec');
    if (!rec || recBound === rec) return;
    recBound = rec;
    rec.addEventListener('pointerdown', function (e) {
      try { rec.setPointerCapture(e.pointerId); } catch (err) {}
      down(e);
    });
    rec.addEventListener('pointerup', up);
    rec.addEventListener('pointercancel', up);
  }

  function refreshNotes() {
    if (!cfg) return;
    get('fetch').then(function (d) { if (d && d.ok) { notes = d.entries||[]; if (tab==='talk') render(); } })
                .catch(function(){});
  }

  // -------------------------------------------------------------------- boot
  cfg   = readConfig();
  state = load(STATE_KEY, null);
  evq   = load(EVQ_KEY, []);
  local = load(LOCAL_KEY, null) || freshLocal();
  if (local.date !== todayISO()) local = freshLocal();
  if (!local.segments) local.segments = [];

  if (!cfg) {
    document.querySelector('main').innerHTML =
      '<div class="card diag"><div class="r"><span class="s">⚪️</span><div class="t">'+
      '<b>Not linked yet</b><span>Open the console link ending in <code>#d=…&amp;k=…</code> and keep '+
      'the whole fragment in the address bar when you add it to the Home Screen. If you just did '+
      'and still see this, you are in a Private tab, which cannot save anything.</span></div></div></div>';
    document.querySelector('nav').style.display = 'none';
  } else {
    render();                       // cached state paints before any network call
    refresh(); refreshNotes(); flush();
    setInterval(function(){ refresh(); refreshNotes(); flush(); }, POLL_MS);
    setInterval(function(){ if (running()) render(); }, 30000);   // live timer
    window.addEventListener('online', function(){ refresh(); flush(); });
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) { holding=false; releaseMic(); }
      else { refresh(); refreshNotes(); flush(); }
    });
  }
})();
</script>
</body>
</html>
