               'Nothing is lost in the meantime.</div><div class="foot">'+BUILD+'</div>';
  }

  function renderTasks() {
    var el = document.getElementById('s-tasks');
    if (!state) { el.innerHTML = diagnostics(); return; }
    var ticked = local.ticked || {}, all = (state.tasks||[]).slice();
    function matchDue(f,t) {
      if (f==='all')     return t.when!=='future';
      if (f==='overdue') return t.when==='overdue';
      if (f==='today')   return t.when==='today';
      if (f==='nodate')  return !t.due;
      if (f==='later')   return t.when==='future';
      return false;
    }
    function matchArea(f,t) { return f==='all' || t.area===f; }
    function matches(t) { return matchDue(dueFilter,t) && matchArea(areaFilter,t); }
    var view = all.filter(matches);
    var dueDefs = [['all','All'],['overdue','Overdue'],['today','Today'],['nodate','No date'],['later','Later']];
    var areaDefs = [['all','All areas']].concat(
      AREAS.filter(function(a){return a.slug!=='overhead';})
           .map(function(a){ return [a.slug, a.ic+' '+a.label]; })
    );

    var h = '<div class="chips" aria-label="Due date filters">';
    dueDefs.forEach(function (f) {
      var n = all.filter(function(t){ return matchDue(f[0],t) && matchArea(areaFilter,t); }).length;
      h += '<button data-due="'+f[0]+'"'+(dueFilter===f[0]?' class="on"':'')+'>'+f[1]+
           '<span class="ct">'+n+'</span></button>';
    });
    h += '</div><div class="chips" aria-label="Area filters">';
    areaDefs.forEach(function (f) {
      var n = all.filter(function(t){ return matchDue(dueFilter,t) && matchArea(f[0],t); }).length;
      h += '<button data-area="'+f[0]+'"'+(areaFilter===f[0]?' class="on"':'')+'>'+f[1]+
           '<span class="ct">'+n+'</span></button>';
    });
    h += '</div>';
    h += '<div class="sub" style="margin:6px 4px 14px">Tick something and it is sent to Claude. '+
         'Tap it again to undo before Claude files it at the Mac.</div>';
    if (!view.length) { el.innerHTML = h+'<div class="hint">Nothing here.</div>'; return; }

    var groups={}, order=[];
    view.forEach(function (t) {
      var key = t.section ? t.area+' · '+t.section : t.area;
      if (!groups[key]) { groups[key]=[]; order.push(key); }
      groups[key].push(t);
    });
    order.sort(function (a,c) {
      function worst(k){ return Math.max.apply(null, groups[k].map(function(t){return t.overdue_days||0;})); }
      return worst(c)-worst(a);
    });
    order.forEach(function (key) {
      var list = groups[key].slice().sort(function (a,c) {
        if (!a.due && !c.due) return 0;
        if (!a.due) return 1; if (!c.due) return -1;
        return a.due < c.due ? -1 : 1;
      });
      var f = list[0];
      var name = (AREA_IC[f.area]||'•')+' '+
                 (f.section || (state.areas&&state.areas[f.area]) || f.area);
      var od = list.filter(function(t){ return t.when==='overdue'; }).length;
      h += '<div class="grp"><div class="hd"><b>'+esc(name)+'</b><span>'+list.length+
           (od?' · '+od+' overdue':'')+'</span></div><div class="body">';
      list.forEach(function (t) {
        var on = !!ticked[t.id];
        h += '<div class="task'+(on?' on':'')+'" data-tick="'+t.id+'"><div class="box">'+(on?'✓':'')+
             '</div><div class="c"><div class="tt">'+esc(t.title)+'</div><div class="mt">';
        if (t.when==='overdue')    h += '<span class="od">'+t.overdue_days+'d overdue</span>';
        else if (t.when==='today') h += '<span>due today</span>';
        else if (t.due)            h += '<span>'+esc(t.due)+'</span>';
        else                       h += '<span>no date</span>';
        if (t.priority==='high') h += '<span>🔴</span>';
        if (t.repeat)            h += '<span>🔁 '+esc(t.repeat)+'</span>';

        h += '</div></div></div>';
      });
      h += '</div></div>';
    });
    el.innerHTML = h;
  }

  /** Only the notes list. The button above it is static and must never be
      rebuilt, or an in-progress recording loses its element mid-hold. */
  function renderTalk() {
    var el = document.getElementById('notes');
    if (!el) return;
    var q = load(NOTEQ_KEY, []);
    var rows = q.map(function (x) {
        return { ts:x.ts, text:x.spoken || '(recorded, sending…)', local:true, qid:x.qid };
      })
      .concat(notes.map(function (n) {
        return { ts:n.client_ts||n.server_ts, text:n.text, local:false, id:n.id };
      }));

    if (!rows.length) {
      el.innerHTML = '<div class="hint">No notes waiting.<br>Everything you have said has been filed.</div>';
      return;
    }
    var h = '<h2>Waiting for Claude</h2><div class="sub">Swipe a note left to edit or delete it.</div>'+
            '<div class="card" style="padding:4px 16px">';
    rows.reverse().forEach(function (n) {
      // A note still on the phone has no server id yet, so it can only be
      // dropped locally: there is nothing to edit until it comes back as text.
      h += '<div class="note" data-id="'+(n.id||'')+'" data-qid="'+esc(n.qid||'')+'">'+
           '<div class="actions">'+
           (n.id ? '<button class="e" data-nact="edit">Edit</button>' : '')+
           '<button class="d" data-nact="delete">Delete</button></div>'+
           '<div class="w"><p>'+esc(n.text)+'</p><span>'+esc(n.ts||'')+
           (n.local?' · on this phone':'')+'</span></div></div>';
    });
    el.innerHTML = h + '</div>';
  }

  function render() {
    // Never redraw while the editor sheet is open. The sheet itself is safe, but
    // a redraw replaces `notes` and rebuilds the list under it, and the save that
    // follows would then be written against a row that no longer matches.
    if (editNote || editSess) return;
    /* A redraw between touchstart and touchend removes the element the finger
       landed on, and WebKit then fires no click at all. No haptic, no colour
       change, no error, and a stop that never happened. The recorder button and
       both sheets were already protected from this; the timers were not, and they
       are the controls he uses twenty times a day. */
    if (touching) { renderPending = true; return; }
    document.getElementById('hTitle').textContent =
      tab==='today' ? 'Time tracking' : tab==='tasks' ? 'Tasks' : 'Talk';
    document.getElementById('hDate').textContent =
      state && state.today ? state.today.weekday+' '+state.today.date.slice(5).replace('-','/') : '';

    var noteQ = load(NOTEQ_KEY, []).length;
    var bar=document.getElementById('hStatus'), txt=document.getElementById('hStatusT');
    var cls='status', msg;
    if (evq.length || noteQ)          { cls+=' warn'; msg=(evq.length+noteQ)+' waiting to send'; }
    else if (health.net===false)      { cls+=' bad';  msg='offline · showing last known'; }
    else if (state && state._updated) { msg='synced · Claude filed up to '+state._updated.slice(11); }
    else                              { cls+=' warn'; msg='waiting for the first publish'; }
    bar.className=cls; txt.textContent=msg;

    [].forEach.call(document.querySelectorAll('nav button'), function (x) {
      x.classList.toggle('on', x.getAttribute('data-go')===tab);
    });
    document.getElementById('s-today').classList.toggle('on', tab==='today');
    document.getElementById('s-tasks').classList.toggle('on', tab==='tasks');
    document.getElementById('s-talk').classList.toggle('on', tab==='talk');

    if (tab==='today') renderToday();
    else if (tab==='tasks') renderTasks();
    else renderTalk();
  }

  // ------------------------------------------------------------ interaction
  var touching = false, renderPending = false;
  document.addEventListener('touchstart', function () { touching = true; },
                            { passive:true, capture:true });
  ['touchend','touchcancel'].forEach(function (t) {
    document.addEventListener(t, function () {
      touching = false;
      if (renderPending) { renderPending = false; setTimeout(render, 0); }
    }, { passive:true, capture:true });
  });

  document.addEventListener('click', function (e) {
    var n = e.target.closest('[data-go]');
    if (n) { tab=n.getAttribute('data-go'); document.querySelector('main').scrollTop=0; render(); return; }

    if (e.target.closest('#hHelp')) { showHelp=!showHelp; render(); return; }

    var tb = e.target.closest('[data-timer]');
    if (tb) { doTimer(tb.getAttribute('data-timer')); return; }

    var a = e.target.closest('[data-act]');
    if (a) {
      var act = a.getAttribute('data-act');
      if (act==='stop')    doStop(false);
      if (act==='nudge')   { toggleNudge(); render(); return; }
      if (act==='undo')    doUndoStart();
      if (act==='addsess') openSessEditor(null);
      return;
    }

    // --- session editing: everything happens in the sheet ----------------
    var ed = e.target.closest('[data-edit]');
    if (ed) { openSessEditor(ed.getAttribute('data-edit')); return; }

    var df = e.target.closest('[data-due]');
    if (df) { dueFilter=df.getAttribute('data-due'); render(); return; }

    var af = e.target.closest('[data-area]');
    if (af) { areaFilter=af.getAttribute('data-area'); render(); return; }

    var tk = e.target.closest('[data-tick]');
    if (tk) {
      var id = tk.getAttribute('data-tick');
      var task = (state.tasks||[]).filter(function(x){ return x.id===id; })[0];
      if (!task) return;
      var payload = { id:id, title:task.title, area:task.area, section:task.section,
                      due:task.due, priority:task.priority, repeat:task.repeat,
                      last_done:task.last_done };
      local.ticked = local.ticked || {};
      if (local.ticked[id]) {
        // The original tick may already be in flight or stored in the Sheet, so
        // never delete it from evq: doing that while flush() owns evq[0] can
        // shift the wrong event. Send an explicit correction instead. Events
        // are ordered, so Claude sees tick -> untick and keeps the task active.
        emit('task_untick', payload);
        delete local.ticked[id];
      } else {
        emit('task_tick', payload);
        local.ticked[id] = true;
      }
      save(LOCAL_KEY, local); render(); flush();
    }
  });

  // ================================================================ recorder
  // Ported from the capture app. Every comment below records a failure that
  // actually happened; do not "simplify" any of it.

  var stream=null, mr=null, chunks=[], holding=false, startedAt=0, ticker=null, armed=false;
  var queueSeq=0, sending=false, sendingSince=0, recBound=null;

  function pickMime() {
    var want=['audio/mp4','audio/webm;codecs=opus','audio/webm'];
    for (var i=0;i<want.length;i++) {
      if (window.MediaRecorder && MediaRecorder.isTypeSupported(want[i])) return want[i];
    }
    return '';
  }
  function extFor(m){ return m.indexOf('mp4')>-1 ? 'm4a' : 'webm'; }

  function enqueueNote(item) {
    var q = load(NOTEQ_KEY, []);
    var held = q.reduce(function(n,x){ return n + (x.audio?x.audio.length:0); }, 0);
    // Over budget: drop audio from the OLDEST entries that still have words to
    // fall back on, so the newest recording always keeps its audio.
    for (var i=0; i<q.length && held+(item.audio?item.audio.length:0)>MAX_AUDIO_BYTES; i++) {
      if (q[i].audio && q[i].spoken) { held-=q[i].audio.length; q[i].audio=null; q[i].mime=null; }
    }
    q.push(item); save(NOTEQ_KEY, q); render();
  }
  function patchNote(qid, ch) {
    var q = load(NOTEQ_KEY, []);
    q.forEach(function(x){ if (x.qid===qid) { for (var k in ch) x[k]=ch[k]; } });
    save(NOTEQ_KEY, q); render();
  }
  function dequeueNote(qid) {
    save(NOTEQ_KEY, load(NOTEQ_KEY, []).filter(function(x){ return x.qid!==qid; }));
    render();
  }

  /** Oldest first, one at a time, stopping at the first failure. */
  function flushNotes() {
    if (sending && Date.now()-sendingSince > 90000) sending=false;   // never wedge
    if (sending || !cfg) return;
    var q = load(NOTEQ_KEY, []); if (!q.length) return;
    sending = true; sendingSince = Date.now();
    var item = q[0];
    // qid makes the send idempotent: a request can succeed on the server and
    // still fail on the way back, and the retry must not store the note twice.
    var body = item.audio
      ? { action:'transcribe', qid:item.qid, audio:item.audio, mime:item.mime, client_ts:item.ts }
      : { action:'add', qid:item.qid, text:item.spoken, client_ts:item.ts };
    post(body)
      .then(function (d) {
        if (d && d.ok) { notes = d.pending || notes; dequeueNote(item.qid); }
        else if (item.audio && item.spoken) patchNote(item.qid, {audio:null, mime:null});
        else if (item.audio) patchNote(item.qid, {audio:null, mime:null, spoken:'[could not transcribe]'});
        sending=false; flushNotes();
      })
      .catch(function () { sending=false; });   // stays queued, retried next tick
  }

  /** Updates only the two text nodes inside the button, never the button or its
      structure, so a captured pointer is never disturbed mid-hold. */
  function recSet(cls, label, sub) {
    var rec = document.getElementById('rec'); if (!rec) return;
    rec.className = 'rec' + (cls ? ' '+cls : '');
    document.getElementById('recLabel').textContent = label;
    document.getElementById('recSub').textContent = sub || '';
  }

  /**
   * Three states, because the microphone takes a second or two to open and the
   * button used to go red immediately. Anything said in that gap was never
   * recorded, and nothing on screen said so. Red is driven by MediaRecorder's
   * own onstart, the real moment capture begins.
   */
  function down(ev) {
    ev.preventDefault();
    if (holding) return;
    holding = true; armed = false;
    recSet('arming', 'GETTING READY', 'opening the microphone');

    navigator.mediaDevices.getUserMedia({ audio:true }).then(function (s) {
      stream = s;
      if (!holding) { releaseMic(); return; }        // released while it was opening
      var mime = pickMime(); chunks = [];
      // 48 kbps: 24 kbps was tried and cost real accuracy ("UCW work" came back
      // as "UCW award"). See phone/README.md.
      var opts = mime ? { mimeType:mime, audioBitsPerSecond:48000 } : { audioBitsPerSecond:48000 };
      try { mr = new MediaRecorder(s, opts); }
      catch (e) { mr = mime ? new MediaRecorder(s, {mimeType:mime}) : new MediaRecorder(s); }

      mr.onstart = function () {
        if (!holding) { releaseMic(); return; }      // let go before capture began
        armed = true; startedAt = Date.now();
        recSet('live', 'LISTENING', 'let go to send');
        clearInterval(ticker);
        ticker = setInterval(function () {
          if (holding && armed) {
            recSet('live', 'LISTENING  '+Math.round((Date.now()-startedAt)/1000)+'s', 'let go to send');
          }
        }, 500);
      };
      mr.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
      mr.onstop = function () {
        var type = (mr && mr.mimeType) || 'audio/mp4';
        var blob = new Blob(chunks, { type:type });
        if (blob.size < 1200) { releaseMic(); return; }   // a tap, not speech
        var ts = stamp(), qid = ts+'-'+(queueSeq++);
        var fr = new FileReader();
        saving = true;                       // holds off any self-update reload
        fr.onloadend = function () {
          enqueueNote({ qid:qid, ts:ts, spoken:'', audio:String(fr.result).split(',')[1],
                        mime:type+';name=note.'+extFor(type) });
          saving = false;
          flushNotes();
        };
        // If the clip itself is unreadable, still record that something was said.
        fr.onerror = function () {
          enqueueNote({ qid:qid, ts:ts, spoken:'[recording unreadable]', audio:null, mime:null });
          saving = false;
          flushNotes();
        };
        fr.readAsDataURL(blob);
        releaseMic();
      };
      // Chunked, so a long note accumulates as it goes. Buffering ten minutes in
      // one lump is exactly how the tail of a note gets lost.
      mr.start(1000);
    }).catch(function (err) {
      holding = false; clearInterval(ticker);
      var rec = document.getElementById('rec');
      if (rec) { rec.disabled = true; recSet('', 'MIC BLOCKED', String(err && err.name || '')); }
    });
  }

  /**
   * Hands the microphone back to iOS. Keeping the stream alive between presses
   * left the amber recording indicator lit permanently. Never hold it open.
   */
  function releaseMic() {
    if (mr) { try { if (mr.state==='recording') mr.stop(); } catch(e){} mr=null; }
    if (stream) { try { stream.getTracks().forEach(function(t){t.stop();}); } catch(e){} stream=null; }
  }

  function up(ev) {
    if (ev) ev.preventDefault();
    if (!holding) return;
    holding = false;
    // Measured from the real start, not from the press.
    var tooShort = !armed || (Date.now()-startedAt) < 1000;
    clearInterval(ticker); armed = false;
    var rec = document.getElementById('rec');
    if (rec && !rec.disabled) recSet('', 'HOLD & TALK', 'let go to send');
    if (mr && mr.state==='recording') {
      if (tooShort) { try { mr.ondataavailable=null; mr.onstop=null; mr.stop(); } catch(e){} releaseMic(); }
      else { try { mr.stop(); } catch(e){} }        // onstop releases the mic
    } else { releaseMic(); }
  }

  /**
   * Pointer events ONLY. Binding touch* and mouse* together was a real bug: iOS
   * fires synthetic mouse events after every touch, so the second press ran
   * down() twice and could tear down a recording in progress.
   */
  function bindRecorder() {
    var rec = document.getElementById('rec');
    if (!rec || recBound === rec) return;
    recBound = rec;
    rec.addEventListener('pointerdown', function (e) {
      try { rec.setPointerCapture(e.pointerId); } catch (err) {}
      down(e);
    });
    rec.addEventListener('pointerup', up);
    rec.addEventListener('pointercancel', up);
  }

  // ------------------------------------------------------- notes: swipe/edit
  /**
   * Horizontal drag reveals Edit and Delete. The direction is decided once, on
   * the first few pixels of movement, so a vertical scroll through the list is
   * never mistaken for a swipe.
   */
  (function () {
    var host = document.getElementById('s-talk');
    var startX=0, startY=0, row=null, decided=false, horizontal=false;

    function closeAll(except) {
      [].forEach.call(host.querySelectorAll('.note.open'), function (r) {
        if (r !== except) r.classList.remove('open');
      });
    }
    host.addEventListener('touchstart', function (e) {
      var t = e.target.closest ? e.target.closest('.note') : null;
      if (!t || e.target.closest('.actions')) return;
      row=t; startX=e.touches[0].clientX; startY=e.touches[0].clientY;
      decided=false; horizontal=false;
    }, { passive:true });

    host.addEventListener('touchmove', function (e) {
      if (!row) return;
      var dx = e.touches[0].clientX-startX, dy = e.touches[0].clientY-startY;
      if (!decided) {
        if (Math.abs(dx)<8 && Math.abs(dy)<8) return;
        decided=true; horizontal=Math.abs(dx)>Math.abs(dy);
        if (horizontal) { closeAll(row); row.classList.add('swiping'); }
      }
      if (!horizontal) return;
      var w = row.querySelectorAll('.actions button').length * 80;
      var off = Math.max(-w, Math.min(0, dx - (row.classList.contains('open') ? -0 : 0)));
      row.querySelector('.w').style.transform = 'translateX('+off+'px)';
    }, { passive:true });

    /* iOS fires touchcancel instead of touchend whenever the system claims the
       gesture: an edge swipe, an incoming call, Control Centre. Without this the
       note stays dragged halfway across, and the next touch anywhere in the list
       keeps dragging that same stale row. */
    host.addEventListener('touchcancel', function () {
      if (!row) return;
      var n = row.querySelector('.w') || row.querySelector('.note');
      row.classList.remove('swiping');
      if (n) n.style.transform = '';
      row = null;
    }, { passive:true });

    host.addEventListener('touchend', function () {
      if (!row) return;
      var body = row.querySelector('.w');
      if (horizontal) {
        var cur = parseFloat((body.style.transform.match(/-?\d+(\.\d+)?/)||[0])[0]) || 0;
        var w = row.querySelectorAll('.actions button').length * 80;
        row.classList.remove('swiping');
        body.style.transform = '';
        row.classList.toggle('open', cur < -w/2);
      }
      row = null;
    });
  })();

  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-nact]');
    if (!b) return;
    var note = b.closest('.note');
    var id = Number(note.getAttribute('data-id')) || 0;
    var qid = note.getAttribute('data-qid');
    var act = b.getAttribute('data-nact');

    if (act === 'delete') {
      note.classList.remove('open');
      if (id) {
        // Marked "discarded" server-side, never actually deleted: a mis-swipe
        // must not be able to lose a note.
        notes = notes.filter(function (n) { return n.id !== id; });
        render();
        post({ action:'discard', id:id })
          .then(function (d) { if (d && d.ok) { notes = d.pending || notes; render(); } })
          .catch(function () { refreshNotes(); });
      } else if (qid) {
        save(NOTEQ_KEY, load(NOTEQ_KEY, []).filter(function (x) { return x.qid !== qid; }));
        render();
      }
      return;
    }

    if (act === 'edit' && id) {
      note.classList.remove('open');
      openNoteEditor(id, note.querySelector('p').textContent);
    }
  });

  /* ------------------------------------------------------- the note editor
   * Opening the sheet, and the two ways out of it. Nothing here saves on blur:
   * he leaves by pressing Save or Cancel, and nothing else ends the edit.
   */
  function openNoteEditor(id, text) {
    editNote = { id:id, before:text };
    var ta = document.getElementById('eText');
    ta.value = text;
    document.getElementById('esheet').classList.add('on');
    fitViewport();
    ta.focus();
    // Caret at the end rather than everything selected, so one wrong word can be
    // fixed without retyping the note.
    try { ta.setSelectionRange(text.length, text.length); } catch (e) {}
    // iOS reports the viewport height several times while the keyboard slides up
    // and the early values are wrong, which is what left a band of dead white
    // page below the tab bar. Measure again until it has settled.
    [80, 250, 500, 900].forEach(function (ms) { setTimeout(fitViewport, ms); });
  }

  function closeNoteEditor() {
    editNote = null;
    document.getElementById('esheet').classList.remove('on');
    document.getElementById('eText').blur();
    fitSettling();
    render();
  }

  document.getElementById('eCancel').addEventListener('click', closeNoteEditor);

  document.getElementById('eSave').addEventListener('click', function () {
    if (!editNote) return;
    var id = editNote.id, before = editNote.before;
    var after = document.getElementById('eText').value.trim();
    closeNoteEditor();
    if (!after || after === before) return;
    notes.forEach(function (n) { if (n.id === id) n.text = after; });
    render();
    post({ action:'edit', id:id, text:after })
      .then(function (d) { if (d && d.ok) { notes = d.pending || notes; render(); } })
      .catch(function () { refreshNotes(); });
  });

  function refreshNotes() {
    if (!cfg) return;
    get('fetch').then(function (d) { if (d && d.ok) { notes = d.entries||[]; if (tab==='talk') render(); } })
                .catch(function(){});
  }

  // -------------------------------------------------------------------- boot
  cfg   = readConfig();
  state = load(STATE_KEY, null);
  evq   = load(EVQ_KEY, []);
  local = load(LOCAL_KEY, null) || freshLocal();
  if (local.date !== todayISO()) local = rollLocal(local);
  if (!local.segments) local.segments = [];
  // c18 could not reverse a task tick. Clear its stranded optimistic ticks once
  // when c19 first loads; the server-side event is reconciled independently.
  if (!load('myday_task_undo_c19', false)) {
    local.ticked = {};
    save(LOCAL_KEY, local);
    save('myday_task_undo_c19', true);
  }

  /* ---------- viewport ----------
   * inset:0 is supposed to give the full viewport, but on this phone the tab bar
   * still lands short of the bottom of the screen, so stop trusting it and pin the
   * height to what the browser reports as visible. Runs on load, on resize and on
   * rotation. geom() prints the same measurements into the footer, because reading
   * them off a screenshot is the only way this Mac can see an iPhone.
   */
  /* ----------------------------------------------------- the session editor
   * One sheet does all four jobs Amir needs: fix a start he set late, fix an end
   * he forgot to press, move a session to the right area, and add work he did
   * away from the phone entirely. It is static markup outside every redraw, so it
   * cannot be torn away mid-edit the way the old inline editor was.
   */
  function openSessEditor(id) {
    var row = id ? sessionRows().filter(function (x) { return x.id === id; })[0] : null;
    if (id && !row) return;

    editSess = {
      id: id,
      isNew: !id,
      // `guessedEnd` marks an end this app inferred to keep one session running.
      // Sending it as `was` would let an area-only correction overwrite the real
      // stop time in the day file with our guess.
      was: row ? { start:row.start, end:(row.guessedEnd ? null : row.end), area:row.area } : null,
      area: row ? row.area : 'ucw',
      // A forgotten session almost always ended a moment ago, so an hour back to
      // now is the guess that needs the least correcting.
      start: row ? row.start : minusMinutes(clock(), 60),
      end: row ? (row.end || '') : clock(),
      // A row with no end is still running, and editing it must not silently stop it.
      runningState: row ? !row.end : false
    };

    document.getElementById('sTitle').textContent = id ? 'Edit session' : 'Add a session';
    document.getElementById('sDelete').style.display = id ? '' : 'none';
    disarmDelete();
    document.getElementById('sStart').value = editSess.start;
    document.getElementById('sEnd').value = editSess.end || clock();
    paintSessSheet();
    document.getElementById('ssheet').classList.add('on');
    fitSettling();
  }

  function paintSessSheet() {
    var run = editSess.runningState;
    [].forEach.call(document.querySelectorAll('#sSeg button'), function (b) {
      b.classList.toggle('on', (b.getAttribute('data-sstate') === 'running') === run);
    });
    document.getElementById('sEndWrap').style.visibility = run ? 'hidden' : 'visible';
    document.getElementById('sAreas').innerHTML = AREAS.map(function (a) {
      return '<button data-sarea="'+a.slug+'"'+(a.slug===editSess.area?' class="on"':'')+'>'+
             a.ic+' '+a.label+'</button>';
    }).join('');
    paintSessDur();
  }

  /**
   * How long the session is, shown live, so a wrong time is obvious before it is
   * saved rather than after.
   *
   * The important case is a reversed pair. `spanMin` wraps past midnight, so
   * 09:00 to 08:00 is not an error to it, it is 23 hours, and 23 hours of UCW
   * would quietly wreck the day's totals. A genuine session can cross midnight,
   * so the test is length, not order: anything over twelve hours is a typo, and
   * Save is refused until it is fixed.
   */
  function sessProblem(st, en, run) {
    if (!st) return 'Needs a start time.';
    if (run) {
      // A running session whose start is in the future is a mis-spun wheel, not a
      // 23-hour session. Without this, setting 16:00 at 15:00 banked 23 hours.
      if (toMin(st) > nowMin() && sinceToday(st) > 12*60) return 'That start is in the future.';
      return '';
    }
    if (!en) return 'Needs an end time.';
    // Only a genuine reversal is refused. A thirteen-hour day is real work and
    // must stay editable, so the test is direction first, then length.
    if (toMin(en) < toMin(st) && spanMin(st, en) > 12*60) return 'Ends before it starts.';
    return '';
  }

  function nowMin() { var d = new Date(); return d.getHours()*60 + d.getMinutes(); }

  /** Anything already on the list that covers the same clock time. */
  function overlapWith(st, en, ignoreId) {
    var a1 = wdMin(st), a2 = en ? wdMin(en) : wdMin(clock());
    if (a2 < a1) a2 += 24*60;
    var hit = null;
    sessionRows().forEach(function (r) {
      if (r.id === ignoreId || hit) return;
      var b1 = wdMin(r.start), b2 = r.end ? wdMin(r.end) : wdMin(clock());
      if (b2 < b1) b2 += 24*60;
      if (a1 < b2 && b1 < a2) hit = r;
    });
    return hit;
  }

  function paintSessDur() {
    var st = document.getElementById('sStart').value;
    var en = document.getElementById('sEnd').value;
    var run = editSess.runningState;
    var el = document.getElementById('sDur');
    var save = document.getElementById('sSave');
    var bad = sessProblem(st, en, run);

    save.disabled = !!bad;
    save.style.opacity = bad ? '.4' : '';
    el.classList.toggle('bad', !!bad);

    if (bad) { el.textContent = bad; return; }

    /* An overlap is not refused, because a correction in progress can legitimately
       overlap for a moment. It is named, because two rows covering the same hour
       count that hour twice and nothing else on the screen would say so. */
    var clash = overlapWith(st, run ? null : en, editSess.id);
    var warn = clash ? ' · overlaps ' + ((state && state.areas && state.areas[clash.area]) || clash.area) +
                       ' ' + clash.start + '–' + (clash.end || 'now') : '';
    el.classList.toggle('warn', !!clash);

    if (run) { el.textContent = hm(sinceToday(st)) + ' so far, still running' + warn; return; }
    var mins = spanMin(st, en);
    el.textContent = hm(mins) +
      (mins === 0 ? ' · that is zero minutes' : '') +
      (toMin(en) < toMin(st) ? ' · crosses midnight' : '') + warn;
  }

  function closeSessEditor() {
    editSess = null;
    document.getElementById('ssheet').classList.remove('on');
    fitSettling();
    render();
  }

  function saveSessEditor() {
    if (!editSess) return;
    var st = document.getElementById('sStart').value;
    var run = editSess.runningState;
    var en = run ? null : document.getElementById('sEnd').value;
    // The same test the duration line shows him. Nothing gets past both.
    if (sessProblem(st, en, run)) { paintSessDur(); return; }
    var area = editSess.area;
    var was = editSess.was;
    local.edits = local.edits || {};

    if (editSess.isNew) {
      // Work done away from the phone. It goes in as a local segment like any
      // other, with its own id, and Claude hears about it as an explicit event.
      var seg = { id:nextSessId(), start:st, end:en, area:area };
      if (run) {
        if (running()) doStop(true, st);
        local.open = { id:seg.id, start:st, area:area };
      } else {
        local.segments.push(seg);
      }
      emit('session_add', { start:st, end:en, area:area });
    } else {
      emit('session_edit', { was:was, now:{ start:st, end:en, area:area } });
      var wasRunning = was && !was.end;
      var isFiled = String(editSess.id).charAt(0) === 'f';
      var openIsThis = local.open && local.open.id === editSess.id;

      if (isFiled) {
        // A filed row belongs to the Mac, so the correction is recorded beside it.
        local.edits[editSess.id] = { start:st, end:en, area:area };
        if (wasRunning && !run) local.filedEnd = en;
      } else {
        // A local row is ours to change outright, which is why it never goes into
        // local.edits: a stale edit there once un-stopped a finished session.
        if (local.edits) delete local.edits[editSess.id];
        var seg = (local.segments||[]).filter(function (x) { return x.id === editSess.id; })[0];
        if (seg) { seg.start = st; seg.end = en; seg.area = area; }
        if (openIsThis) { local.open.start = st; local.open.area = area; }
      }

      // Exactly one session runs at a time, before and after this save.
      if (wasRunning && !run && openIsThis) {
        local.segments.push({ id:editSess.id, start:st, end:en, area:area });
        local.open = null;
      }
      if (!wasRunning && run) {
        // Close whatever is running AT THIS SESSION'S START, not at the clock. The
        // old code closed it at "now", so re-opening a 09:00 session at 15:00 left
        // an hour sitting inside both rows.
        if (running()) doStop(true, st);
        local.segments = (local.segments||[]).filter(function (x) { return x.id !== editSess.id; });
        // A filed row hidden as deleted cannot lend its id to the replacement:
        // the replacement inherits the deletion and vanishes with it.
        var newId = isFiled ? nextSessId() : editSess.id;
        if (isFiled) local.edits[editSess.id] = 'deleted';
        local.open = { id:newId, start:st, area:area };
      }
    }
    local.date = todayISO(); save(LOCAL_KEY, local);
    closeSessEditor(); flush();
  }

  function deleteSessEditor() {
    if (!editSess || editSess.isNew) return;
    var id = editSess.id, was = editSess.was;
    local.edits = local.edits || {};
    local.edits[id] = 'deleted';
    emit('session_delete', { start:was&&was.start, end:was&&was.end, area:was&&was.area });
    if (local.open && local.open.id === id) local.open = null;
    local.segments = (local.segments||[]).filter(function (x) { return x.id !== id; });
    if (was && !was.end && String(id).charAt(0) === 'f') local.filedEnd = was.start;
    local.date = todayISO(); save(LOCAL_KEY, local);
    closeSessEditor(); flush();
  }

  document.getElementById('sCancel').addEventListener('click', closeSessEditor);
  document.getElementById('sSave').addEventListener('click', saveSessEditor);
  ['sStart','sEnd'].forEach(function (id) {
    var el = document.getElementById(id);
    el.addEventListener('input', paintSessDur);
    // The iOS time wheel resizes the visible area exactly like the keyboard does.
    el.addEventListener('focus', fitSettling);
    el.addEventListener('blur', fitSettling);
  });
  document.getElementById('sSeg').addEventListener('click', function (e) {
    var b = e.target.closest('[data-sstate]'); if (!b || !editSess) return;
    editSess.runningState = b.getAttribute('data-sstate') === 'running';
    paintSessSheet();
  });
  document.getElementById('sAreas').addEventListener('click', function (e) {
    var b = e.target.closest('[data-sarea]'); if (!b || !editSess) return;
    editSess.area = b.getAttribute('data-sarea');
    paintSessSheet();
  });
  /* Delete asks once. A mis-tap here loses real work, and there is no undo for it. */
  var armTimer = null;
  function disarmDelete() {
    if (armTimer) { clearTimeout(armTimer); armTimer = null; }
    var b = document.getElementById('sDelete');
    b.classList.remove('arm'); b.textContent = 'Delete this session';
  }
  document.getElementById('sDelete').addEventListener('click', function () {
    var b = this;
    if (!b.classList.contains('arm')) {
      // The timer is held so that arming one row cannot disarm the next one he
      // opens four seconds later, which made clearing several rows unreliable.
      b.classList.add('arm'); b.textContent = 'Tap again to delete';
      if (armTimer) clearTimeout(armTimer);
      armTimer = setTimeout(disarmDelete, 4000);
      return;
    }
    disarmDelete();
    deleteSessEditor();
  });

  /* --------------------------------------------------------------- the nudge
   * The switch only tells the server. Everything else happens off this phone.
   *
   * An earlier build did it here: a timer in the page, a chime, and an inaudible
   * tone playing the whole time to stop iOS suspending the page. It worked and it
   * was the wrong answer. A web page on the Home Screen cannot ask iOS to hold a
   * schedule for it, so staying awake was the only way, and staying awake costs
   * battery all day for a reminder that lasts a second.
   *
   * Apps Script holds the schedule now and sends through ntfy every 15 minutes.
   * This phone does nothing between reminders and can be closed.
   *
   * The local copy is only so the switch answers the moment it is tapped. The
   * server's answer replaces it on the next poll, unless a tap is still in flight.
   */
  var nudgeSending = false;

  function nudgeOn() { var l = load(NUDGE_KEY, null); return !!(l && l.on); }
  var nudgeErr = '';
  function nudgeStatusLine() {
    if (nudgeOn() && nudgeErr) return '⚠️ Not sending. ' + nudgeErr;
    return nudgeOn() ? 'On · sent to your ntfy app, even when this is closed'
                     : 'A reminder every 15 minutes, until you switch it off';
  }

  function toggleNudge() {
    var want = !nudgeOn();
    save(NUDGE_KEY, { on: want });
    nudgeSending = true;
    post({ action:'nudge_set', on: want })
      .then(function (d) { if (d && d.ok) save(NUDGE_KEY, { on: !!d.on }); })
      .catch(function () {})       // the next poll will straighten it out
      .then(function () { nudgeSending = false; render(); });
  }

  /* iOS fires visualViewport.scroll continuously while the keyboard animates, and
     writing body.style.height can itself move the visual viewport, so the handler
     could feed itself. One write per frame settles it. */
  var fitQueued = false;
  function fitSoon() {
    if (fitQueued) return;
    fitQueued = true;
    requestAnimationFrame(function () { fitQueued = false; fitViewport(); });
  }
  /* The keyboard and the iOS time wheel both animate for about a third of a
     second, and every height reported during that animation is wrong. Measuring
     once is what left the tab bar stranded in mid-screen, so every open and every
     close re-measures until it has settled. */
  function fitSettling() {
    fitViewport();
    [80, 250, 500, 900].forEach(function (ms) { setTimeout(fitViewport, ms); });
  }

  function fitViewport() {
    var vv = window.visualViewport;
    var h = (vv ? Math.round(vv.height) : 0) || window.innerHeight;
    // offsetTop is how far iOS has scrolled the visible area down inside the
    // page to keep the caret above the keyboard. A fixed element that ignores it
    // stays behind, which is why the tab bar ended up stranded in mid-screen.
    var top = vv ? Math.round(vv.offsetTop) : 0;
    document.body.style.top = top + 'px';
    document.body.style.bottom = 'auto';
    document.body.style.height = h + 'px';
    ['esheet','ssheet'].forEach(function (id) {
      var sh = document.getElementById(id);
      if (sh) { sh.style.top = top + 'px'; sh.style.height = h + 'px'; }
    });
  }
  function envBottom() {
    var d = document.createElement('div');
    d.style.cssText = 'position:fixed;visibility:hidden;height:env(safe-area-inset-bottom)';
    document.body.appendChild(d);
    var v = parseFloat(getComputedStyle(d).height) || 0;
    d.remove();
    return Math.round(v);
  }
  function geom() {
    var nav = document.querySelector('nav');
    var nb = nav ? Math.round(nav.getBoundingClientRect().bottom) : -1;
    var vv = window.visualViewport ? Math.round(visualViewport.height) : -1;
    return 'ih' + window.innerHeight + ' vv' + vv + ' sh' + screen.height +
           ' sab' + envBottom() + ' navB' + nb + ' gap' + (window.innerHeight - nb) +
           ' std' + (navigator.standalone ? 1 : 0);
  }

  /* ---------- self-update ----------
   * A Home Screen app has no address bar and no reload button, and GitHub Pages
   * serves this file with max-age=600, so a published fix can sit unseen on the
   * phone for a long time. Three layout fixes shipped on 2026-08-17 and none of
   * them reached the phone, which is what this exists to prevent. The page fetches
   * its own URL with cache:'no-store', reads the BUILD string out of the response,
   * and reloads itself when the server is running something newer. Never while a
   * recording is in progress: that would drop the audio mid-hold.
   */
  var updating = false, saving = false;
  function checkForUpdate() {
    /* `holding` goes false the instant he lets go, but the audio is not saved for
       hundreds of milliseconds after that: onstop, then the FileReader, then the
       localStorage write. A reload inside that window destroys the clip with no
       trace, which is the exact failure the save-before-send rule exists to
       prevent. `saving` stays true until the note is on disk. */
    if (updating || holding || saving || editNote || editSess) return;
    updating = true;
    fetch(location.pathname + '?v=' + Date.now(), { cache:'no-store' })
      .then(function (r) { return r.ok ? r.text() : null; })
      .then(function (html) {
        if (!html) return;
        var m = html.match(/var BUILD = '([^']+)'/);
        if (!m || m[1] === BUILD) return;
        /* location.reload() is allowed to come back out of the HTTP cache, and with
           max-age=600 on Pages it often did. Paired with the attempt guard below
           that pinned the phone to a stale build for good: it recorded the target
           as tried, reloaded, got the cached old copy back, and then refused to
           retry. Navigating to a URL carrying the build number instead is a URL the
           cache has never seen, so the fetch is always fresh. The hash carries the
           deployment id and token and must survive. */
        var target = m[1];
        var tries = 0;
        try { tries = parseInt(sessionStorage.getItem('myday_reload_' + target) || '0', 10); } catch (e) {}
        if (tries >= 2) return;                 // give up rather than loop on a stuck edge
        try { sessionStorage.setItem('myday_reload_' + target, tries + 1); } catch (e) {}
        location.replace(location.pathname + '?b=' + encodeURIComponent(target) + location.hash);
      })
      .catch(function () {})
      .then(function () { updating = false; });
  }

  if (!cfg) {
    document.querySelector('main').innerHTML =
      '<div class="card diag"><div class="r"><span class="s">⚪️</span><div class="t">'+
      '<b>Not linked yet</b><span>Open the console link ending in <code>#d=…&amp;k=…</code> and keep '+
      'the whole fragment in the address bar when you add it to the Home Screen. If you just did '+
      'and still see this, you are in a Private tab, which cannot save anything.</span></div></div></div>';
    document.querySelector('nav').style.display = 'none';
  } else {
    bindRecorder();                 // once, on the static button
    fitViewport();
    window.addEventListener('resize', fitViewport);
    window.addEventListener('orientationchange', fitViewport);
    if (window.visualViewport) {
      visualViewport.addEventListener('resize', fitSoon);
      visualViewport.addEventListener('scroll', fitSoon);
    }
    render();                       // cached state paints before any network call
    refresh(); refreshNotes(); flush();
    checkForUpdate();
    setInterval(function(){ refresh(); refreshNotes(); flush(); checkForUpdate(); }, POLL_MS);
    setInterval(function(){ if (running()) render(); }, 30000);   // live timer
    // Only the number is rewritten. Redrawing the whole page once a second would
    // fight the swipe gestures, the area picker and the editor sheet, which is the
    // same mistake that used to tear the note editor out mid-sentence.
    setInterval(function () {
      var el = document.getElementById('elapsed');
      if (el) el.textContent = hms(secSince(el.getAttribute('data-start')));
    }, 1000);

    /* c22 registered a service worker so the page could raise its own
       notification. c23 sends from the server instead, so it has no job left.
       Unregister it rather than leave it installed on phones that already took
       it: a worker nobody maintains is the kind of thing that strands a build. */
    if (navigator.serviceWorker) {
      navigator.serviceWorker.getRegistrations()
        .then(function (rs) { rs.forEach(function (r) { r.unregister(); }); })
        .catch(function () {});
    }
    window.addEventListener('online', function(){ refresh(); flush(); });
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) { holding=false; releaseMic(); }
      else { fitViewport(); refresh(); refreshNotes(); flush(); checkForUpdate(); }
    });
  }
})();
</script>
</body>
</html>
