<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>myday</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="myday">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">

<!--
  myday console: the visual half of a_myday.

  READS a state blob that Claude publishes from the Mac (tasks, today's sessions,
  focus balance). WRITES only events: "I started ucw", "I stopped", "I ticked X".
  It never edits tasks/ or days/. That is Claude's job at the Mac, and keeping
  that boundary is what makes the markdown trustworthy.

  Renders from localStorage first and refreshes in the background, so opening the
  app is instant on bad signal and works with none. Events are saved to
  localStorage BEFORE any network call and removed only once the server confirms:
  the same save-before-send ordering the capture app learned the hard way on
  2026-08-11.
-->

<style>
  :root {
    --bg:#f2f2f7; --surface:#fff; --fg:#000; --dim:#8a8a8e; --faint:#c7c7cc;
    --line:rgba(60,60,67,.10);
    --go:#34c759; --stop:#ff3b30; --warn:#ff9500; --accent:#007aff;
    --acad:#5e5ce6; --dog:#ff9500; --ai:#32ade6;
    --shadow:0 1px 2px rgba(0,0,0,.04), 0 6px 20px rgba(0,0,0,.05);
    --ring-track:rgba(120,120,128,.14);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#000; --surface:#1c1c1e; --fg:#fff; --dim:#98989d; --faint:#48484a;
      --line:rgba(84,84,88,.5);
      --go:#30d158; --stop:#ff453a; --warn:#ff9f0a; --accent:#0a84ff;
      --acad:#7d7aff; --dog:#ff9f0a; --ai:#64d2ff;
      --shadow:none;
      --ring-track:rgba(120,120,128,.22);
    }
  }

  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { -webkit-text-size-adjust:100%; text-size-adjust:100%; }
  html,body { margin:0; padding:0; }
  body {
    background:var(--bg); color:var(--fg);
    font:17px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
    -webkit-user-select:none; user-select:none;
    overscroll-behavior-y:none;
    padding-top:env(safe-area-inset-top);
  }
  button { font-family:inherit; touch-action:manipulation; }

  /* ---------------------------------------------------------------- header */
  header {
    position:sticky; top:0; z-index:20;
    padding:calc(env(safe-area-inset-top) + 6px) 20px 10px;
    margin-top:calc(-1 * env(safe-area-inset-top));
    background:color-mix(in srgb, var(--bg) 82%, transparent);
    -webkit-backdrop-filter:saturate(180%) blur(20px);
    backdrop-filter:saturate(180%) blur(20px);
    border-bottom:.5px solid var(--line);
  }
  .htop { display:flex; align-items:center; gap:9px; }
  header h1 { font-size:26px; font-weight:700; margin:0; letter-spacing:-.03em; }
  header .date { color:var(--dim); font-size:14px; font-weight:500; margin-left:auto; }
  .status { display:flex; align-items:center; gap:5px; font-size:11.5px; color:var(--dim); margin-top:3px; }
  .status .led { width:6px; height:6px; border-radius:50%; background:var(--go); flex:none; }
  .status.bad .led { background:var(--stop); }
  .status.warn .led { background:var(--warn); }

  main { padding:4px 20px 108px; max-width:640px; margin:0 auto; }
  section { display:none; animation:fade .22s ease both; }
  section.on { display:block; }
  @keyframes fade { from { opacity:0; transform:translateY(6px);} to { opacity:1; transform:none; } }

  /* ------------------------------------------------------------------- nav */
  nav {
    position:fixed; left:0; right:0; bottom:0; z-index:30;
    display:flex; align-items:stretch;
    background:color-mix(in srgb, var(--bg) 80%, transparent);
    -webkit-backdrop-filter:saturate(180%) blur(20px);
    backdrop-filter:saturate(180%) blur(20px);
    border-top:.5px solid var(--line);
    padding-bottom:max(env(safe-area-inset-bottom), 6px);
  }
  /* Fixed minimums: an earlier build let these collapse on iOS until they were
     too small to hit. Never make the tap target smaller than 56px. */
  nav button {
    flex:1 1 0; min-height:56px; border:0; background:none; color:var(--dim);
    font-size:11px; font-weight:600; line-height:1.1;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    padding:8px 4px;
  }
  nav button .ic { font-size:23px; line-height:1; font-weight:400; }
  nav button.on { color:var(--accent); }
  nav button:active { opacity:.55; }

  /* ----------------------------------------------------------------- cards */
  .card {
    background:var(--surface); border-radius:18px; padding:18px;
    box-shadow:var(--shadow); margin-bottom:14px;
  }
  h2 {
    font-size:13px; font-weight:600; letter-spacing:-.01em;
    color:var(--dim); margin:24px 4px 10px; text-transform:none;
  }

  /* ------------------------------------------------------------------ ring */
  .ringwrap { display:flex; align-items:center; gap:16px; }
  .ring { width:142px; height:142px; flex:none; position:relative; }
  .ring svg { transform:rotate(-90deg); display:block; }
  .ring .mid {
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
  }
  .ring .mid .v { font-size:23px; font-weight:700; letter-spacing:-.04em; font-variant-numeric:tabular-nums; }
  .ring .mid .l { font-size:10px; color:var(--dim); font-weight:500; margin-top:1px;
                 max-width:88px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ring.live .mid .v { color:var(--go); }

  .legend { flex:1; min-width:0; display:flex; flex-direction:column; gap:11px; }
  .legend .row { display:flex; align-items:center; gap:9px; }
  .legend .sw { width:9px; height:9px; border-radius:3px; flex:none; }
  .legend .nm { font-size:14px; font-weight:500; flex:1; }
  .legend .vl { font-size:14px; font-weight:600; font-variant-numeric:tabular-nums; }
  .legend .row.zero .nm, .legend .row.zero .vl { color:var(--dim); }

  .verdict { margin-top:16px; padding-top:14px; border-top:.5px solid var(--line);
             font-size:13.5px; line-height:1.5; color:var(--dim); }
  .verdict b { color:var(--fg); font-weight:600; }

  /* ---------------------------------------------------------------- timer */
  .running {
    display:flex; align-items:center; gap:13px; margin-bottom:14px;
    background:var(--surface); border-radius:18px; padding:16px 18px; box-shadow:var(--shadow);
    border-left:4px solid var(--go);
  }
  .running .dot { width:9px; height:9px; border-radius:50%; background:var(--go); flex:none;
               animation:pulse 2.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1; transform:scale(1)} 50%{opacity:.3; transform:scale(.82)} }
  .running .txt { flex:1; min-width:0; }
  .running .txt b { display:block; font-size:16px; font-weight:600; letter-spacing:-.01em; }
  .running .txt span { font-size:12.5px; color:var(--dim); }
  .running .el { font-size:22px; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:-.03em; }

  button.primary {
    width:100%; border:0; border-radius:16px; padding:17px;
    font-size:17px; font-weight:600; color:#fff; letter-spacing:-.01em;
    display:flex; align-items:center; justify-content:center; gap:8px;
    transition:transform .12s ease, opacity .12s ease;
  }
  button.primary:active { transform:scale(.975); opacity:.85; }
  button.primary.stop { background:var(--stop); }

  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .grid button {
    background:var(--surface); border:0; border-radius:16px; color:var(--fg);
    padding:15px 6px 13px; box-shadow:var(--shadow);
    display:flex; flex-direction:column; align-items:center; gap:7px;
    font-size:13px; font-weight:600; min-height:82px;
    transition:transform .12s ease;
  }
  .grid button:active { transform:scale(.95); }
  .grid button .ic { font-size:25px; line-height:1; }

  /* -------------------------------------------------------------- sessions */
  .sess { display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:.5px solid var(--line); }
  .sess:last-child { border-bottom:0; padding-bottom:0; }
  .sess:first-child { padding-top:0; }
  .sess .ic { font-size:19px; width:26px; text-align:center; flex:none; }
  .sess .b { flex:1; min-width:0; }
  .sess .b b { font-size:15px; font-weight:500; display:block; }
  .sess .b span { font-size:12.5px; color:var(--dim); font-variant-numeric:tabular-nums; }
  .sess .d { font-size:15px; font-weight:600; font-variant-numeric:tabular-nums; }
  .sess.open .d { color:var(--go); }

  /* ----------------------------------------------------------------- tasks */
  .chips { display:flex; gap:8px; overflow-x:auto; padding:4px 20px 10px; margin:0 -20px;
           scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chips button {
    border:0; background:var(--surface); color:var(--dim); white-space:nowrap;
    border-radius:999px; padding:8px 15px; font-size:14px; font-weight:600;
    box-shadow:var(--shadow); flex:none;
  }
  .chips button.on { background:var(--fg); color:var(--bg); }
  .chips button .ct { opacity:.5; margin-left:4px; font-weight:500; }

  .grp { margin-bottom:22px; }
  .grp .hd { display:flex; align-items:baseline; gap:8px; margin:0 4px 8px; }
  .grp .hd b { font-size:15px; font-weight:600; letter-spacing:-.01em; }
  .grp .hd span { font-size:13px; color:var(--dim); }
  .grp .body { background:var(--surface); border-radius:18px; box-shadow:var(--shadow); overflow:hidden; }

  .task { display:flex; gap:13px; align-items:flex-start; padding:14px 16px;
          border-bottom:.5px solid var(--line); transition:background .12s ease; }
  .task:last-child { border-bottom:0; }
  .task:active { background:var(--bg); }
  .task .box {
    width:23px; height:23px; border:2px solid var(--faint); border-radius:7px; flex:none; margin-top:1px;
    display:flex; align-items:center; justify-content:center; font-size:14px; color:#fff;
    transition:background .15s ease, border-color .15s ease;
  }
  .task.on .box { background:var(--go); border-color:var(--go); }
  .task.on .tt { text-decoration:line-through; color:var(--dim); }
  .task .c { flex:1; min-width:0; }
  .task .tt { font-size:15.5px; line-height:1.35; }
  .task .mt { font-size:12.5px; color:var(--dim); margin-top:4px; display:flex; gap:9px; flex-wrap:wrap;
              align-items:center; }
  .task .mt .od { color:var(--stop); font-weight:600; }

  /* -------------------------------------------------------------- diagnose */
  .diag { font-size:14px; }
  .diag .r { display:flex; gap:11px; padding:11px 0; border-bottom:.5px solid var(--line); align-items:flex-start; }
  .diag .r:last-child { border-bottom:0; padding-bottom:0; }
  .diag .r .s { font-size:15px; width:20px; flex:none; text-align:center; }
  .diag .r .t { flex:1; }
  .diag .r .t b { display:block; font-weight:600; font-size:14.5px; }
  .diag .r .t span { color:var(--dim); font-size:13px; line-height:1.45; display:block; margin-top:2px; }
  code { font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
         background:var(--bg); padding:2px 6px; border-radius:5px;
         display:inline-block; max-width:100%; overflow-wrap:anywhere; margin-top:3px; }
  .hint { color:var(--dim); font-size:13.5px; line-height:1.55; text-align:center; padding:26px 10px; }
  .hint b { color:var(--fg); }
  .foot { text-align:center; color:var(--faint); font-size:11px; padding:6px 0 2px; }
</style>
</head>

<body>

<header>
  <div class="htop">
    <h1 id="hTitle">Today</h1>
    <span class="date" id="hDate"></span>
  </div>
  <div class="status" id="hStatus"><span class="led"></span><span id="hStatusT">starting…</span></div>
</header>

<main>
  <section id="s-today" class="on"></section>
  <section id="s-tasks"></section>
</main>

<nav>
  <button data-go="today" class="on"><span class="ic">◍</span>Today</button>
  <button data-go="tasks"><span class="ic">☑</span>Tasks</button>
</nav>

<script>
(function () {
  'use strict';

  var BUILD = 'c2 · 2026-08-14';

  // Shared with the capture app on purpose: same origin, same endpoint, same
  // token. Linking one in Safari links the other.
  var CFG_KEY   = 'myday_cfg';
  var STATE_KEY = 'myday_state';
  var QUEUE_KEY = 'myday_evq';    // events saved before sending, never after
  var LOCAL_KEY = 'myday_local';  // optimistic session, until a publish confirms

  var POLL_MS = 20000;

  var AREAS = [
    { slug:'ucw',      label:'UCW',      ic:'🎓' },
    { slug:'ai',       label:'AI',       ic:'🤖' },
    { slug:'dog',      label:'Dog',      ic:'🐕' },
    { slug:'research', label:'Research', ic:'🔬' },
    { slug:'personal', label:'Personal', ic:'🏠' },
    { slug:'overhead', label:'Overhead', ic:'🚚' }
  ];
  var AREA_IC = {}; AREAS.forEach(function (a) { AREA_IC[a.slug] = a.ic; });
  var BUCKET_OF = { ucw:'academia', research:'academia', dog:'dog', ai:'ai' };
  var BUCKETS = [
    { k:'academia', n:'Academia', c:'var(--acad)' },
    { k:'dog',      n:'Dog',      c:'var(--dog)'  },
    { k:'ai',       n:'AI',       c:'var(--ai)'   }
  ];

  var cfg=null, state=null, local=null, queue=[], tab='today', filter='all';
  // Why the screen looks the way it does, so "it is empty" is never a mystery.
  var health = { net:null, err:'', lastTry:'' };

  // ---------------------------------------------------------------- storage
  function load(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

  // Endpoint and token arrive once in the URL fragment, which is never sent to
  // any server. Keep the fragment in the address bar: iOS gives a Home Screen
  // web app its own storage, so the saved bookmark must still carry the config.
  function readConfig() {
    var h = location.hash.replace(/^#/, '');
    if (h) {
      var p = {};
      h.split('&').forEach(function (kv) {
        var i = kv.indexOf('=');
        if (i > 0) p[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1));
      });
      var url = p.e || (p.d ? 'https://script.google.com/macros/s/' + p.d + '/exec' : '');
      if (url && p.k) { var c = { url:url, token:p.k }; save(CFG_KEY, c); return c; }
    }
    return load(CFG_KEY, null);
  }

  // ---------------------------------------------------------------- helpers
  function esc(t) {
    return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) {
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c];
    });
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function stamp() {
    var d = new Date();
    return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+
           pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
  }
  function hm(m) {
    if (m == null) return '—';
    m = Math.max(0, Math.round(m));
    return Math.floor(m/60)+'h'+pad(m%60)+'m';
  }
  function todayISO() { var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }

  /** Minutes from an "HH:MM" earlier today until now. */
  function sinceToday(hhmm) {
    var m = /^(\d{1,2}):(\d{2})$/.exec(hhmm || '');
    if (!m) return 0;
    var now = new Date(), then = new Date(now);
    then.setHours(+m[1], +m[2], 0, 0);
    // A start that looks like the future is really yesterday's: Amir's day rolls
    // over at 05:00, not midnight (CLAUDE.md).
    if (then > now) then.setDate(then.getDate() - 1);
    return Math.floor((now - then) / 60000);
  }

  // ---------------------------------------------------------------- network
  function get(action, params) {
    var q = 'action='+action+'&token='+encodeURIComponent(cfg.token);
    for (var k in params) q += '&'+k+'='+encodeURIComponent(params[k]);
    return fetch(cfg.url+'?'+q, { method:'GET' }).then(function (r) { return r.json(); });
  }
  function post(body) {
    var b = { token: cfg.token };
    for (var k in body) b[k] = body[k];
    return fetch(cfg.url, {
      method:'POST',
      // text/plain keeps this a "simple" request, so the browser skips the CORS
      // preflight that Apps Script cannot answer.
      headers:{ 'Content-Type':'text/plain' },
      body: JSON.stringify(b)
    }).then(function (r) { return r.json(); });
  }

  // ----------------------------------------------------------------- events
  // Save first, then send. A queued event survives a dead network, a reload and
  // a force-quit; it leaves the queue only when the server has confirmed it.

  function emit(kind, payload) {
    var ev = {
      qid: 'e'+Date.now()+'-'+Math.random().toString(36).slice(2,8),
      kind: kind, payload: payload || {}, client_ts: stamp()
    };
    queue.push(ev); save(QUEUE_KEY, queue);
    applyLocally(ev);
    render(); flush();
  }

  var flushing = false;
  function flush() {
    if (flushing || !queue.length || !cfg) return;
    flushing = true;
    var ev = queue[0];
    post({ action:'event', kind:ev.kind, payload:ev.payload, client_ts:ev.client_ts, qid:ev.qid })
      .then(function (r) {
        if (r && r.ok) { queue.shift(); save(QUEUE_KEY, queue); health.net = true; }
        else if (r && r.error) { health.net = false; health.err = r.error; }
      })
      .catch(function (e) { health.net = false; health.err = String(e && e.message || e); })
      .then(function () {
        flushing = false; render();
        if (queue.length) setTimeout(flush, 1500);
      });
  }

  /**
   * Optimistic local view. The phone cannot edit the markdown, so until Claude
   * publishes again this is what makes a tap feel like it did something.
   */
  function applyLocally(ev) {
    if (ev.kind === 'session_start') {
      local.open = { start: ev.client_ts.slice(11,16), area: ev.payload.area };
      local.stopped = null;
    } else if (ev.kind === 'session_stop') {
      if (local.open) {
        local.closed = (local.closed||0) + sinceToday(local.open.start);
        local.open = null;
      } else {
        // Stopping a session that came from the Mac's last publish. Claude has
        // not filed it yet, so remember which one was stopped and keep its
        // minutes, or the total would drop back the moment it disappears.
        var pub = state && state.today && state.today.open_session;
        if (pub) {
          local.stopped = { start: pub.start };
          local.closed = (local.closed||0) + sinceToday(pub.start);
        }
      }
    } else if (ev.kind === 'task_tick') {
      local.ticked = local.ticked || {};
      local.ticked[ev.payload.id] = true;
    }
    local.date = todayISO();
    save(LOCAL_KEY, local);
  }

  // ------------------------------------------------------------------- sync
  function freshLocal() { return { date: todayISO(), open:null, stopped:null, closed:0, ticked:{} }; }

  function refresh() {
    if (!cfg) return;
    health.lastTry = stamp().slice(11,16);
    get('state').then(function (r) {
      if (!r) { health.net = false; health.err = 'no response'; render(); return; }
      if (!r.ok) { health.net = false; health.err = r.error || 'server refused'; render(); return; }
      health.net = true; health.err = '';

      if (!r.state) { state = null; save(STATE_KEY, null); render(); return; }
      var s; try { s = JSON.parse(r.state); } catch (e) { health.err = 'state unreadable'; render(); return; }
      s._updated = r.updated || '';
      state = s; save(STATE_KEY, s);

      // A publish that already knows about a tick makes the optimistic copy
      // redundant; drop those so the two can never disagree.
      if (local && local.ticked && s.tasks) {
        var live = {}; s.tasks.forEach(function (t) { live[t.id] = true; });
        Object.keys(local.ticked).forEach(function (id) { if (!live[id]) delete local.ticked[id]; });
      }
      if (local && local.open && s.today && s.today.open_session) { local.open = null; local.closed = 0; }
      if (local && local.stopped) {
        var still = s.today && s.today.open_session;
        if (!still || still.start !== local.stopped.start) { local.stopped = null; local.closed = 0; }
      }
      if (local && local.date !== todayISO()) local = freshLocal();
      save(LOCAL_KEY, local);
      render();
    }).catch(function (e) {
      health.net = false; health.err = String(e && e.message || e);
      render();   // the cached state stays on screen; only the badge changes
    });
  }

  // ----------------------------------------------------------------- derive
  function openSession() {
    if (local && local.open) return { start:local.open.start, area:local.open.area, local:true };
    var s = state && state.today && state.today.open_session;
    if (!s) return null;
    // Already stopped on the phone, just not yet filed at the Mac.
    if (local && local.stopped && local.stopped.start === s.start) return null;
    return { start:s.start, area:s.area, task:s.task, local:false };
  }
  function workedMinutes() {
    var base = (state && state.today && state.today.closed_minutes) || 0;
    base += (local && local.closed) || 0;
    var o = openSession();
    if (o) base += sinceToday(o.start);
    return base;
  }
  function liveBuckets() {
    var b = (state && state.today && state.today.buckets) || {};
    var out = { academia:b.academia||0, dog:b.dog||0, ai:b.ai||0 };
    var o = openSession();
    if (o && BUCKET_OF[o.area]) out[BUCKET_OF[o.area]] += sinceToday(o.start);
    return out;
  }

  // ----------------------------------------------------------------- render
  function ringSVG(vals, live) {
    var R = 62, SW = 13, C = 2*Math.PI*R, total = vals.academia+vals.dog+vals.ai;
    var h = '<svg width="142" height="142" viewBox="0 0 142 142">';
    h += '<circle cx="71" cy="71" r="'+R+'" fill="none" stroke="var(--ring-track)" stroke-width="'+SW+'"/>';
    if (total > 0) {
      var off = 0;
      BUCKETS.forEach(function (b) {
        var v = vals[b.k]; if (!v) return;
        var len = v/total*C;
        h += '<circle cx="71" cy="71" r="'+R+'" fill="none" stroke="'+b.c+'" stroke-width="'+SW+
             '" stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+
             '" stroke-dashoffset="'+(-off).toFixed(2)+'" stroke-linecap="butt"/>';
        off += len;
      });
    }
    h += '</svg>';
    return '<div class="ring'+(live?' live':'')+'">'+h+'</div>';
  }

  function renderToday() {
    var el = document.getElementById('s-today');

    if (!state) { el.innerHTML = diagnostics(); return; }

    var t = state.today || {}, o = openSession(), mins = workedMinutes();
    var b = liveBuckets(), total = b.academia+b.dog+b.ai;
    var h = '';

    // --- the ring: total worked in the middle, the three-way split as arcs ---
    h += '<div class="card"><div class="ringwrap">';
    h += ringSVG(b, !!o).replace('</div>',
          '<div class="mid"><div class="v">'+hm(mins)+'</div><div class="l">'+
          (t.target && !/not set/i.test(t.target) ? esc(t.target) : 'no target')+'</div></div></div>');
    h += '<div class="legend">';
    BUCKETS.forEach(function (x) {
      h += '<div class="row'+(b[x.k]?'':' zero')+'"><span class="sw" style="background:'+x.c+'"></span>'+
           '<span class="nm">'+x.n+'</span><span class="vl">'+hm(b[x.k])+'</span></div>';
    });
    h += '</div></div>';

    // The blunt line, computed the same way the coach computes it.
    h += '<div class="verdict">'+balanceLine(b, total, o)+'</div>';
    h += '</div>';

    // --- the button that fixes the unclosed-session problem ---
    if (o) {
      h += '<div class="running"><span class="dot"></span><div class="txt">'+
           '<b>'+(AREA_IC[o.area]||'•')+' '+esc((state.areas&&state.areas[o.area])||o.area)+'</b>'+
           '<span>since '+esc(o.start)+(o.local?' · not filed yet':'')+'</span></div>'+
           '<div class="el">'+hm(sinceToday(o.start))+'</div></div>';
      h += '<button class="primary stop" data-act="stop">Stop work</button>';
    } else {
      h += '<h2>Start working on</h2><div class="grid">';
      AREAS.forEach(function (a) {
        h += '<button data-start="'+a.slug+'"><span class="ic">'+a.ic+'</span>'+a.label+'</button>';
      });
      h += '</div>';
    }

    if (t.overhead_minutes) {
      h += '<div class="verdict" style="padding:14px 4px 0">🚚 <b>'+hm(t.overhead_minutes)+
           '</b> overhead. Counts as work, not toward the split.</div>';
    }

    var ss = (t.sessions||[]).slice().reverse();
    if (ss.length) {
      h += '<h2>Sessions</h2><div class="card" style="padding:16px 18px">';
      ss.forEach(function (s) {
        // A session stopped on the phone but not yet filed must not still read
        // as running here while the ring above says it ended.
        var pendingStop = s.open && local && local.stopped && local.stopped.start === s.start;
        var stillOpen = s.open && !pendingStop;
        h += '<div class="sess'+(stillOpen?' open':'')+'"><span class="ic">'+(AREA_IC[s.area]||'•')+'</span>'+
             '<div class="b"><b dir="auto">'+esc(s.task||s.area)+'</b><span>'+esc(s.start)+' → '+
             (s.end?esc(s.end):(pendingStop?'stopped, filing':'now'))+'</span></div>'+
             '<div class="d">'+(s.minutes!=null?hm(s.minutes):hm(sinceToday(s.start)))+'</div></div>';
      });
      h += '</div>';
    }

    h += '<div class="foot">'+BUILD+' · published '+esc(state._updated||'?')+'</div>';
    el.innerHTML = h;
  }

  /** The ⚖️ coaching line, on the phone, without waiting for a chat. */
  function balanceLine(b, total, open) {
    if (!total) return 'No focused work logged yet today.';
    var arr = BUCKETS.map(function (x) { return { n:x.n, v:b[x.k] }; })
                     .sort(function (p, q) { return q.v - p.v; });
    var lead = arr[0], last = arr[2], gap = lead.v - last.v;
    var even = Math.round(total/3);
    if (gap < 30) return 'Evenly split, about <b>'+hm(even)+'</b> each. Keep it there.';
    if (last.v === 0) return '<b>'+last.n+' is at zero.</b> '+lead.n+' has '+hm(lead.v)+
                             '. An even finish needs '+hm(even)+' in each.';
    return '<b>'+lead.n+' leads '+last.n+' by '+hm(gap)+'.</b> Even would be '+hm(even)+' each'+
           (open ? ' — you are on '+ (open.area||'') +' right now.' : '.');
  }

  /**
   * Shown instead of a blank screen. An empty console has exactly three causes
   * and this says which one it is, so it never has to be guessed at again.
   */
  function diagnostics() {
    var deployed = !(health.err && /unknown action/i.test(health.err));
    var rows = [
      { ok: health.net === true, t:'Connection to the sheet',
        s: health.net === true ? 'Reached the endpoint at '+esc(health.lastTry)
         : health.net === false ? 'Failed: '+esc(health.err||'no network')
         : 'Checking…' },
      { ok: health.net === true && deployed, t:'Console endpoints deployed',
        s: health.net !== true ? 'Cannot tell until the connection works'
         : deployed ? 'Server answers the state call'
         : 'The Apps Script still runs the old code. Redeploy it: Extensions → Apps Script, paste Code.gs, then Deploy → Manage deployments → pencil → Version: New version.' },
      { ok:false, t:'First publish from the Mac',
        s:'Nothing published yet. At the Mac, run <code>python3 scripts/myday_console.py publish</code>.' }
    ];
    var h = '<div class="card diag">';
    rows.forEach(function (r) {
      h += '<div class="r"><span class="s">'+(r.ok?'✅':'⚪️')+'</span><div class="t"><b>'+r.t+'</b><span>'+r.s+'</span></div></div>';
    });
    h += '</div><div class="hint">This screen fills in the moment the Mac publishes.<br>Nothing is lost in the meantime.</div>';
    h += '<div class="foot">'+BUILD+'</div>';
    return h;
  }

  function renderTasks() {
    var el = document.getElementById('s-tasks');
    if (!state) { el.innerHTML = diagnostics(); return; }

    var ticked = (local && local.ticked) || {};
    var all = (state.tasks||[]).slice();
    function match(f, t) {
      if (f === 'all')     return t.when !== 'future';
      if (f === 'overdue') return t.when === 'overdue';
      if (f === 'today')   return t.when === 'today';
      if (f === 'nodate')  return !t.due;
      if (f === 'later')   return t.when === 'future';
      return t.area === f;
    }
    var view = all.filter(function (t) { return match(filter, t); });

    var defs = [['all','All'],['overdue','Overdue'],['today','Today'],['nodate','No date'],['later','Later']]
      .concat(AREAS.filter(function (a) { return a.slug !== 'overhead'; })
                   .map(function (a) { return [a.slug, a.ic+' '+a.label]; }));

    var h = '<div class="chips">';
    defs.forEach(function (f) {
      var n = all.filter(function (t) { return match(f[0], t); }).length;
      if (!n && f[0] !== 'all' && f[0] !== filter) return;   // hide empty filters
      h += '<button data-f="'+f[0]+'"'+(filter===f[0]?' class="on"':'')+'>'+f[1]+
           '<span class="ct">'+n+'</span></button>';
    });
    h += '</div>';

    if (!view.length) { el.innerHTML = h + '<div class="hint">Nothing here.</div>'; return; }

    // One group per area, and UCW split further by list: it runs too many
    // concurrent lists to read as a single block.
    var groups = {}, order = [];
    view.forEach(function (t) {
      var key = t.area === 'ucw' ? 'ucw · '+t.section : t.area;
      if (!groups[key]) { groups[key] = []; order.push(key); }
      groups[key].push(t);
    });
    // Most-overdue group first: the thing he is furthest behind on leads.
    order.sort(function (a, c) {
      function worst(k) {
        return Math.max.apply(null, groups[k].map(function (t) { return t.overdue_days||0; }));
      }
      return worst(c) - worst(a);
    });

    order.forEach(function (key) {
      var list = groups[key].slice().sort(function (a, c) {
        if (!a.due && !c.due) return 0;
        if (!a.due) return 1;
        if (!c.due) return -1;
        return a.due < c.due ? -1 : 1;
      });
      var f = list[0];
      var name = key.indexOf('ucw · ') === 0 ? '🎓 '+key.slice(6)
               : (AREA_IC[f.area]||'•')+' '+((state.areas&&state.areas[f.area])||f.area);
      var od = list.filter(function (t) { return t.when === 'overdue'; }).length;

      h += '<div class="grp"><div class="hd"><b>'+esc(name)+'</b><span>'+list.length+
           (od ? ' · '+od+' overdue' : '')+'</span></div><div class="body">';
      list.forEach(function (t) {
        var on = !!ticked[t.id];
        h += '<div class="task'+(on?' on':'')+'" data-tick="'+t.id+'">'+
             '<div class="box">'+(on?'✓':'')+'</div><div class="c">'+
             '<div class="tt" dir="auto">'+esc(t.title)+'</div><div class="mt">';
        if (t.when === 'overdue')  h += '<span class="od">'+t.overdue_days+'d overdue</span>';
        else if (t.when==='today') h += '<span>due today</span>';
        else if (t.due)            h += '<span>'+esc(t.due)+'</span>';
        else                       h += '<span>no date</span>';
        if (t.priority === 'high') h += '<span>🔴</span>';
        if (t.repeat)              h += '<span>🔁 '+esc(t.repeat)+'</span>';
        h += '</div></div></div>';
      });
      h += '</div></div>';
    });
    el.innerHTML = h;
  }

  function render() {
    document.getElementById('hTitle').textContent = tab === 'today' ? 'Today' : 'Tasks';
    document.getElementById('hDate').textContent =
      state && state.today ? state.today.weekday+' '+state.today.date.slice(5).replace('-','/') : '';

    var bar = document.getElementById('hStatus'), txt = document.getElementById('hStatusT');
    var cls = 'status', msg;
    if (queue.length)             { cls += ' warn'; msg = queue.length+' waiting to send'; }
    else if (health.net === false){ cls += ' bad';  msg = 'offline · showing last known'; }
    else if (state && state._updated) { msg = 'synced · published '+state._updated.slice(11); }
    else                          { cls += ' warn'; msg = 'waiting for the first publish'; }
    bar.className = cls; txt.textContent = msg;

    if (tab === 'today') renderToday(); else renderTasks();
  }

  // -------------------------------------------------------------- interaction
  document.addEventListener('click', function (e) {
    var n = e.target.closest('[data-go]');
    if (n) {
      tab = n.getAttribute('data-go');
      [].forEach.call(document.querySelectorAll('nav button'), function (x) {
        x.classList.toggle('on', x.getAttribute('data-go') === tab);
      });
      document.getElementById('s-today').classList.toggle('on', tab === 'today');
      document.getElementById('s-tasks').classList.toggle('on', tab === 'tasks');
      window.scrollTo(0, 0);
      render(); return;
    }
    var st = e.target.closest('[data-start]');
    if (st) { emit('session_start', { area: st.getAttribute('data-start') }); return; }

    var sp = e.target.closest('[data-act="stop"]');
    if (sp) { emit('session_stop', {}); return; }

    var f = e.target.closest('[data-f]');
    if (f) { filter = f.getAttribute('data-f'); render(); return; }

    var tk = e.target.closest('[data-tick]');
    if (tk) {
      var id = tk.getAttribute('data-tick');
      var task = (state.tasks||[]).filter(function (x) { return x.id === id; })[0];
      if (!task) return;
      if (local.ticked && local.ticked[id]) return;   // ticking twice is not a thing
      emit('task_tick', { id:id, title:task.title, area:task.area, section:task.section });
    }
  });

  // -------------------------------------------------------------------- boot
  cfg   = readConfig();
  state = load(STATE_KEY, null);
  queue = load(QUEUE_KEY, []);
  local = load(LOCAL_KEY, null) || freshLocal();
  if (local.date !== todayISO()) local = freshLocal();

  if (!cfg) {
    document.querySelector('main').innerHTML =
      '<div class="card diag"><div class="r"><span class="s">⚪️</span><div class="t">'+
      '<b>Not linked yet</b><span>Open the console link ending in <code>#d=…&amp;k=…</code> and keep the '+
      'whole fragment in the address bar when you add it to the Home Screen. If you just did and still '+
      'see this, you are in a Private tab, which cannot save anything.</span></div></div></div>';
    document.querySelector('nav').style.display = 'none';
  } else {
    render();            // cached state paints immediately, before any network call
    refresh(); flush();
    setInterval(function () { refresh(); flush(); }, POLL_MS);
    setInterval(function () { if (openSession()) render(); }, 30000);   // live timer
    window.addEventListener('online', function () { refresh(); flush(); });
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) { refresh(); flush(); }
    });
  }
})();
</script>
</body>
</html>
