<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>myday probe</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="probe">
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  html { height:100%; }
  /* Exactly what the console app does, so whatever happens there happens here. */
  body {
    position:fixed; inset:0; display:flex; flex-direction:column; overflow:hidden;
    background:#f2f2f7; color:#000;
    font:15px/1.5 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  }
  main { flex:1 1 auto; min-height:0; overflow-y:auto; padding:calc(env(safe-area-inset-top) + 12px) 16px 12px; }
  h1 { font-size:19px; margin-bottom:10px; }
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  td { padding:5px 0; border-bottom:.5px solid rgba(60,60,67,.15); vertical-align:top; }
  td:first-child { color:#8a8a8e; padding-right:10px; }
  td:last-child { text-align:right; font-weight:600; }
  /* A magenta bar exactly where the console's tab bar sits. If magenta does not
     touch the physical bottom of the screen, the web view is not reaching it. */
  nav {
    flex:none; background:#ff00aa; color:#fff; text-align:center;
    font-size:12.5px; font-weight:700; padding:8px 4px 3px; min-height:66px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px;
  }
  nav .ic { font-size:31px; line-height:1; }
</style>
</head>
<body>
<main>
  <h1>myday probe</h1>
  <table id="t"></table>
  <p style="margin-top:14px;color:#8a8a8e;font-size:13px">
    The magenta bar below is drawn exactly where the tab bar sits. If magenta does not run
    all the way to the physical bottom edge of the screen, the page is not reaching the bottom.
  </p>
</main>
<nav><span class="ic">&#9201;&#65039;</span>BOTTOM OF PAGE</nav>
<script>
(function () {
  function envPx(name) {
    var d = document.createElement('div');
    d.style.cssText = 'position:fixed;visibility:hidden;height:env(' + name + ')';
    document.body.appendChild(d);
    var v = getComputedStyle(d).height;
    d.remove();
    return v;
  }
  function dvh() {
    var d = document.createElement('div');
    d.style.cssText = 'position:fixed;visibility:hidden;height:100dvh';
    document.body.appendChild(d);
    var v = getComputedStyle(d).height;
    d.remove();
    return v;
  }
  var navEl = document.querySelector('nav');
  var rows = [
    ['standalone (Home Screen app)', (('standalone' in navigator) ? navigator.standalone : 'n/a') + ''],
    ['window.innerHeight', innerHeight],
    ['screen.height', screen.height],
    ['screen.height minus innerHeight', (screen.height - innerHeight) + ' px'],
    ['visualViewport.height', window.visualViewport ? Math.round(visualViewport.height) : 'n/a'],
    ['devicePixelRatio', devicePixelRatio],
    ['safe-area-inset-top', envPx('safe-area-inset-top')],
    ['safe-area-inset-bottom', envPx('safe-area-inset-bottom')],
    ['body bottom edge', Math.round(document.body.getBoundingClientRect().bottom)],
    ['nav bottom edge', Math.round(navEl.getBoundingClientRect().bottom)],
    ['gap under nav', Math.round(innerHeight - navEl.getBoundingClientRect().bottom) + ' px'],
    ['100dvh resolves to', dvh()]
  ];
  document.getElementById('t').innerHTML = rows.map(function (r) {
    return '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td></tr>';
  }).join('');
})();
</script>
</body>
</html>
