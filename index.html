<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>myday</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
  html,body{height:100%;margin:0;background:#0b0b0c;color:#e8e8ea;
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex;align-items:center;justify-content:center;text-align:center}
  a{color:#7aa2ff}
</style>
</head>
<body>
<!--
  Retired 2026-08-31. The capture page used to live here. The console at /console/ grew its
  own Talk tab, so this page had nothing left that the console did not already do.

  This is a redirect rather than a deleted file on purpose: Amir's existing "myday" Home Screen
  icon points at this URL, and deleting the file would turn that icon into a 404. The redirect
  keeps the old icon working and sends it to the console.

  The #fragment carries the deployment id and the admin token. It is passed through by hand
  below, because a browser does NOT carry a fragment across a location change on its own when
  the target URL already has none. Without this, a Home Screen icon with its own separate
  storage would land on "Not linked yet".
-->
<p>Opening myday…<br><a id="fallback" href="./console/">Tap here if nothing happens</a></p>
<script>
  var target = './console/' + (location.hash || '');
  document.getElementById('fallback').setAttribute('href', target);
  location.replace(target);
</script>
</body>
</html>
